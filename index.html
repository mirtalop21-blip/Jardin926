<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 ELITE | INTERACTIVE INTELLIGENCE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto', sans-serif; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 15px rgba(223, 255, 0, 0.05); }
        .input-elite { background: #000; border: 1px solid #333; padding: 12px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); font-weight: bold; font-size: 13px; }
        .btn-tab { padding: 15px; opacity: 0.5; transition: 0.3s; border-bottom: 2px solid transparent; text-transform: uppercase; font-weight: bold; font-family: 'Orbitron'; font-size: 10px; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.1); }
        .S-ROSA { border-left-color: #ff69b4; } .S-ROJA { border-left-color: #ff0000; }
        .S-NARANJA { border-left-color: #ffa500; } .S-CELESTE { border-left-color: #00d4ff; }
        .S-VIOLETA { border-left-color: #8a2be2; } .S-AMARILLA { border-left-color: #ffff00; }
        .S-VERDE { border-left-color: #32cd32; } .S-AZUL { border-left-color: #0000ff; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-4 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-6 py-2 font-black italic orbitron text-xl">TITANIUM 360 ELITE</div>
        <div class="text-[9px] text-zinc-500 orbitron uppercase hidden md:block">Process Engineering - J926</div>
    </div>
    <div class="flex gap-2">
        <button onclick="exportExcel()" class="bg-green-700 hover:bg-green-600 px-4 py-2 text-[10px] font-bold rounded orbitron">EXCEL SUPERVISIÓN</button>
        <label class="bg-blue-600 px-4 py-2 text-[10px] rounded cursor-pointer font-bold orbitron">
            IMPORTAR SISTEMA <input type="file" class="hidden" onchange="importData(this)">
        </label>
        <button onclick="exportJSON()" class="bg-zinc-800 px-4 py-2 text-[10px] font-bold rounded orbitron">BACKUP</button>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900/95 sticky top-[68px] z-[999] border-b border-white/5">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab flex-1">1. LEGAJO & EDICIÓN</button>
    <button onclick="show(2)" id="t2" class="btn-tab flex-1">2. 14 SALAS</button>
    <button onclick="show(3)" id="t3" class="btn-tab flex-1 text-orange-400">3. LISTA ESPERA COMPLETA</button>
    <button onclick="show(4)" id="t4" class="btn-tab flex-1 text-red-500">4. ASISTENCIA & BAJAS</button>
    <button onclick="show(5)" id="t5" class="btn-tab flex-1 text-nuke">5. INFORMES SUPERVISIÓN</button>
</nav>

<main class="p-6 max-w-[1800px] mx-auto">
    <section id="v1" class="space-y-6">
        <div class="neon-border p-6 bg-zinc-900/30 rounded-lg">
            <div class="flex gap-4 mb-8">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-5 text-2xl font-bold orbitron placeholder-zinc-800 uppercase" placeholder="BUSCAR POR DNI O APELLIDO...">
                <button onclick="alert('ESCÁNER ACTIVADO')" class="bg-white text-black px-8 font-black orbitron hover:bg-nuke transition">SCAN DNI</button>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8" id="form_container">
                <div class="space-y-3">
                    <h2 class="text-nuke border-b border-nuke/30 pb-2 orbitron font-bold uppercase italic">Datos Alumno</h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDOS Y NOMBRES">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">AUH: SI</option></select>
                        <select id="alu_os" class="input-elite"><option value="NO">O. SOCIAL: NO</option><option value="SI">O. SOCIAL: SI</option></select>
                    </div>
                </div>
                <div class="space-y-3">
                    <h2 class="text-zinc-500 border-b border-zinc-700 pb-2 orbitron font-bold uppercase italic">Madre / Tutor</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_dni" class="input-elite" placeholder="DNI"><input id="m_tel1" class="input-elite" placeholder="WHATSAPP"></div>
                    <div class="flex gap-1">
                        <input id="m_dom" class="input-elite" placeholder="DOMICILIO">
                        <button onclick="cloneDom('m')" class="bg-zinc-800 px-2 text-[10px] font-bold orbitron" title="Mismo que alumno">CLON</button>
                    </div>
                    <select id="m_edu" class="input-elite edu-selector"></select>
                    <input id="m_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
                <div class="space-y-3">
                    <h2 class="text-zinc-500 border-b border-zinc-700 pb-2 orbitron font-bold uppercase italic">Padre / Tutor</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_tel1" class="input-elite" placeholder="WHATSAPP"></div>
                    <div class="flex gap-1">
                        <input id="p_dom" class="input-elite" placeholder="DOMICILIO">
                        <button onclick="cloneDom('p')" class="bg-zinc-800 px-2 text-[10px] font-bold orbitron" title="Mismo que alumno">CLON</button>
                    </div>
                    <select id="p_edu" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
            </div>

            <div class="flex gap-4 mt-10">
                <button id="btn_save" onclick="saveData('MATRICULA')" class="flex-1 bg-nuke text-black font-black py-6 orbitron text-2xl hover:scale-[1.01] transition shadow-lg shadow-nuke/20 uppercase">Consolidar Carga</button>
                <button onclick="clearForm()" class="bg-zinc-800 px-12 font-bold orbitron uppercase text-[10px]">Limpiar</button>
            </div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-600/5 p-8 neon-border rounded-xl">
            <h2 class="orbitron text-orange-500 text-3xl font-black mb-8 flex justify-between items-center">
                LISTA DE ESPERA INTEGRAL
                <button onclick="show(1)" class="bg-orange-600 text-white text-[10px] px-6 py-2 orbitron">NUEVA CARGA ESPERA</button>
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-[11px] border-separate border-spacing-y-2">
                    <thead class="orbitron text-zinc-500 uppercase">
                        <tr>
                            <th class="p-4">Alumno</th><th class="p-4">DNI</th><th class="p-4">Sala</th><th class="p-4">Contacto Familiar</th><th class="p-4">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="espera_full_list"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="v2" class="hidden"><div id="grid_salas" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4"></div></section>
    <section id="v4" class="hidden"><div id="bajas_list" class="space-y-2"></div></section>
    <section id="v5" class="hidden"><div id="stats_panel" class="grid grid-cols-2 md:grid-cols-5 gap-6"></div></section>
</main>

<script>
    let MATRICULA = JSON.parse(localStorage.getItem('T360_MAT')) || [];
    let ESPERA = JSON.parse(localStorage.getItem('T360_ESP')) || [];
    
    const SALAS = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AMARILLA', 'VERDE', 'AZUL'];
    const EDU_LEVELS = [
        "SIN ESTUDIOS", "PRIMARIA COMPLETA", "PRIMARIA INCOMPLETA", 
        "SECUNDARIA COMPLETA", "SECUNDARIA INCOMPLETA", 
        "TERCIARIA COMPLETA", "TERCIARIA INCOMPLETA", 
        "UNIVERSITARIA COMPLETA", "UNIVERSITARIA INCOMPLETA"
    ];

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        sSel.innerHTML = '<option value="">SALA Y TURNO...</option>';
        SALAS.forEach(s => {
            ['TM', 'TT'].forEach(t => sSel.innerHTML += `<option value="${s}-${t}">${s} - ${t}</option>`);
        });

        document.querySelectorAll('.edu-selector').forEach(sel => {
            sel.innerHTML = '<option value="">ESCOLARIDAD...</option>';
            EDU_LEVELS.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
        });
        refresh();
    }

    function cloneDom(who) {
        document.getElementById(who + '_dom').value = document.getElementById('alu_dom').value;
    }

    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        const btn = document.getElementById('btn_save');
        if(val.length < 3) { btn.innerText = "Consolidar Carga"; return; }
        
        const res = MATRICULA.find(x => x.alu_dni === val || x.alu_nombre.includes(val));
        if(res) {
            Object.keys(res).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = res[k]; });
            btn.innerText = "ACTUALIZAR DATOS EXISTENTES";
            btn.classList.replace('bg-nuke', 'bg-blue-600');
        } else {
            btn.innerText = "Consolidar Carga";
            btn.classList.replace('bg-blue-600', 'bg-nuke');
        }
    }

    function saveData(type) {
        const data = {};
        document.querySelectorAll('#form_container input, #form_container select').forEach(el => data[el.id] = el.value.toUpperCase());
        if(!data.alu_dni) return alert("DNI REQUERIDO");

        const idx = MATRICULA.findIndex(x => x.alu_dni === data.alu_dni);
        if(idx > -1) MATRICULA[idx] = data; else MATRICULA.push(data);
        
        alert("BASE DE DATOS ACTUALIZADA");
        refresh(); clearForm();
    }

    function renderEspera() {
        const list = document.getElementById('espera_full_list');
        list.innerHTML = '';
        ESPERA.forEach((e, i) => {
            list.innerHTML += `
                <tr class="bg-zinc-900/50 hover:bg-zinc-800 transition">
                    <td class="p-4 font-bold text-nuke">${e.alu_nombre}</td>
                    <td class="p-4">${e.alu_dni}</td>
                    <td class="p-4">${e.alu_sala}</td>
                    <td class="p-4 text-zinc-500">${e.m_tel1 || e.p_tel1}</td>
                    <td class="p-4"><button onclick="promote(${i})" class="text-orange-500 font-bold orbitron">ADMITIR</button></td>
                </tr>`;
        });
    }

    function promote(i) {
        MATRICULA.push(ESPERA[i]);
        ESPERA.splice(i, 1);
        refresh(); alert("ALUMNO PASADO A MATRÍCULA");
    }

    function refresh() {
        localStorage.setItem('T360_MAT', JSON.stringify(MATRICULA));
        localStorage.setItem('T360_ESP', JSON.stringify(ESPERA));
        renderEspera();
    }

    function clearForm() { 
        document.querySelectorAll('#form_container input, #form_container select').forEach(i => i.value = ''); 
        document.getElementById('btn_save').innerText = "Consolidar Carga";
        document.getElementById('btn_save').className = "flex-1 bg-nuke text-black font-black py-6 orbitron text-2xl hover:scale-[1.01] transition shadow-lg shadow-nuke/20 uppercase";
    }

    function show(n) {
        document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
        document.getElementById('v'+n).classList.remove('hidden');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
        document.getElementById('t'+n).classList.add('active-tab');
    }

    function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(MATRICULA);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "MATRICULA");
        XLSX.writeFile(wb, "SUPERVISION_J926.xlsx");
    }
</script>
</body>
</html>
