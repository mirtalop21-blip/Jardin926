                    <select id="p_est" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
            </div>
            <button onclick="saveData('mat')" class="w-full mt-4 bg-nuke text-black font-black py-5 orbitron text-xl shadow-lg">CONSOLIDAR MATRÍCULA NUCLEAR</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-8" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-10 bg-black/95 rounded-2xl shadow-2xl border-t-4 border-nuke">
            <div class="flex justify-between items-center border-b-2 border-nuke pb-4 mb-8">
                <h3 id="sala_title" class="text-4xl font-black orbitron text-nuke uppercase"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-6 py-2 orbitron font-black text-xs rounded text-white">CERRAR X</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-950/20 p-8 neon-border rounded-xl border-l-8 border-orange-600 shadow-2xl">
            <h2 class="orbitron text-orange-500 text-2xl font-black mb-6 uppercase flex justify-between">ESPERA PRO <button onclick="show(1)" class="bg-orange-600 text-white px-4 py-2 text-[10px] rounded uppercase">Carga Manual</button></h2>
            <div class="overflow-x-auto"><table class="w-full text-left text-[10px]"><thead class="orbitron text-zinc-500 border-b border-orange-900/30 uppercase"><tr><th class="p-2">Aspirante</th><th class="p-2">DNI / Edad 30-6</th><th class="p-2">Tutor / Teléfono</th><th class="p-2">Acción</th></tr></thead><tbody id="espera_table"></tbody></table></div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-blue-950/20 p-8 neon-border rounded-xl border-l-8 border-pro">
            <h2 class="orbitron text-pro text-2xl font-black mb-6 uppercase text-center">Asistencia Espejo</h2>
            <select id="asis_sala_select" onchange="renderAsistencia()" class="input-elite mb-6"></select>
            <div id="asis_lista_render" class="space-y-1 mb-8 max-h-80 overflow-y-auto pr-2"></div>
        </div>
        <div class="bg-red-950/20 p-8 neon-border rounded-xl border-l-8 border-red-600">
            <h2 class="orbitron text-red-500 text-2xl font-black mb-6 uppercase text-center">Bajas</h2>
            <div id="bajas_detalle" class="bg-black/50 p-4 rounded text-[10px] min-h-[150px]"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="supervision_cards"></div>
    </section>
</main>

<script>
    let DATA = JSON.parse(localStorage.getItem('T360_J926_FINAL_REVISION')) || { mat: [], esp: [], bajas: [] };
    const SALAS_INST = [
        {id:'Rosa-TM', color:'ROSA', turno:'TM', seccion:'1ºA'}, {id:'Rosa-TT', color:'ROSA', turno:'TT', seccion:'1ºB'},
        {id:'Naranja-TM', color:'NARANJA', turno:'TM', seccion:'ME A'}, {id:'Naranja-TT', color:'NARANJA', turno:'TT', seccion:'ME B'},
        {id:'Roja-TM', color:'ROJA', turno:'TM', seccion:'2ºA'}, {id:'Roja-TT', color:'ROJA', turno:'TT', seccion:'2ºC'},
        {id:'Celeste-TM', color:'CELESTE', turno:'TM', seccion:'2ºB'}, {id:'Celeste-TT', color:'CELESTE', turno:'TT', seccion:'2ºD'},
        {id:'Violeta-TM', color:'VIOLETA', turno:'TM', seccion:'3ºA'}, {id:'Violeta-TT', color:'VIOLETA', turno:'TT', seccion:'3ºD'},
        {id:'Amarilla-TM', color:'AMARILLA', turno:'TM', seccion:'3ºB'}, {id:'Amarilla-TT', color:'AMARILLA', turno:'TT', seccion:'3ºE'},
        {id:'Azul-TM', color:'AZUL', turno:'TM', seccion:'3ºC'}, {id:'Azul-TT', color:'AZUL', turno:'TT', seccion:'3ºF'}
    ];
    const EDU_LEVELS = ["SIN ESTUDIOS", "PRIMARIA COMP.", "PRIMARIA INC.", "SECUNDARIA COMP.", "SECUNDARIA INC.", "TERCIARIA COMP.", "TERCIARIA INC.", "UNIVERSITARIO COMP.", "UNIVERSITARIO INC."];

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        SALAS_INST.forEach(s => {
            const opt = `<option value="${s.id}">${s.seccion} (${s.turno}) - ${s.color}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt;
        });
        document.querySelectorAll('.edu-selector').forEach(sel => {
            sel.innerHTML = '<option value="">SELECCIONAR ESCOLARIDAD...</option>';
            EDU_LEVELS.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
        });
        sync();
    }

    function sync() {
        localStorage.setItem('T360_J926_FINAL_REVISION', JSON.stringify(DATA));
        document.getElementById('header_total').innerText = DATA.mat.length;
        renderGrid(); renderEspera(); renderSupervision(); renderAsistencia();
    }

    function renderSupervision() {
        const container = document.getElementById('supervision_cards'); container.innerHTML = '';
        SALAS_INST.forEach(s => {
            const list = DATA.mat.filter(x => x.alu_sala === s.id);
            const total = list.length;
            
            // Matemática Real por Sala
            const extr = list.filter(x => x.alu_nac && !x.alu_nac.toUpperCase().includes('ARG')).length;
            const trab = list.filter(x => x.m_ocu && !["DESOCUPADO","SIN TRABAJO","AMA DE CASA"].includes(x.m_ocu.toUpperCase())).length;
            const edu = list.filter(x => x.m_est && x.m_est.includes('COMP.')).length;
            const auh = list.filter(x => x.alu_auh === 'SI').length;

            container.innerHTML += `<div class="card-sala S-${s.color} text-left"><h3 class="orbitron text-nuke text-[10px] mb-2 font-black">${s.seccion}</h3><div class="space-y-1 text-[8px] font-black uppercase"><div class="flex justify-between border-b border-white/5"><span>Matrícula:</span><span>${total}</span></div><div class="flex justify-between border-b border-white/5"><span>Extranjeros:</span><span class="text-orange-400">${total>0?Math.round((extr/total)*100):0}%</span></div><div class="flex justify-between border-b border-white/5"><span>Trabajo:</span><span class="text-pro">${total>0?Math.round((trab/total)*100):0}%</span></div><div class="flex justify-between border-b border-white/5"><span>Estudios Comp:</span><span class="text-blue-400">${total>0?Math.round((edu/total)*100):0}%</span></div><div class="flex justify-between"><span>AUH:</span><span class="text-nuke">${total>0?Math.round((auh/total)*100):0}%</span></div></div></div>`;
        });
    }

    function viewSala(id, seccion) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${seccion}`; l.innerHTML = '';
        DATA.mat.filter(x => x.alu_sala === id).forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-4 border-l-4 border-nuke flex flex-col gap-2 shadow-xl rounded">
                <p class="font-black text-sm uppercase text-white">${a.alu_nombre}</p>
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <button onclick="editAlu('${a.alu_dni}')" class="bg-nuke text-black font-black py-2 rounded text-[7px] orbitron">VER LEGAJO / EDITAR</button>
                    <button onclick="processBaja('${a.alu_dni}')" class="bg-red-900 text-white font-black py-2 rounded text-[7px] orbitron">DAR BAJA</button>
                    <button onclick="sendWA_manual('${a.m_tel}', '${a.p_tel}', '${a.alu_nombre}')" class="bg-green-700 text-white font-black py-2 rounded text-[7px] orbitron">📲 WA</button>
                    <button onclick="editAlu('${a.alu_dni}')" class="bg-blue-600 text-white font-black py-2 rounded text-[7px] orbitron">GUARDAR</button>
                </div></div>`;
        });
        v.classList.remove('hidden'); v.scrollIntoView({behavior:'smooth'});
    }

    function editAlu(dni) {
        const alu = DATA.mat.find(x => x.alu_dni === dni) || DATA.esp.find(x => x.alu_dni === dni);
        if(alu) { 
            Object.keys(alu).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = alu[k]; });
            calcEdad(); show(1); window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function smartRadar(type) {
        const val = document.getElementById('radar_global').value.toUpperCase();
        if(val.length < 3) return;
        const res = DATA.mat.find(x => (x.alu_dni && x.alu_dni.includes(val)) || (x.alu_nombre && x.alu_nombre.includes(val)));
        if(res) { editAlu(res.alu_dni); }
    }

    function renderAsistencia() {
        const id = document.getElementById('asis_sala_select').value;
        const list = DATA.mat.filter(x => x.alu_sala === id);
        document.getElementById('asis_lista_render').innerHTML = list.map(a => `<div class="bg-zinc-900 p-2 flex justify-between items-center border-l-2 border-pro mb-1"><span class="font-black uppercase text-[9px]">${a.alu_nombre}</span><div class="flex gap-1"><button class="bg-green-800 p-1 px-2 rounded text-[8px]">P</button><button class="bg-red-800 p-1 px-2 rounded text-[8px]">A</button></div></div>`).join('');
    }

    function processBaja(dni) {
        const motivo = prompt("MOTIVO DE BAJA:");
        const index = DATA.mat.findIndex(x => x.alu_dni === dni);
        if(index > -1 && motivo) {
            DATA.bajas.push({...DATA.mat[index], motivo_baja: motivo, fecha: new Date().toLocaleDateString()});
            DATA.mat.splice(index, 1); sync();
            document.getElementById('sala_detail').classList.add('hidden');
        }
    }

    function renderEspera() {
        const tb = document.getElementById('espera_table'); tb.innerHTML = '';
        DATA.esp.forEach((e, i) => {
            tb.innerHTML += `<tr class="border-b border-zinc-800 text-white"><td class="p-2">${e.alu_nombre}</td><td>${e.alu_dni}</td><td>${e.m_tel}</td><td><button onclick="DATA.mat.push(DATA.esp[i]);DATA.esp.splice(i,1);sync();" class="bg-pro px-3 py-1 font-black text-[8px] rounded uppercase">ADMITIR</button></td></tr>`;
        });
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                DATA = JSON.parse(e.target.result);
                sync();
                alert("DATOS CARGADOS CON ÉXITO");
            } catch(err) { alert("ERROR EN ARCHIVO"); }
        };
        reader.readAsText(input.files[0]);
    }

    function saveData(type) {
        const alu = {};
        document.querySelectorAll('#form_master input, #form_master select, #form_master textarea').forEach(i => alu[i.id] = i.value.toUpperCase());
        if(!alu.alu_dni) return alert("DNI REQUERIDO");
        const idx = DATA.mat.findIndex(x => x.alu_dni === alu.alu_dni);
        if(idx > -1) DATA.mat[idx] = alu; else DATA.mat.push(alu);
        sync(); alert("CAMBIOS GUARDADOS.");
    }

    function show(n) { 
        document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); 
        document.getElementById('v'+n).classList.remove('hidden'); 
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); 
        document.getElementById('t'+n).classList.add('active-tab'); 
    }

    function calcEdad() { 
        const f = new Date(document.getElementById('alu_f_nac').value); 
        const ref = new Date('2026-06-30'); 
        let e = ref.getFullYear() - f.getFullYear(); 
        if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) e--; 
        document.getElementById('label_edad').innerText = `${e} AÑOS`; 
        return e; 
    }

    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => {
            const cant = DATA.mat.filter(x => x.alu_sala === s.id).length;
            grid.innerHTML += `<div onclick="viewSala('${s.id}', '${s.seccion}')" class="card-sala S-${s.color}"><p class="orbitron text-[8px] font-black opacity-60">${s.turno}</p><p class="font-black text-[10px] uppercase">${s.color}</p><h4 class="text-3xl font-black text-nuke">${cant}</h4><p class="text-[9px] font-bold text-zinc-500">${s.seccion}</p></div>`;
        });
    }

    function sendWA_manual(m, p, nombre) { 
        const tel = prompt("1-Madre ("+(m||'S/D')+"), 2-Padre ("+(p||'S/D')+")", "1") === "1" ? m : p; 
        if(!tel) return alert("SIN TELÉFONO"); 
        window.open(`https://wa.me/${tel}?text=JARDIN 926: Hola, nos comunicamos por ${nombre}.`, '_blank'); 
    }
</script>
</body>
</html>
