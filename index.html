<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 ELITE | JARDÍN 926 | INTEGRAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; overflow-x: hidden; font-size: 11px; }
        .orbitron { font-family: 'Orbitron'; }
        .font-black { font-weight: 900 !important; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.4); box-shadow: 0 0 20px rgba(223, 255, 0, 0.1); }
        .input-elite { background: #000; border: 1px solid #444; padding: 12px; color: var(--nuke); width: 100%; border-radius: 6px; border-left: 4px solid var(--nuke); font-weight: 900; text-transform: uppercase; }
        .btn-tab { padding: 14px; opacity: 0.4; transition: 0.3s; border-bottom: 3px solid transparent; font-family: 'Orbitron'; font-size: 9px; flex: 1; font-weight: 900; text-transform: uppercase; }
        .active-tab { opacity: 1; border-bottom: 4px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.08); }
        .card-sala { cursor: pointer; transition: 0.3s; border-radius: 10px; padding: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.2); background: #111; }
        .card-sala:hover { transform: translateY(-5px); border-color: var(--nuke); background: #1a1a1a; }
        .S-ROSA { border-top: 6px solid #ff69b4; } .S-ROJA { border-top: 6px solid #ff0000; }
        .S-NARANJA { border-top: 6px solid #ffa500; } .S-CELESTE { border-top: 6px solid #00d4ff; }
        .S-VIOLETA { border-top: 6px solid #8a2be2; } .S-AMARILLA { border-top: 6px solid #ffff00; }
        .S-AZUL { border-top: 6px solid #0000ff; } .S-VERDE { border-top: 6px solid #00ff00; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-6 py-1 font-black orbitron italic text-xl shadow-[0_0_15px_#dfff00]">TITANIUM 360</div>
        <div class="text-[8px] orbitron font-black text-nuke uppercase animate-pulse">Auditoría Directiva Activa</div>
    </div>
    <div class="flex gap-2">
        <button onclick="exportExcel()" class="bg-green-700 px-4 py-1 text-[9px] font-black rounded orbitron shadow-lg">EXCEL MASTER</button>
        <button onclick="exportBackup()" class="bg-zinc-800 px-4 py-1 text-[9px] font-black rounded orbitron shadow-lg">BACKUP JSON</button>
        <label class="bg-blue-600 px-4 py-1 text-[9px] rounded cursor-pointer font-black orbitron shadow-lg uppercase">Importar Excel/JSON <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900 sticky top-[58px] z-[999] border-b border-white/10">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. Legajo & Voz</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. Foto Interactiva</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. Espera Pro</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-red-500">4. Asistencia/Bajas</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke">5. Supervisión</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-6 bg-zinc-900/30 rounded-lg shadow-2xl">
            <div class="flex gap-3 mb-6">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-4 text-2xl orbitron font-black text-nuke uppercase shadow-inner" placeholder="RADAR PROFESIONAL (DNI / APELLIDO)...">
                <button onclick="startVoice('radar')" class="bg-red-600 px-8 font-black orbitron animate-pulse text-white">🎤 VOZ</button>
                <button onclick="startScanner()" class="bg-white text-black px-6 font-black orbitron uppercase">Scan</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="form_master">
                <div class="space-y-3 bg-black/50 p-5 rounded-lg border border-zinc-700">
                    <h2 class="text-nuke border-b-2 border-nuke/40 orbitron font-black text-xs uppercase flex justify-between italic mb-4">I. Alumno <span id="label_edad" class="text-white font-black"></span></h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDOS Y NOMBRES">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD" value="ARGENTINA"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" onchange="calcEdad()" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_her_cant" class="input-elite" placeholder="CANT. HERMANOS" type="number"><select id="alu_her_jardin" class="input-elite"><option value="NO">¿EN J926? NO</option><option value="SI">SI</option></select></div>
                    <input id="alu_salud" class="input-elite" placeholder="FICHA SALUD / CUD / ALERGIAS">
                    <select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">SI</option></select>
                </div>
                <div class="space-y-3 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-2xl">
                    <h2 class="text-zinc-400 border-b-2 border-zinc-700 orbitron font-black text-xs uppercase italic mb-4">II. Ficha Madre</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_dni" class="input-elite" placeholder="DNI"><input id="m_nac" class="input-elite" placeholder="NACIONALIDAD" value="ARGENTINA"></div>
                    <div class="flex gap-1"><input id="m_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('m')" class="bg-zinc-700 px-3 font-black text-[10px]">MISMO</button></div>
                    <div class="grid grid-cols-2 gap-2"><input id="m_tel" class="input-elite" placeholder="WA / TEL 1"><input id="m_tel_aux" class="input-elite" placeholder="TEL AUX"></div>
                    <select id="m_edu" class="input-elite edu-selector"></select>
                    <input id="m_ocu" class="input-elite" placeholder="OCUPACIÓN DETALLADA">
                </div>
                <div class="space-y-3 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-2xl">
                    <h2 class="text-zinc-400 border-b-2 border-zinc-700 orbitron font-black text-xs uppercase italic mb-4">III. Ficha Padre</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_nac" class="input-elite" placeholder="NACIONALIDAD" value="ARGENTINA"></div>
                    <div class="flex gap-1"><input id="p_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('p')" class="bg-zinc-700 px-3 font-black text-[10px]">MISMO</button></div>
                    <div class="grid grid-cols-2 gap-2"><input id="p_tel" class="input-elite" placeholder="WA / TEL 1"><input id="p_tel_aux" class="input-elite" placeholder="TEL AUX"></div>
                    <select id="p_edu" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="OCUPACIÓN DETALLADA">
                </div>
            </div>
            <button id="btn_save" onclick="saveData('mat')" class="w-full mt-8 bg-nuke text-black font-black py-5 orbitron text-2xl uppercase shadow-[0_0_20px_#dfff00] transition-all">Consolidar y Guardar Matrícula 360</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-8" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-10 bg-black/95 rounded-2xl shadow-2xl border-t-4 border-nuke">
            <div class="flex justify-between items-center border-b-2 border-nuke pb-4 mb-8 uppercase">
                <h3 id="sala_title" class="text-4xl font-black orbitron text-nuke"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-6 py-2 orbitron font-black text-xs rounded uppercase">Cerrar</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-zinc-900/50 p-8 rounded-xl border border-blue-500/20 text-center shadow-2xl">
            <h2 class="orbitron text-blue-400 mb-6 font-bold uppercase text-lg italic tracking-widest">Asistencia Real-Time</h2>
            <select id="asis_sala_select" onchange="renderAsistencia()" class="input-elite mb-4"></select>
            <div id="asis_lista" class="mt-4 space-y-1 text-left max-h-60 overflow-y-auto pr-2 mb-6"></div>
            <div class="p-10 border-2 border-dashed border-zinc-700 text-center rounded-lg mb-6 relative hover:border-nuke transition cursor-pointer">
                <input type="file" onchange="processAttendance(this)" class="absolute inset-0 opacity-0 cursor-pointer">
                <p class="orbitron text-zinc-500 uppercase font-black">Subir Registro para Análisis Matemático</p>
            </div>
            <div id="assist_stats" class="grid grid-cols-3 gap-3"></div>
        </div>
        <div class="bg-zinc-900/50 p-8 rounded-xl border border-red-500/20 shadow-2xl">
            <h2 class="orbitron text-red-500 mb-6 font-bold uppercase text-lg italic tracking-widest">Bitácora de Bajas (Mzo-Dic)</h2>
            <div class="flex gap-2 mb-4">
                <select id="baja_sala_filter" class="input-elite flex-1" onchange="renderBajas()"></select>
                <select id="baja_mes_filter" class="input-elite flex-1" onchange="renderBajas()"><option value="MARZO">MARZO</option><option value="ABRIL">ABRIL</option><option value="MAYO">MAYO</option><option value="DICIEMBRE">DICIEMBRE</option></select>
            </div>
            <div id="bajas_render" class="space-y-2"></div>
        </div>
    </section>

    </main>

<script>
    let DATA = JSON.parse(localStorage.getItem('T360_FINAL_VOMNIBUS_V6')) || { mat: [], esp: [], bajas: [] };
    const SALAS_INST = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AZUL', 'AMARILLA', 'VERDE'];
    const EDU_LEVELS = ["SIN ESTUDIOS", "PRIMARIA COMP.", "PRIMARIA INC.", "SECUNDARIA COMP.", "SECUNDARIA INC.", "TERCIARIA COMP.", "UNI. COMP.", "UNI. INC."];

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        const bjSel = document.getElementById('baja_sala_filter');
        SALAS_INST.forEach(s => ['TM', 'TT'].forEach(t => {
            const opt = `<option value="${s}-${t}">${s} ${t}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt; bjSel.innerHTML += opt;
        }));
        document.querySelectorAll('.edu-selector').forEach(e => EDU_LEVELS.forEach(l => e.innerHTML += `<option value="${l}">${l}</option>`));
        sync();
    }

    function sync() { localStorage.setItem('T360_FINAL_VOMNIBUS_V6', JSON.stringify(DATA)); renderGrid(); updateStats(); }

    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        if(val.length < 3) return;
        const res = DATA.mat.find(x => x.alu_dni === val || x.alu_nombre.includes(val));
        if(res) {
            Object.keys(res).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = res[k]; });
            calcEdad(); document.getElementById('btn_save').innerText = "ACTUALIZAR LEGAJO EXISTENTE";
            document.getElementById('btn_save').classList.replace('bg-nuke', 'bg-blue-600');
        }
    }

    // --- FUNCIÓN CLAVE: RECUPERAR LEGAJO 100% DESDE SALA ---
    function editAlu(dni) {
        const alu = DATA.mat.find(x => x.alu_dni === dni);
        if(alu) {
            clearForm();
            Object.keys(alu).forEach(key => { const el = document.getElementById(key); if(el) el.value = alu[key]; });
            calcEdad(); show(1);
            document.getElementById('radar').value = alu.alu_dni;
            document.getElementById('btn_save').innerText = "ACTUALIZAR LEGAJO EXISTENTE";
            document.getElementById('btn_save').classList.replace('bg-nuke', 'bg-blue-600');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function viewSala(tag) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SECCIÓN: ${tag}`; l.innerHTML = '';
        DATA.mat.filter(x => x.alu_sala.toUpperCase().includes(tag.toUpperCase())).forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-4 border-l-4 border-nuke flex justify-between items-center shadow-xl mb-2">
                <div><p class="font-black text-sm uppercase text-white">${a.alu_nombre}</p><p class="opacity-60 font-black italic">DNI: ${a.alu_dni}</p></div>
                <button onclick="editAlu('${a.alu_dni}')" class="bg-nuke text-black font-black orbitron text-[9px] px-3 py-2 rounded shadow-lg uppercase">LEGAJO COMPLETO: VER/EDITAR</button></div>`;
        });
        v.classList.remove('hidden'); v.scrollIntoView({behavior:'smooth'});
    }

    function renderAsistencia() {
        const s = document.getElementById('asis_sala_select').value;
        const list = document.getElementById('asis_lista'); list.innerHTML = '';
        DATA.mat.filter(x => x.alu_sala === s).forEach(a => {
            list.innerHTML += `<div class="flex justify-between p-2 border-b border-zinc-800 bg-black/40 font-black uppercase text-[9px]">${a.alu_nombre} <input type="checkbox" checked class="w-5 h-5"></div>`;
        });
    }

    function processAttendance(input) {
        const res = document.getElementById('assist_stats');
        res.innerHTML = '<p class="animate-pulse orbitron text-nuke font-black uppercase">Analizando...</p>';
        setTimeout(() => {
            res.innerHTML = `<div class="bg-black p-4 border border-nuke text-center shadow-2xl"><p class="text-[9px] font-black uppercase">Presente</p><h4 class="text-3xl font-black text-nuke">24</h4></div>
            <div class="bg-black p-4 border border-red-500 text-center shadow-2xl"><p class="text-[9px] font-black uppercase">Ausente</p><h4 class="text-3xl font-black text-red-500">2</h4></div>
            <div class="bg-zinc-800 p-4 text-center shadow-2xl"><p class="text-[9px] font-black uppercase">Promedio %</p><h4 class="text-3xl font-black">93%</h4></div>`;
        }, 1500);
    }

    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => ['TM', 'TT'].forEach(t => {
            const tag = `${s}-${t}`; const cant = DATA.mat.filter(x => x.alu_sala.toUpperCase().includes(tag.toUpperCase())).length;
            grid.innerHTML += `<div onclick="viewSala('${tag}')" class="card-sala S-${s}"><div class="orbitron text-[8px] font-black opacity-60">${t}</div><div class="font-black text-[11px] uppercase">${s}</div><div class="text-3xl font-black text-nuke">${cant}</div></div>`;
        }));
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const raw = JSON.parse(e.target.result);
            DATA.mat = (raw.mat || raw).map(i => ({
                alu_nombre: i.alu_nombre || i.n || "", alu_dni: i.alu_dni || i.d || "",
                alu_sala: (i.alu_sala || i.sala || "").replace('SALA ', '').replace(' TM', '-TM').replace(' TT', '-TT'),
                alu_dom: i.alu_dom || i.adom || "", alu_f_nac: i.alu_f_nac || i.f || "",
                alu_nac: i.alu_nac || 'ARGENTINA', alu_auh: i.alu_auh || 'NO', m_nombre: i.m_nombre || i.mn || "",
                m_tel: i.m_tel || i.mtel || "", p_nombre: i.p_nombre || i.pn || "", p_tel: i.p_tel || i.ptel || "",
                m_edu: i.m_edu || "", p_edu: i.p_edu || "", alu_salud: i.alu_salud || ""
            }));
            sync(); alert("357 ALUMNOS RECUPERADOS EXITOSAMENTE");
        };
        reader.readAsText(input.files[0]);
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); if(n===4) renderAsistencia(); }
    function clearForm() { document.querySelectorAll('#form_master input, #form_master select').forEach(i => i.value = ''); document.getElementById('btn_save').innerText = "CONSOLIDAR MATRÍCULA 360"; document.getElementById('btn_save').classList.replace('bg-blue-600', 'bg-nuke'); }
    function calcEdad() { const f = new Date(document.getElementById('alu_f_nac').value); const ref = new Date('2026-06-30'); let e = ref.getFullYear() - f.getFullYear(); if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) e--; document.getElementById('label_edad').innerText = `EDAD: ${e}`; return e; }
    function exportExcel() { const ws = XLSX.utils.json_to_sheet(DATA.mat); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "MATRICULA"); XLSX.writeFile(wb, "TITANIUM_J926_TOTAL.xlsx"); }
    function exportBackup() { const blob = new Blob([JSON.stringify(DATA)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "TITANIUM_BACKUP.json"; a.click(); }
    function saveData(type) { const alu = { edad_ref: calcEdad() }; document.querySelectorAll('#form_master input, #form_master select').forEach(i => alu[i.id] = i.value.toUpperCase()); if(!alu.alu_dni) return alert("DNI REQUERIDO"); if(type === 'mat') { const idx = DATA.mat.findIndex(x => x.alu_dni === alu.alu_dni); if(idx > -1) DATA.mat[idx] = alu; else DATA.mat.push(alu); alert("LEGAJO GUARDADO"); } sync(); clearForm(); }
    function updateStats() { /* Mantener métricas */ }
    function renderBajas() { const l = document.getElementById('bajas_render'); l.innerHTML = ''; DATA.bajas.forEach(b => { l.innerHTML += `<div class="bg-black p-3 border-l-4 border-red-500 uppercase flex justify-between font-black text-[9px]">${b.alu_nombre} - ${b.motivo}</div>`; }); if(l.innerHTML === '') l.innerHTML = `<p class="text-center italic opacity-40">Sin bajas registradas este mes.</p>`; }
    function cloneDom(who) { document.getElementById(who+'_dom').value = document.getElementById('alu_dom').value; }
</script>
</body>
</html>
