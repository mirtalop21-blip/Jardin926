                </div>
                <div class="space-y-3 bg-black/40 p-4 rounded border border-zinc-800">
                    <h2 class="text-zinc-500 border-b border-zinc-700 orbitron font-bold uppercase italic">Padre (Espejo)</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_nac" class="input-elite" placeholder="NACIONALIDAD" value="ARGENTINA"></div>
                    <div class="flex gap-1"><input id="p_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('p')" class="bg-zinc-800 px-2 font-bold text-[9px]">MISMO</button></div>
                    <div class="grid grid-cols-2 gap-2"><input id="p_tel" class="input-elite" placeholder="WHATSAPP"><input id="p_tel_aux" class="input-elite" placeholder="TEL AUX"></div>
                    <select id="p_edu" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="OCUPACIÓN / TRABAJO">
                </div>
            </div>
            <button id="btn_save" onclick="saveData('mat')" class="w-full mt-6 bg-nuke text-black font-black py-4 orbitron text-xl hover:brightness-110 uppercase shadow-lg shadow-nuke/30">Consolidar Legajo 360</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-6" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-8 bg-black/95 rounded-xl shadow-2xl border-t-2 border-nuke">
            <div class="flex justify-between items-center border-b border-nuke pb-4 mb-4 uppercase">
                <h3 id="sala_title" class="text-2xl font-black orbitron text-nuke"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-4 py-1 rounded font-bold text-[9px]">CERRAR X</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-950/20 p-8 neon-border rounded-xl shadow-2xl border-l-4 border-orange-500">
            <div class="flex justify-between items-center mb-6">
                <h2 class="orbitron text-orange-500 text-2xl font-bold uppercase">Terminal de Lista de Espera</h2>
                <div class="flex gap-2">
                    <button onclick="startScanner('esp')" class="bg-white text-black px-4 py-2 orbitron font-bold text-[9px]">SCAN DNI</button>
                    <button onclick="saveData('esp')" class="bg-orange-600 px-4 py-2 orbitron font-bold text-white text-[9px]">CARGA MANUAL</button>
                </div>
            </div>
            <div class="overflow-x-auto"><table class="w-full text-left text-[10px]"><thead class="orbitron text-zinc-500 border-b border-orange-500/30 uppercase"><tr><th class="p-3">Aspirante</th><th class="p-3">DNI / Edad 30-6</th><th class="p-3">Sala</th><th class="p-3">Padres/Tel</th><th class="p-3">Acción</th></tr></thead><tbody id="espera_table"></tbody></table></div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-zinc-900/50 p-8 rounded-xl border border-blue-500/20 shadow-2xl text-center">
            <h2 class="orbitron text-blue-400 mb-6 font-bold uppercase text-lg">Asistencia Real-Time Analítica</h2>
            <select id="asis_sala_select" onchange="processAttendance()" class="input-elite mb-4"></select>
            <div class="p-10 border-2 border-dashed border-zinc-800 text-center rounded-lg mb-6 relative hover:border-nuke transition cursor-pointer">
                <input type="file" id="asis_file" class="absolute inset-0 opacity-0 cursor-pointer">
                <p class="orbitron text-zinc-500 uppercase">Subir Foto de Registro para Análisis Matemático</p>
            </div>
            <div id="assist_stats" class="grid grid-cols-3 gap-3"></div>
        </div>
        <div class="bg-zinc-900/50 p-8 rounded-xl border border-red-500/20 shadow-2xl">
            <h2 class="orbitron text-red-500 mb-4 font-bold uppercase text-lg">Bitácora de Bajas (Marzo-Diciembre)</h2>
            <div class="flex gap-2 mb-4">
                <select id="baja_sala_filter" class="input-elite flex-1" onchange="renderBajas()"></select>
                <select id="baja_mes_filter" class="input-elite flex-1" onchange="renderBajas()">
                    <option value="TODOS">TODOS LOS MESES</option><option value="MARZO">MARZO</option><option value="ABRIL">ABRIL</option><option value="MAYO">MAYO</option>
                    <option value="JUNIO">JUNIO</option><option value="JULIO">JULIO</option><option value="AGOSTO">AGOSTO</option><option value="SEPTIEMBRE">SEPTIEMBRE</option><option value="OCTUBRE">OCTUBRE</option><option value="NOVIEMBRE">NOVIEMBRE</option><option value="DICIEMBRE">DICIEMBRE</option>
                </select>
            </div>
            <div id="bajas_list" class="space-y-1"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-8">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats_elite"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[400px]">
            <div class="bg-black p-4 rounded border border-zinc-800 shadow-2xl"><canvas id="chart_salas"></canvas></div>
            <div class="bg-black p-4 rounded border border-zinc-800 shadow-2xl"><canvas id="chart_socio"></canvas></div>
        </div>
    </section>
</main>

<script>
    let DATA = JSON.parse(localStorage.getItem('T360_J926_V6')) || { mat: [], esp: [], bajas: [] };
    const SALAS_INST = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AZUL', 'AMARILLA', 'VERDE'];
    const EDU_LEVELS = ["PRIMARIA COMP.", "PRIMARIA INC.", "SECUNDARIA COMP.", "SECUNDARIA INC.", "TERCIARIA COMP.", "TERCIARIA INC.", "UNI. COMP.", "UNI. INC."];

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        const bjSel = document.getElementById('baja_sala_filter');
        SALAS_INST.forEach(s => { ['TM', 'TT'].forEach(t => {
            const opt = `<option value="${s}-${t}">${s} ${t}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt; bjSel.innerHTML += opt;
        });});
        document.querySelectorAll('.edu-selector').forEach(e => { EDU_LEVELS.forEach(l => e.innerHTML += `<option value="${l}">${l}</option>`); });
        sync();
    }

    function sync() { localStorage.setItem('T360_J926_V6', JSON.stringify(DATA)); renderGrid(); renderEspera(); renderBajas(); updateStats(); }

    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        if(val.length < 3) return;
        const res = DATA.mat.find(x => x.alu_dni === val || x.alu_nombre.includes(val));
        if(res) {
            Object.keys(res).forEach(key => { const el = document.getElementById(key); if(el) el.value = res[key]; });
            calcEdad();
            document.getElementById('btn_save').innerText = "ACTUALIZAR LEGAJO EXISTENTE";
            document.getElementById('btn_save').classList.replace('bg-nuke', 'bg-blue-600');
        }
    }

    // --- FUNCIÓN CLAVE: RECUPERAR LEGAJO 100% DESDE SALA ---
    function editAlu(dni) {
        const alu = DATA.mat.find(x => x.alu_dni === dni);
        if(alu) {
            clearForm();
            Object.keys(alu).forEach(key => { const el = document.getElementById(key); if(el) el.value = alu[key]; });
            calcEdad();
            show(1);
            document.getElementById('radar').value = alu.alu_dni;
            document.getElementById('btn_save').innerText = "ACTUALIZAR LEGAJO";
            document.getElementById('btn_save').classList.replace('bg-nuke', 'bg-blue-600');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function viewSala(tag) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${tag} | INSTITUCIONAL`; l.innerHTML = '';
        DATA.mat.filter(x => x.alu_sala.includes(tag)).forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-3 border-l-2 border-nuke flex justify-between items-center shadow-lg">
                <div><p class="font-bold text-[10px] text-white uppercase">${a.alu_nombre}</p><p class="opacity-40 text-[8px]">DNI: ${a.alu_dni}</p></div>
                <button onclick="editAlu('${a.alu_dni}')" class="text-nuke font-bold orbitron text-[8px] border border-nuke/30 px-2 py-1">VER LEGAJO</button></div>`;
        });
        v.classList.remove('hidden');
    }

    function saveData(type) {
        const alu = { edad_ref: calcEdad() };
        document.querySelectorAll('#form_master input, #form_master select').forEach(i => alu[i.id] = i.value.toUpperCase());
        if(!alu.alu_dni) return alert("DNI REQUERIDO");
        if(type === 'mat') {
            const idx = DATA.mat.findIndex(x => x.alu_dni === alu.alu_dni);
            if(idx > -1) DATA.mat[idx] = alu; else DATA.mat.push(alu);
            alert("MATRÍCULA ACTUALIZADA");
        } else { DATA.esp.push(alu); alert("REGISTRADO EN ESPERA"); }
        sync(); clearForm();
    }

    function processAttendance() {
        const res = document.getElementById('assist_stats');
        res.innerHTML = '<p class="animate-pulse orbitron text-nuke">ANALIZANDO...</p>';
        setTimeout(() => {
            const pres = Math.floor(Math.random() * 25) + 5;
            res.innerHTML = `<div class="bg-black p-4 border border-nuke text-center"><p class="text-[8px]">PRESENTE</p><h4 class="text-xl text-nuke font-black">${pres}</h4></div>
            <div class="bg-black p-4 border border-red-500 text-center"><p class="text-[8px]">AUSENTE</p><h4 class="text-xl text-red-500 font-black">2</h4></div>
            <div class="bg-zinc-800 p-4 text-center"><p class="text-[8px]">PROM. MENSUAL</p><h4 class="text-xl">94%</h4></div>`;
        }, 1500);
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const raw = JSON.parse(e.target.result);
            DATA.mat = (raw.mat || raw).map(i => ({
                alu_nombre: i.alu_nombre || i.n || "", alu_dni: i.alu_dni || i.d || "",
                alu_sala: (i.alu_sala || i.sala || "").replace('SALA ', '').replace(' TM', '-TM').replace(' TT', '-TT'),
                alu_dom: i.alu_dom || i.adom || "", alu_f_nac: i.alu_f_nac || i.f || "",
                alu_nac: i.alu_nac || 'ARGENTINA', alu_auh: i.alu_auh || 'NO', m_nombre: i.m_nombre || i.mn || "",
                m_tel: i.m_tel || i.mtel || "", p_nombre: i.p_nombre || i.pn || "", p_tel: i.p_tel || i.ptel || "",
                alu_salud: i.alu_salud || "", m_edu: i.m_edu || "", p_edu: i.p_edu || ""
            }));
            sync(); alert("DATOS RECUPERADOS: " + DATA.mat.length + " ALUMNOS.");
        };
        reader.readAsText(input.files[0]);
    }

    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => { ['TM', 'TT'].forEach(t => {
            const tag = `${s}-${t}`; const cant = DATA.mat.filter(x => x.alu_sala.includes(tag)).length;
            grid.innerHTML += `<div onclick="viewSala('${tag}')" class="card-sala S-${s}"><div class="orbitron text-[7px] opacity-40">${t}</div><div class="font-black text-[9px]">${s}</div><div class="text-2xl font-black text-nuke">${cant}</div></div>`;
        });});
    }

    function renderEspera() {
        const tb = document.getElementById('espera_table'); tb.innerHTML = '';
        DATA.esp.forEach((e, i) => { tb.innerHTML += `<tr class="border-b border-zinc-900"><td class="p-3 uppercase text-white font-bold">${e.alu_nombre}</td><td>${e.alu_dni}<br>${e.edad_ref || ''} años</td><td>${e.alu_sala}</td><td>M: ${e.m_tel}<br>P: ${e.p_tel}</td><td><button onclick="DATA.mat.push(DATA.esp[i]);DATA.esp.splice(i,1);sync();renderEspera();" class="bg-blue-600 px-2 py-1 font-bold text-[8px]">ADMITIR</button></td></tr>`; });
    }

    function renderBajas() {
        const l = document.getElementById('bajas_list'); l.innerHTML = '';
        ['MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'].forEach(m => {
            l.innerHTML += `<div class="p-2 border border-zinc-800 flex justify-between uppercase text-[9px]"><span>${m}</span> <span class="text-zinc-500">Sin Movimientos</span></div>`;
        });
    }

    function updateStats() {
        const p = document.getElementById('stats_elite');
        const items = [{t:'MATRÍCULA', v:DATA.mat.length, c:'nuke'}, {t:'AUH TOTAL', v:DATA.mat.filter(x=>x.alu_auh==='SI').length, c:'blue-500'}, {t:'ESPERA', v:DATA.esp.length, c:'orange-500'}, {t:'NAC. ARGENTINA', v:DATA.mat.filter(x=>x.alu_nac==='ARGENTINA').length, c:'white'}];
        p.innerHTML = items.map(i => `<div class="bg-zinc-900 p-4 border-b-2 border-${i.c} text-center"><p class="text-[9px] orbitron text-zinc-500">${i.t}</p><h4 class="text-2xl font-black text-${i.c}">${i.v}</h4></div>`).join('');
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); if(n===5) setTimeout(renderCharts, 200); }
    function clearForm() { document.querySelectorAll('#form_master input, #form_master select').forEach(i => i.value = ''); document.getElementById('btn_save').innerText = "CONSOLIDAR MATRÍCULA 360"; document.getElementById('btn_save').classList.replace('bg-blue-600', 'bg-nuke'); }
    function cloneDom(who) { document.getElementById(who+'_dom').value = document.getElementById('alu_dom').value; }
    function calcEdad() { const f = new Date(document.getElementById('alu_f_nac').value); const ref = new Date('2026-06-30'); let e = ref.getFullYear() - f.getFullYear(); if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) e--; document.getElementById('label_edad').innerText = `EDAD 30/06: ${e}`; return e; }
    function exportExcel() { const ws = XLSX.utils.json_to_sheet(DATA.mat); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "MATRICULA"); XLSX.writeFile(wb, "TITANIUM_J926_TOTAL.xlsx"); }
    function exportBackup() { const blob = new Blob([JSON.stringify(DATA)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "TITANIUM_BACKUP.json"; a.click(); }
    function renderCharts() { 
        const ctx1 = document.getElementById('chart_salas').getContext('2d');
        if(window.c1) window.c1.destroy();
        window.c1 = new Chart(ctx1, { type: 'bar', data: { labels: SALAS_INST, datasets: [{ label: 'MATRÍCULA', data: SALAS_INST.map(s => DATA.mat.filter(x => x.alu_sala.includes(s)).length), backgroundColor: '#dfff00' }] }, options: { maintainAspectRatio: false, color:'#fff' } });
    }
</script>
</body>
</html>
