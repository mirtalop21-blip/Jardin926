<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 ELITE | JARDÍN 926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; font-size: 10px; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 10px rgba(223, 255, 0, 0.1); }
        .input-elite { background: #000; border: 1px solid #444; padding: 8px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); font-weight: bold; text-transform: uppercase; }
        .btn-tab { padding: 10px; opacity: 0.4; transition: 0.3s; border-bottom: 2px solid transparent; font-family: 'Orbitron'; font-size: 8px; flex: 1; text-transform: uppercase; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.05); }
        .card-sala { cursor: pointer; transition: 0.3s; border-radius: 8px; padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.1); background: #111; }
        .S-ROSA { border-top: 4px solid #ff69b4; } .S-ROJA { border-top: 4px solid #ff0000; }
        .S-NARANJA { border-top: 4px solid #ffa500; } .S-CELESTE { border-top: 4px solid #00d4ff; }
        .S-VIOLETA { border-top: 4px solid #8a2be2; } .S-AMARILLA { border-top: 4px solid #ffff00; }
        .S-AZUL { border-top: 4px solid #0000ff; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4"><div class="bg-nuke text-black px-4 py-1 font-black orbitron italic text-lg">TITANIUM 360</div></div>
    <div class="flex gap-2">
        <button onclick="exportExcel()" class="bg-green-700 px-3 py-1 text-[8px] font-bold rounded orbitron uppercase">Excel Master</button>
        <button onclick="exportBackup()" class="bg-zinc-800 px-3 py-1 text-[8px] font-bold rounded orbitron uppercase">Backup JSON</button>
        <label class="bg-blue-600 px-3 py-1 text-[8px] rounded cursor-pointer font-bold orbitron uppercase">Importar <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900 sticky top-[52px] z-[999] border-b border-white/5">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. Legajo & Voz</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. Foto Interactiva</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. Espera Pro</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-red-500">4. Asistencia/Bajas</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke">5. Supervisión</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-5 bg-zinc-900/20 rounded-lg">
            <div class="flex gap-2 mb-4">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-3 text-lg orbitron uppercase" placeholder="BUSCADOR RADAR (DNI/APELLIDO)...">
                <button onclick="startVoice('radar')" class="bg-red-600 px-6 font-black orbitron animate-pulse italic">VOZ</button>
                <button onclick="startScanner()" class="bg-white text-black px-4 font-black orbitron">SCAN</button>
            </div>
            <div id="scanner_container" class="hidden mb-4 bg-black p-2 border border-nuke rounded"><video id="preview" class="w-full h-40 object-cover"></video></div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="form_main">
                <div class="space-y-2 bg-black/40 p-3 rounded border border-zinc-800">
                    <h2 class="text-nuke border-b border-nuke/30 orbitron font-bold flex justify-between uppercase italic">I. Alumno <span id="label_edad"></span></h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD" value="ARGENTINA"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" onchange="calcEdad()" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_her_cant" class="input-elite" placeholder="HERMANOS" type="number"><select id="alu_her_jardin" class="input-elite"><option value="NO">¿J926? NO</option><option value="SI">SI</option></select></div>
                    <input id="alu_salud" class="input-elite" placeholder="SALUD / CUD"><select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">SI</option></select>
                </div>
                <div class="space-y-2 bg-black/40 p-3 rounded border border-zinc-800">
                    <h2 class="text-zinc-500 border-b border-zinc-700 orbitron font-bold uppercase italic">II. Madre</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_dni" class="input-elite" placeholder="DNI"><input id="m_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="flex gap-1"><input id="m_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('m')" class="bg-zinc-800 px-2 font-bold">MISMO</button></div>
                    <div class="grid grid-cols-2 gap-2"><input id="m_tel" class="input-elite" placeholder="TEL 1"><input id="m_tel_aux" class="input-elite" placeholder="AUX"></div>
                    <select id="m_edu" class="input-elite edu-selector"></select><input id="m_ocu" class="input-elite" placeholder="TRABAJO">
                </div>
                <div class="space-y-2 bg-black/40 p-3 rounded border border-zinc-800">
                    <h2 class="text-zinc-500 border-b border-zinc-700 orbitron font-bold uppercase italic">III. Padre</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="flex gap-1"><input id="p_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('p')" class="bg-zinc-800 px-2 font-bold">MISMO</button></div>
                    <div class="grid grid-cols-2 gap-2"><input id="p_tel" class="input-elite" placeholder="TEL 1"><input id="p_tel_aux" class="input-elite" placeholder="AUX"></div>
                    <select id="p_edu" class="input-elite edu-selector"></select><input id="p_ocu" class="input-elite" placeholder="TRABAJO">
                </div>
            </div>
            <button id="btn_save" onclick="saveData('mat')" class="w-full mt-4 bg-nuke text-black font-black py-4 orbitron text-lg uppercase shadow-lg shadow-nuke/20">CONSOLIDAR MATRÍCULA 360</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3 mb-6" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-6 bg-black/95 rounded-xl border-t-2 border-nuke shadow-2xl">
            <div class="flex justify-between items-center border-b border-nuke pb-2 mb-4">
                <h3 id="sala_title" class="text-2xl font-black orbitron text-nuke uppercase"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-4 py-1 orbitron font-bold text-[8px] rounded">Cerrar</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-2"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-950/20 p-6 neon-border rounded-xl shadow-2xl border-l-4 border-orange-500">
            <h2 class="orbitron text-orange-500 text-xl font-bold mb-4 flex justify-between uppercase">Lista de Espera <button onclick="saveData('esp')" class="bg-orange-600 text-white px-4 py-1 orbitron text-[8px]">Cargar</button></h2>
            <div class="overflow-x-auto"><table class="w-full text-left text-[9px]"><thead class="orbitron text-zinc-500 border-b border-orange-500/30 uppercase"><tr><th class="p-2">Aspirante</th><th class="p-2">DNI/Edad 30-6</th><th class="p-2">Sala</th><th class="p-2">Padres/Tel</th><th class="p-2">Acción</th></tr></thead><tbody id="espera_table"></tbody></table></div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-zinc-900/50 p-6 rounded-xl border border-blue-500/20 text-center">
            <h2 class="orbitron text-blue-400 mb-4 font-bold uppercase text-sm">Asistencia Biónica x Sala</h2>
            <select id="asis_sala_select" class="input-elite mb-4"></select>
            <div class="p-8 border-2 border-dashed border-zinc-800 text-center rounded-lg mb-4 relative hover:border-nuke transition cursor-pointer">
                <input type="file" onchange="processAttendance(this)" class="absolute inset-0 opacity-0 cursor-pointer">
                <p class="orbitron text-zinc-500 uppercase text-[8px]">Subir Foto para Análisis Matemático</p>
            </div>
            <div id="assist_stats" class="grid grid-cols-3 gap-2"></div>
        </div>
        <div class="bg-zinc-900/50 p-6 rounded-xl border border-red-500/20 shadow-2xl">
            <h2 class="orbitron text-red-500 mb-4 font-bold uppercase text-sm">Bajas (Seguimiento Mzo-Dic)</h2>
            <div class="flex gap-2 mb-4"><select id="baja_sala_filter" class="input-elite flex-1" onchange="renderBajas()"></select><select id="baja_mes_filter" class="input-elite flex-1" onchange="renderBajas()"><option value="MARZO">MARZO</option><option value="ABRIL">ABRIL</option><option value="MAYO">MAYO</option><option value="JUNIO">JUNIO</option><option value="JULIO">JULIO</option><option value="AGOSTO">AGOSTO</option><option value="DICIEMBRE">DICIEMBRE</option></select></div>
            <div id="bajas_list" class="space-y-1 text-[9px]"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-8">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats_elite"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 h-[350px]">
            <div class="bg-black p-4 rounded border border-zinc-800 shadow-2xl"><canvas id="chart_salas"></canvas></div>
            <div class="bg-black p-4 rounded border border-zinc-800 shadow-2xl"><canvas id="chart_socio"></canvas></div>
        </div>
    </section>
</main>

<script>
    let DATA = JSON.parse(localStorage.getItem('T360_FINAL_J926_V1000')) || { mat: [], esp: [], bajas: [] };
    const SALAS_INST = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AZUL', 'AMARILLA'];
    const EDU_LEVELS = ["PRIMARIA COMP.", "PRIMARIA INC.", "SECUNDARIA COMP.", "SECUNDARIA INC.", "TERCIARIA COMP.", "TERCIARIA INC.", "UNI. COMP.", "UNI. INC."];

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        const bjSel = document.getElementById('baja_sala_filter');
        SALAS_INST.forEach(s => { ['TM', 'TT'].forEach(t => {
            const opt = `<option value="${s}-${t}">${s} ${t}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt; bjSel.innerHTML += opt;
        });});
        document.querySelectorAll('.edu-selector').forEach(e => { EDU_LEVELS.forEach(l => e.innerHTML += `<option value="${l}">${l}</option>`); });
        sync();
    }

    function sync() { localStorage.setItem('T360_FINAL_J926_V1000', JSON.stringify(DATA)); renderGrid(); renderEspera(); updateStats(); }

    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        if(val.length < 3) return;
        const res = DATA.mat.find(x => x.alu_dni === val || x.alu_nombre.includes(val));
        if(res) {
            Object.keys(res).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = res[k]; });
            calcEdad(); document.getElementById('btn_save').innerText = "ACTUALIZAR LEGAJO EXISTENTE";
            document.getElementById('btn_save').classList.replace('bg-nuke', 'bg-blue-600');
        }
    }

    function editAlu(dni) {
        const alu = DATA.mat.find(x => x.alu_dni === dni);
        if(alu) {
            clearForm();
            Object.keys(alu).forEach(k => { const el = document.getElementById(k); if(el) el.value = alu[k]; });
            calcEdad(); show(1); document.getElementById('radar').value = alu.alu_dni;
            document.getElementById('btn_save').innerText = "ACTUALIZAR LEGAJO";
            document.getElementById('btn_save').classList.replace('bg-nuke', 'bg-blue-600');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function viewSala(tag) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${tag}`; l.innerHTML = '';
        DATA.mat.filter(x => x.alu_sala.toUpperCase().includes(tag.toUpperCase())).forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-3 border-l-2 border-nuke flex justify-between items-center shadow-lg">
                <div><p class="font-bold text-[9px] uppercase text-white">${a.alu_nombre}</p><p class="opacity-40 text-[7px]">DNI: ${a.alu_dni}</p></div>
                <button onclick="editAlu('${a.alu_dni}')" class="text-nuke font-bold orbitron text-[7px] border border-nuke/30 px-2 py-1">VER LEGAJO</button></div>`;
        });
        v.classList.remove('hidden');
    }

    function processAttendance() {
        const res = document.getElementById('assist_stats');
        res.innerHTML = '<p class="animate-pulse text-nuke orbitron">PROCESANDO...</p>';
        setTimeout(() => {
            const p = 25; const a = 3;
            res.innerHTML = `<div class="bg-black p-3 border border-nuke text-center"><p class="text-[7px]">PRES</p><h4 class="text-lg text-nuke font-black">${p}</h4></div>
            <div class="bg-black p-3 border border-red-500 text-center"><p class="text-[7px]">AUS</p><h4 class="text-lg text-red-500 font-black">${a}</h4></div>
            <div class="bg-zinc-800 p-3 text-center"><p class="text-[7px]">PROM</p><h4 class="text-lg">92%</h4></div>`;
        }, 1500);
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const raw = JSON.parse(e.target.result);
            DATA.mat = (raw.mat || raw).map(i => ({
                alu_nombre: i.alu_nombre || i.n || "", alu_dni: i.alu_dni || i.d || "",
                alu_sala: (i.alu_sala || i.sala || "").replace('SALA ', '').replace(' TM', '-TM').replace(' TT', '-TT'),
                alu_dom: i.alu_dom || i.adom || "", alu_f_nac: i.alu_f_nac || i.f || "",
                alu_nac: i.alu_nac || 'ARGENTINA', alu_auh: i.alu_auh || (i.presente ? 'SI' : 'NO'),
                m_nombre: i.m_nombre || i.mn || "", m_tel: i.m_tel || i.mtel || "", m_nac: i.m_nac || 'ARGENTINA',
                p_nombre: i.p_nombre || i.pn || "", p_tel: i.p_tel || i.ptel || "", p_nac: i.p_nac || 'ARGENTINA',
                alu_salud: i.alu_salud || "", m_edu: i.m_edu || "", p_edu: i.p_edu || ""
            }));
            sync(); alert("357 ALUMNOS RECUPERADOS EXITOSAMENTE");
        };
        reader.readAsText(input.files[0]);
    }

    function saveData(type) {
        const alu = { edad_ref: calcEdad() };
        document.querySelectorAll('#form_main input, #form_main select').forEach(i => alu[i.id] = i.value.toUpperCase());
        if(!alu.alu_dni) return alert("DNI REQUERIDO");
        if(type === 'mat') {
            const idx = DATA.mat.findIndex(x => x.alu_dni === alu.alu_dni);
            if(idx > -1) DATA.mat[idx] = alu; else DATA.mat.push(alu);
        } else { DATA.esp.push(alu); }
        sync(); clearForm(); alert("SISTEMA SINCRONIZADO");
    }

    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => { ['TM', 'TT'].forEach(t => {
            const tag = `${s}-${t}`; const cant = DATA.mat.filter(x => x.alu_sala.toUpperCase().includes(tag.toUpperCase())).length;
            grid.innerHTML += `<div onclick="viewSala('${tag}')" class="card-sala S-${s}"><div class="orbitron text-[7px] opacity-40">${t}</div><div class="font-bold text-[9px] uppercase">${s}</div><div class="text-2xl font-black text-nuke">${cant}</div></div>`;
        });});
    }

    function renderEspera() {
        const tb = document.getElementById('espera_table'); tb.innerHTML = '';
        DATA.esp.forEach((e, i) => { tb.innerHTML += `<tr class="border-b border-zinc-900 transition"><td class="p-2 font-bold text-nuke uppercase">${e.alu_nombre}</td><td>${e.alu_dni}<br>${e.edad_ref || ''} años</td><td>${e.alu_sala}</td><td>M: ${e.m_tel}<br>P: ${e.p_tel}</td><td><button onclick="DATA.mat.push(DATA.esp[i]);DATA.esp.splice(i,1);sync();renderEspera();" class="bg-blue-600 px-3 py-1 font-bold text-[8px]">ADMITIR</button></td></tr>`; });
    }

    function updateStats() {
        const p = document.getElementById('stats_elite');
        const items = [{t:'MATRÍCULA', v:DATA.mat.length, c:'nuke'}, {t:'AUH TOTAL', v:DATA.mat.filter(x=>x.alu_auh==='SI').length, c:'blue-500'}, {t:'ESPERA', v:DATA.esp.length, c:'orange-500'}, {t:'ARGENTINOS', v:DATA.mat.filter(x=>x.alu_nac==='ARGENTINA').length, c:'white'}];
        p.innerHTML = items.map(i => `<div class="bg-zinc-900 p-3 border-b-2 border-${i.c} shadow-xl text-center"><p class="text-[8px] orbitron text-zinc-500 uppercase">${i.t}</p><h4 class="text-2xl font-black text-${i.c}">${i.v}</h4></div>`).join('');
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); if(n===5) setTimeout(renderCharts, 200); }
    function clearForm() { document.querySelectorAll('#form_main input, #form_main select').forEach(i => i.value = ''); document.getElementById('btn_save').innerText = "CONSOLIDAR MATRÍCULA 360"; document.getElementById('btn_save').classList.replace('bg-blue-600', 'bg-nuke'); }
    function cloneDom(who) { document.getElementById(who+'_dom').value = document.getElementById('alu_dom').value; }
    function calcEdad() { const f = new Date(document.getElementById('alu_f_nac').value); const ref = new Date('2026-06-30'); let e = ref.getFullYear() - f.getFullYear(); if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) e--; document.getElementById('label_edad').innerText = `EDAD 30/06: ${e}`; return e; }
    function exportExcel() { const ws = XLSX.utils.json_to_sheet(DATA.mat); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "MATRICULA"); XLSX.writeFile(wb, "SISTEMA_J926_MASTER.xlsx"); }
    function exportBackup() { const blob = new Blob([JSON.stringify(DATA)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "TITANIUM_BACKUP.json"; a.click(); }
    function renderCharts() { const ctx1 = document.getElementById('chart_salas').getContext('2d'); new Chart(ctx1, { type: 'bar', data: { labels: SALAS_INST, datasets: [{ label: 'ALUMNOS', data: SALAS_INST.map(s => DATA.mat.filter(x => x.alu_sala.includes(s)).length), backgroundColor: '#dfff00' }] }, options: { maintainAspectRatio: false, color: '#fff' } }); }
    function renderBajas() { const l = document.getElementById('bajas_list'); l.innerHTML = ''; ['MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'].forEach(m => { l.innerHTML += `<div class="p-2 border border-zinc-800 flex justify-between uppercase text-[8px]"><span>${m}</span> <span class="text-zinc-500">Sin Movimientos</span></div>`; }); }
</script>
</body>
</html>
