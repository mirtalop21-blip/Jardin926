<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 ELITE | JARDÍN 926 | FULL INTEGRATION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto', sans-serif; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 15px rgba(223, 255, 0, 0.1); }
        .input-elite { background: #000; border: 1px solid #333; padding: 10px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); font-weight: bold; font-size: 12px; }
        .btn-tab { padding: 15px; opacity: 0.4; transition: 0.3s; border-bottom: 2px solid transparent; text-transform: uppercase; font-weight: bold; font-family: 'Orbitron'; font-size: 10px; flex: 1; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.05); }
        .card-sala { cursor: pointer; transition: 0.3s; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); padding: 15px; text-align: center; }
        .card-sala:hover { transform: translateY(-5px); background: rgba(255,255,255,0.05); }
        /* Identificadores para las 14 salas */
        .S-ROSA { border-top: 4px solid #ff69b4; } .S-ROJA { border-top: 4px solid #ff0000; }
        .S-NARANJA { border-top: 4px solid #ffa500; } .S-CELESTE { border-top: 4px solid #00d4ff; }
        .S-VIOLETA { border-top: 4px solid #8a2be2; } .S-AMARILLA { border-top: 4px solid #ffff00; }
        .S-VERDE { border-top: 4px solid #32cd32; } .S-AZUL { border-top: 4px solid #0000ff; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-4 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-6 py-2 font-black italic orbitron text-xl tracking-tighter">TITANIUM 360 ELITE</div>
        <div class="hidden lg:block text-[9px] text-zinc-500 orbitron uppercase tracking-[5px]">Gestión Institucional J926</div>
    </div>
    <div class="flex gap-2">
        <button onclick="exportExcel()" class="bg-green-700 px-4 py-2 text-[10px] font-bold rounded orbitron">EXCEL</button>
        <button onclick="exportBackup()" class="bg-zinc-800 px-4 py-2 text-[10px] font-bold rounded orbitron">BACKUP JSON</button>
        <label class="bg-blue-600 px-4 py-2 text-[10px] rounded cursor-pointer font-bold orbitron">
            IMPORTAR SISTEMA <input type="file" class="hidden" onchange="importData(this)">
        </label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900/95 sticky top-[68px] z-[999] border-b border-white/5 shadow-2xl">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. LEGAJO & RADAR</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. MAPA 14 SALAS</button>
    <button onclick="show(3)" id="t3" class="btn-tab">3. LISTA DE ESPERA</button>
    <button onclick="show(4)" id="t4" class="btn-tab">4. ASISTENCIA & BAJAS</button>
    <button onclick="show(5)" id="t5" class="btn-tab">5. SUPERVISIÓN ÉLITE</button>
</nav>

<main class="p-6">
    
    <section id="v1" class="space-y-6">
        <div class="neon-border p-6 bg-zinc-900/20 rounded-lg">
            <div class="flex gap-4 mb-8">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-5 text-2xl font-bold orbitron placeholder-zinc-800 uppercase" placeholder="INICIAR RADAR: DNI O APELLIDO...">
                <button onclick="startVoice()" class="bg-red-600 px-8 font-black orbitron animate-pulse">🎤 VOZ</button>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-3 gap-8" id="form_container">
                <div class="bg-black/40 p-5 rounded border border-zinc-800 space-y-4 shadow-2xl">
                    <h2 class="text-nuke border-b border-nuke/30 pb-2 orbitron font-bold italic flex justify-between uppercase">I. Datos Alumno <span id="label_edad" class="text-[10px] text-white">EDAD 30/06: --</span></h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDOS Y NOMBRES">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" onchange="calcEdad()" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="alu_her" class="input-elite" placeholder="CANT. HERMANOS" type="number">
                        <select id="alu_her_j" class="input-elite"><option value="NO">¿HERMANOS EN J926? NO</option><option value="SI">SI</option></select>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">AUH: SI</option></select>
                        <select id="alu_os" class="input-elite"><option value="NO">O. SOCIAL: NO</option><option value="SI">SI</option></select>
                    </div>
                </div>

                <div class="bg-black/40 p-5 rounded border border-zinc-800 space-y-4">
                    <h2 class="text-zinc-500 border-b border-zinc-700 pb-2 orbitron font-bold italic uppercase">II. Madre / Tutora</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_dni" class="input-elite" placeholder="DNI"><input id="m_tel" class="input-elite" placeholder="TELÉFONO"></div>
                    <div class="flex gap-1"><input id="m_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('m')" class="bg-zinc-800 px-3 text-[9px] font-bold orbitron">ALU</button></div>
                    <select id="m_edu" class="input-elite edu-selector"></select>
                    <input id="m_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>

                <div class="bg-black/40 p-5 rounded border border-zinc-800 space-y-4">
                    <h2 class="text-zinc-500 border-b border-zinc-700 pb-2 orbitron font-bold italic uppercase">III. Padre / Tutor</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_tel" class="input-elite" placeholder="TELÉFONO"></div>
                    <div class="flex gap-1"><input id="p_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('p')" class="bg-zinc-800 px-3 text-[9px] font-bold orbitron">ALU</button></div>
                    <select id="p_edu" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
            </div>

            <div class="flex gap-4 mt-10">
                <button id="btn_save" onclick="saveData('MAT')" class="flex-[2] bg-nuke text-black font-black py-6 orbitron text-2xl hover:scale-[1.01] transition shadow-lg shadow-nuke/20 uppercase">CONSOLIDAR MATRÍCULA</button>
                <button onclick="clearForm()" class="flex-1 bg-zinc-800 px-12 font-bold orbitron uppercase text-[10px]">Limpiar Pantalla</button>
            </div>
        </div>
    </section>

    <section id="v2" class="hidden space-y-10">
        <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-7 gap-6" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-10 bg-black/60 rounded-xl mt-12">
            <h3 id="sala_title" class="text-4xl font-black orbitron italic text-nuke border-b border-zinc-800 mb-6 pb-2"></h3>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-600/5 p-8 neon-border rounded-xl">
            <h2 class="orbitron text-orange-500 text-3xl font-black mb-8 flex justify-between items-center">LISTA DE ESPERA ESTRATÉGICA <button onclick="saveData('ESP')" class="bg-orange-600 text-white text-[10px] px-6 py-2">CARGAR A ESPERA</button></h2>
            <div class="overflow-x-auto"><table class="w-full text-left text-[11px]"><thead class="orbitron text-zinc-500 border-b border-zinc-800"><tr><th class="p-3">ALUMNO</th><th class="p-3">DNI</th><th class="p-3">SALA</th><th class="p-3">EDAD</th><th class="p-3">ACCIONES</th></tr></thead><tbody id="espera_table"></tbody></table></div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-10">
        <div class="bg-zinc-900/50 p-8 rounded-xl border border-blue-500/20 shadow-2xl">
            <h2 class="orbitron text-blue-400 mb-6 font-bold text-2xl uppercase">Asistencia Biónica por Imagen</h2>
            <input type="file" onchange="processAttendance(this)" class="input-elite mb-6">
            <div id="asist_stats" class="grid grid-cols-2 gap-4"></div>
        </div>
        <div class="bg-zinc-900/50 p-8 rounded-xl border border-red-500/20 shadow-2xl">
            <h2 class="orbitron text-red-500 mb-6 font-bold text-2xl uppercase">Histórico de Bajas (Mes a Mes)</h2>
            <div id="bajas_list" class="space-y-2"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-12">
        <div class="grid grid-cols-2 md:grid-cols-5 gap-6" id="stats_elite"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 h-[500px]">
            <div class="bg-black p-8 rounded border border-zinc-800 shadow-2xl"><canvas id="chart_salas"></canvas></div>
            <div class="bg-black p-8 rounded border border-zinc-800 shadow-2xl"><canvas id="chart_socio"></canvas></div>
        </div>
    </section>

</main>

<script>
    let MASTER_DATA = JSON.parse(localStorage.getItem('T360_ELITE')) || { mat: [], esp: [], bajas: [] };
    const SALAS_INST = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AMARILLA', 'VERDE', 'AZUL'];
    const EDU_LEVELS = ["SIN ESTUDIOS", "PRIMARIA COMPLETA", "PRIMARIA INCOMPLETA", "SECUNDARIA COMPLETA", "SECUNDARIA INCOMPLETA", "TERCIARIA COMPLETA", "TERCIARIA INCOMPLETA", "UNIVERSITARIO COMPLETA", "UNIVERSITARIO INCOMPLETA"];

    function initSystem() {
        const sel = document.getElementById('alu_sala');
        sel.innerHTML = '<option value="">SELECCIONAR SECCIÓN...</option>';
        SALAS_INST.forEach(s => { ['TM', 'TT'].forEach(t => sel.innerHTML += `<option value="${s}-${t}">${s} - ${t}</option>`); });
        document.querySelectorAll('.edu-selector').forEach(e => { e.innerHTML = '<option value="">ESTUDIOS...</option>'; EDU_LEVELS.forEach(o => e.innerHTML += `<option value="${o}">${o}</option>`); });
        sync();
    }

    function calcEdad() {
        const f = new Date(document.getElementById('alu_f_nac').value);
        const ref = new Date('2026-06-30');
        let e = ref.getFullYear() - f.getFullYear();
        if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) e--;
        document.getElementById('label_edad').innerText = `EDAD 30/06: ${e} AÑOS`;
        return e;
    }

    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        const btn = document.getElementById('btn_save');
        if(val.length < 3) return;
        const res = MASTER_DATA.mat.find(x => x.alu_dni === val || x.alu_nombre.includes(val));
        if(res) {
            Object.keys(res).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = res[k]; });
            btn.innerText = "ACTUALIZAR LEGAJO EXISTENTE";
            btn.classList.replace('bg-nuke', 'bg-blue-600');
        } else {
            btn.innerText = "CONSOLIDAR MATRÍCULA";
            btn.classList.replace('bg-blue-600', 'bg-nuke');
        }
    }

    function saveData(type) {
        const data = {};
        document.querySelectorAll('#form_container input, #form_container select').forEach(i => data[i.id] = i.value.toUpperCase());
        if(!data.alu_dni) return alert("DNI REQUERIDO");
        if(type === 'MAT') {
            const idx = MASTER_DATA.mat.findIndex(x => x.alu_dni === data.alu_dni);
            if(idx > -1) MASTER_DATA.mat[idx] = data; else MASTER_DATA.mat.push(data);
        } else { MASTER_DATA.esp.push(data); }
        sync(); clearForm(); alert("SISTEMA ACTUALIZADO");
    }

    function sync() {
        localStorage.setItem('T360_ELITE', JSON.stringify(MASTER_DATA));
        renderMapa(); renderEspera(); renderBajas(); updateStats();
    }

    function renderMapa() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => { ['TM', 'TT'].forEach(t => {
            const tag = `${s}-${t}`; const cant = MASTER_DATA.mat.filter(x => x.alu_sala === tag).length;
            grid.innerHTML += `<div onclick="viewSala('${tag}')" class="card-sala S-${s}"><div class="orbitron text-[9px] opacity-40">${t}</div><div class="font-black">${s}</div><div class="text-4xl font-black text-nuke mt-2">${cant}</div></div>`;
        });});
    }

    function viewSala(tag) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${tag}`; l.innerHTML = '';
        MASTER_DATA.mat.filter(x => x.alu_sala === tag).forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-3 border-l-2 border-nuke flex justify-between items-center"><div class="text-[10px] font-bold">${a.alu_nombre}</div><button onclick="editAlu('${a.alu_dni}')" class="bg-nuke text-black px-2 py-1 text-[8px] orbitron font-bold">VER</button></div>`;
        });
        v.classList.remove('hidden'); v.scrollIntoView({behavior:'smooth'});
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const raw = JSON.parse(e.target.result);
            // MOTOR DE MAPEO AUTOMÁTICO (Recupera los 360 alumnos)
            MASTER_DATA.mat = (raw.mat || raw.MATRICULA || raw).map(i => ({
                alu_nombre: i.alu_nombre || i.n || "", alu_dni: i.alu_dni || i.d || "",
                alu_sala: i.alu_sala || i.sala || "", alu_dom: i.alu_dom || i.adom || "",
                m_nombre: i.m_nombre || i.mn || "", m_tel: i.m_tel || i.mtel || "",
                p_nombre: i.p_nombre || i.pn || "", p_tel: i.p_tel || i.ptel || "",
                alu_nac: i.alu_nac || 'ARGENTINA', alu_auh: i.alu_auh || 'NO'
            }));
            sync(); alert("INGENIERÍA DE CARGA COMPLETADA: " + MASTER_DATA.mat.length + " ALUMNOS.");
        };
        reader.readAsText(input.files[0]);
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); if(n===5) renderCharts(); }
    function clearForm() { document.querySelectorAll('#form_container input, #form_container select').forEach(i => i.value = ''); }
    function editAlu(dni) { document.getElementById('radar').value = dni; smartRadar(); show(1); }
    function cloneDom(who) { document.getElementById(who+'_dom').value = document.getElementById('alu_dom').value; }
</script>
</body>
</html>
