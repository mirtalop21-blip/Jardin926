<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 | GESTIÓN INTEGRAL J926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: monospace; font-size: 12px; }
        .input-elite { background: #000; border: 1px solid #444; padding: 10px; color: var(--nuke); width: 100%; text-transform: uppercase; }
        .tab-content { display: none; } .active-tab { display: block; }
        .neon-border { border: 1px solid var(--nuke); box-shadow: 0 0 10px rgba(223, 255, 0, 0.2); }
    </style>
</head>
<body class="p-4">

    <header class="mb-6 p-4 border border-zinc-800 bg-zinc-900/50">
        <h1 class="text-xl font-black text-nuke mb-4">TITANIUM 360 | AUDITORÍA TOTAL</h1>
        <div class="flex gap-2">
            <input type="text" id="radar" onkeyup="buscarRadar()" class="input-elite w-full" placeholder="RADAR: DNI O APELLIDO...">
            <button onclick="iniciarVoz()" class="bg-red-600 px-4 font-black">🎤 VOZ</button>
            <button onclick="activarCamara()" class="bg-blue-600 px-4 font-black">📷 SCAN</button>
        </div>
        <video id="preview" class="w-full h-32 mt-2 bg-black hidden"></video>
    </header>

    <nav class="flex gap-2 mb-6 border-b border-zinc-800 pb-2 overflow-x-auto">
        <button onclick="show('v1')" class="p-2 border">1. LEGAJO</button>
        <button onclick="show('v2')" class="p-2 border">2. SALAS</button>
        <button onclick="show('v3')" class="p-2 border">3. ESPERA</button>
        <button onclick="show('v4')" class="p-2 border">4. ASISTENCIA</button>
        <button onclick="show('v5')" class="p-2 border" onclick="procesarSupervision()">5. SUPERVISIÓN</button>
    </nav>

    <section id="v1" class="tab-content active-tab">
        <div class="grid md:grid-cols-3 gap-4" id="form_master">
            <div class="space-y-2 border p-4">
                <h2 class="text-nuke font-bold">I. ALUMNO</h2>
                <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                <input id="alu_dni" class="input-elite" placeholder="DNI">
                <input id="alu_nacionalidad" class="input-elite" placeholder="NACIONALIDAD">
                <input id="alu_sala" class="input-elite" placeholder="SALA (EJ: ROSA)">
            </div>
            <div class="space-y-2 border p-4">
                <h2 class="text-blue-400 font-bold">II. MADRE</h2>
                <input id="m_nombre" class="input-elite" placeholder="NOMBRE MADRE">
                <select id="m_estudios" class="input-elite"><option>SIN ESTUDIOS</option><option>PRIMARIA</option><option>SECUNDARIA</option><option>TERCIARIA/UNI</option></select>
                <select id="m_auh" class="input-elite"><option>AUH: NO</option><option>SI</option></select>
            </div>
            <div class="space-y-2 border p-4">
                <h2 class="text-red-400 font-bold">III. PADRE</h2>
                <input id="p_nombre" class="input-elite" placeholder="NOMBRE PADRE">
                <select id="p_estudios" class="input-elite"><option>SIN ESTUDIOS</option><option>PRIMARIA</option><option>SECUNDARIA</option><option>TERCIARIA/UNI</option></select>
            </div>
        </div>
        <button onclick="guardar()" class="mt-4 w-full bg-nuke text-black font-black p-4">CONSOLIDAR LEGAJO 360</button>
    </section>

    <section id="v5" class="tab-content">
        <h2 class="text-lg font-black text-white mb-4">MÉTRICAS POBLACIONALES</h2>
        <div id="stats_display" class="grid grid-cols-2 gap-4"></div>
    </section>

    <script>
        let DATA = JSON.parse(localStorage.getItem('T360_DB')) || { mat: [] };

        function show(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-tab');
            if(id === 'v5') procesarSupervision();
        }

        function guardar() {
            const obj = {};
            document.querySelectorAll('input, select').forEach(i => obj[i.id] = i.value);
            DATA.mat.push(obj);
            localStorage.setItem('T360_DB', JSON.stringify(DATA));
            alert("LEGAJO CONSOLIDADO");
        }

        function procesarSupervision() {
            const total = DATA.mat.length;
            const auh = DATA.mat.filter(a => a.m_auh === 'SI').length;
            const display = document.getElementById('stats_display');
            display.innerHTML = `
                <div class="border p-4">TOTAL MATRÍCULA: <span class="text-nuke">${total}</span></div>
                <div class="border p-4">TOTAL AUH: <span class="text-nuke">${auh}</span></div>
                <div class="border p-4">PORCENTAJE AUH: <span class="text-nuke">${total > 0 ? ((auh/total)*100).toFixed(1) : 0}%</span></div>
            `;
        }

        // Radar, Voz y Scanner se mantienen igual que en la versión anterior
        function buscarRadar() {
            const q = document.getElementById('radar').value.toUpperCase();
            const res = DATA.mat.find(a => a.alu_dni === q || (a.alu_nombre && a.alu_nombre.includes(q)));
            if(res) {
                for(let key in res) if(document.getElementById(key)) document.getElementById(key).value = res[key];
            }
        }

        function iniciarVoz() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'es-ES';
            rec.start();
            rec.onresult = (e) => { document.getElementById('alu_nombre').value = e.results[0][0].transcript.toUpperCase(); };
        }

        function activarCamara() {
            let scanner = new Instascan.Scanner({ video: document.getElementById('preview') });
            Instascan.Camera.getCameras().then(c => { if(c.length > 0) { document.getElementById('preview').classList.remove('hidden'); scanner.start(c[0]); }});
            scanner.addListener('scan', c => { document.getElementById('alu_dni').value = c; buscarRadar(); });
        }
    </script>
</body>
</html>
