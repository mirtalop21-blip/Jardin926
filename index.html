<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 ELITE | JARDÍN 926 | PERSISTENCIA TOTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; overflow-x: hidden; font-size: 11px; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 15px rgba(223, 255, 0, 0.1); }
        .input-elite { background: #000; border: 1px solid #444; padding: 10px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); font-weight: bold; text-transform: uppercase; }
        .btn-tab { padding: 12px; opacity: 0.4; transition: 0.3s; border-bottom: 2px solid transparent; text-transform: uppercase; font-weight: bold; font-family: 'Orbitron'; font-size: 9px; flex: 1; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.05); }
        .card-sala { cursor: pointer; transition: 0.3s; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); background: #111; position: relative; }
        .card-sala:hover { transform: translateY(-5px); border-color: var(--nuke); background: #1a1a1a; }
        .S-ROSA { border-top: 5px solid #ff69b4; } .S-ROJA { border-top: 5px solid #ff0000; }
        .S-NARANJA { border-top: 5px solid #ffa500; } .S-CELESTE { border-top: 5px solid #00d4ff; }
        .S-VIOLETA { border-top: 5px solid #8a2be2; } .S-AMARILLA { border-top: 5px solid #ffff00; }
        .S-AZUL { border-top: 5px solid #0000ff; } .S-VERDE { border-top: 5px solid #00ff00; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-6 py-1 font-black italic orbitron text-xl">TITANIUM 360</div>
        <div id="alert_status" class="bg-red-900/40 text-red-500 border border-red-500 px-3 py-1 rounded-full text-[8px] orbitron animate-pulse">INVESTIGACIÓN MATRÍCULA J926</div>
    </div>
    <div class="flex gap-2">
        <button onclick="exportExcel()" class="bg-green-700 px-3 py-1 text-[8px] font-bold rounded orbitron">EXCEL MASTER</button>
        <button onclick="exportBackup()" class="bg-zinc-800 px-3 py-1 text-[8px] font-bold rounded orbitron">RESPALDO JSON</button>
        <label class="bg-blue-600 px-3 py-1 text-[8px] rounded cursor-pointer font-bold orbitron uppercase">Importar <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900 sticky top-[58px] z-[999] border-b border-white/5">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. LEGAJO 360</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. MAPA 14 SALAS</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. ESPERA PRO</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-red-500">4. ASISTENCIA & BAJAS</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke">5. SUPERVISIÓN ÉLITE</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-6 bg-zinc-900/20 rounded-lg">
            <div class="flex gap-4 mb-4">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-4 text-xl orbitron text-nuke" placeholder="BUSCAR POR DNI O APELLIDO PARA VER/EDITAR...">
                <button onclick="startVoice('radar')" class="bg-red-600 px-6 font-black orbitron animate-pulse">🎤</button>
                <button onclick="startScanner()" class="bg-white text-black px-6 font-black orbitron uppercase">Scan DNI</button>
            </div>
            
            <div id="scanner_container" class="hidden mb-4 bg-black p-2 border border-nuke rounded"><video id="preview" class="w-full h-40 object-cover"></video></div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="form_container">
                <div class="space-y-3 bg-black/40 p-4 rounded border border-zinc-800">
                    <h2 class="text-nuke border-b border-nuke/30 orbitron font-bold flex justify-between uppercase italic">I. Alumno <span id="label_edad" class="text-white"></span></h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" onchange="calcEdad()" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="alu_her_cant" class="input-elite" placeholder="CANT. HERMANOS" type="number">
                        <select id="alu_her_jardin" class="input-elite"><option value="NO">¿HERMANOS EN J926? NO</option><option value="SI">SI</option></select>
                    </div>
                    <input id="alu_salud" class="input-elite" placeholder="FICHA SALUD / CUD / ALERGIAS">
                    <select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">SI</option></select>
                </div>
                <div class="space-y-3 bg-black/40 p-4 rounded border border-zinc-800">
                    <h2 class="text-zinc-500 border-b border-zinc-700 orbitron font-bold uppercase italic">II. MADRE</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_dni" class="input-elite" placeholder="DNI"><input id="m_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="flex gap-1"><input id="m_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('m')" class="bg-zinc-800 px-2 text-[8px] font-bold">MISMO</button></div>
                    <div class="grid grid-cols-2 gap-2"><input id="m_tel" class="input-elite" placeholder="WA / TEL 1"><input id="m_tel_aux" class="input-elite" placeholder="TEL AUX"></div>
                    <select id="m_edu" class="input-elite edu-selector"></select>
                    <input id="m_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
                <div class="space-y-3 bg-black/40 p-4 rounded border border-zinc-800">
                    <h2 class="text-zinc-500 border-b border-zinc-700 orbitron font-bold uppercase italic">III. PADRE</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="flex gap-1"><input id="p_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('p')" class="bg-zinc-800 px-2 text-[8px] font-bold">MISMO</button></div>
                    <div class="grid grid-cols-2 gap-2"><input id="p_tel" class="input-elite" placeholder="WA / TEL 1"><input id="p_tel_aux" class="input-elite" placeholder="TEL AUX"></div>
                    <select id="p_edu" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
            </div>
            <button id="btn_save" onclick="saveData('MAT')" class="w-full mt-6 bg-nuke text-black font-black py-4 orbitron text-xl hover:brightness-110 uppercase shadow-lg shadow-nuke/20">CONSOLIDAR MATRÍCULA 360</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-6" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-8 bg-black/95 rounded-xl shadow-2xl border-t-2 border-nuke">
            <div class="flex justify-between items-center border-b border-nuke pb-4 mb-6">
                <h3 id="sala_title" class="text-3xl font-black orbitron text-nuke uppercase"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-6 py-2 orbitron font-bold text-xs rounded uppercase">Cerrar</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>
    </section>

    <section id="v3" class="hidden"><div id="espera_render"></div></section>
    <section id="v4" class="hidden"><div id="asis_render"></div></section>
    <section id="v5" class="hidden"><div id="super_render"></div></section>
</main>

<script>
    let DATA = JSON.parse(localStorage.getItem('T360_NUCLEAR_V40')) || { mat: [], esp: [], bajas: [] };
    const SALAS_INST = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AZUL', 'AMARILLA'];
    const EDU_LEVELS = ["SIN ESTUDIOS", "PRIMARIA COMP.", "PRIMARIA INC.", "SECUNDARIA COMP.", "SECUNDARIA INC.", "TERCIARIA COMP.", "TERCIARIA INC.", "UNI. COMP.", "UNI. INC."];

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        SALAS_INST.forEach(s => { ['TM', 'TT'].forEach(t => sSel.innerHTML += `<option value="${s}-${t}">${s} - ${t}</option>`); });
        document.querySelectorAll('.edu-selector').forEach(e => { EDU_LEVELS.forEach(o => e.innerHTML += `<option value="${o}">${o}</option>`); });
        sync();
    }

    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        if(val.length < 3) return;
        const res = DATA.mat.find(x => x.alu_dni === val || x.alu_nombre.includes(val));
        if(res) {
            Object.keys(res).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = res[k]; });
            calcEdad();
            document.getElementById('btn_save').innerText = "ACTUALIZAR LEGAJO EXISTENTE";
            document.getElementById('btn_save').classList.replace('bg-nuke', 'bg-blue-600');
        }
    }

    // FUNCIÓN CLAVE: RECUPERACIÓN TOTAL DE DATOS DESDE LA SALA
    function editAlu(dni) {
        const alu = DATA.mat.find(x => x.alu_dni === dni);
        if(alu) {
            // Limpiar formulario antes de cargar
            clearForm();
            // Inyectar TODOS los campos guardados
            Object.keys(alu).forEach(key => {
                const el = document.getElementById(key);
                if(el) el.value = alu[key];
            });
            calcEdad();
            show(1);
            document.getElementById('radar').value = alu.alu_dni;
            document.getElementById('btn_save').innerText = "ACTUALIZAR LEGAJO";
            document.getElementById('btn_save').classList.replace('bg-nuke', 'bg-blue-600');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function viewSala(tag) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${tag}`; l.innerHTML = '';
        const filtrados = DATA.mat.filter(x => x.alu_sala === tag);
        filtrados.forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-4 border-l-2 border-nuke flex justify-between items-center shadow-lg">
                <div><p class="font-bold uppercase text-white">${a.alu_nombre}</p><p class="opacity-40 text-[9px]">DNI: ${a.alu_dni}</p></div>
                <button onclick="editAlu('${a.alu_dni}')" class="text-nuke font-bold orbitron text-[8px] border border-nuke/30 px-3 py-1 hover:bg-nuke hover:text-black">VER LEGAJO COMPLETO</button></div>`;
        });
        v.classList.remove('hidden');
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const raw = JSON.parse(e.target.result);
            DATA.mat = (raw.mat || raw).map(i => ({
                ...i, // Mantiene todos los datos que ya tenías
                alu_nombre: i.alu_nombre || i.n || "", alu_dni: i.alu_dni || i.d || "",
                alu_sala: i.alu_sala || i.sala || "", alu_dom: i.alu_dom || i.adom || "",
                m_nombre: i.m_nombre || i.mn || "", m_tel: i.m_tel || i.mtel || "",
                p_nombre: i.p_nombre || i.pn || "", p_tel: i.p_tel || i.ptel || ""
            }));
            sync(); alert("DATOS IMPORTADOS: 357 ALUMNOS DISTRIBUIDOS");
        };
        reader.readAsText(input.files[0]);
    }

    function sync() { localStorage.setItem('T360_NUCLEAR_V40', JSON.stringify(DATA)); renderGrid(); updateStats(); }
    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => ['TM', 'TT'].forEach(t => {
            const tag = `${s}-${t}`; const cant = DATA.mat.filter(x => x.alu_sala === tag).length;
            grid.innerHTML += `<div onclick="viewSala('${tag}')" class="card-sala S-${s}"><div class="orbitron text-[7px] opacity-40">${t}</div><div class="font-bold uppercase text-[9px]">${s}</div><div class="text-3xl font-black text-nuke">${cant}</div></div>`;
        }));
    }
    function updateStats() { /* Gráficos para pestaña 5 */ }
    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); }
    function clearForm() { document.querySelectorAll('#form_container input, #form_container select').forEach(i => i.value = ''); document.getElementById('btn_save').innerText = "CONSOLIDAR MATRÍCULA 360"; document.getElementById('btn_save').className = "w-full mt-6 bg-nuke text-black font-black py-4 orbitron text-xl hover:brightness-110 uppercase shadow-lg shadow-nuke/20"; }
    function cloneDom(who) { document.getElementById(who+'_dom').value = document.getElementById('alu_dom').value; }
    function calcEdad() { const f = new Date(document.getElementById('alu_f_nac').value); const ref = new Date('2026-06-30'); let e = ref.getFullYear() - f.getFullYear(); if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) e--; document.getElementById('label_edad').innerText = `EDAD 30/06: ${e}`; return e; }
    function exportExcel() { const ws = XLSX.utils.json_to_sheet(DATA.mat); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "MATRICULA"); XLSX.writeFile(wb, "TITANIUM_J926_MASTER.xlsx"); }
    function exportBackup() { const blob = new Blob([JSON.stringify(DATA)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "TITANIUM_BACKUP.json"; a.click(); }
</script>
</body>
</html>
