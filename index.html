<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 ELITE | GESTIÓN REAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-lime-400 font-mono p-4">

    <header class="border-b border-lime-400 pb-4">
        <h1 class="text-xl font-black">TITANIUM 360 ELITE - SISTEMA OPERATIVO</h1>
        <input type="file" onchange="cargarDatos(event)" class="mt-2 p-1 bg-zinc-900 border border-lime-400 text-[10px]">
    </header>

    <div id="stats" class="grid grid-cols-4 gap-2 my-4 text-[10px]"></div>

    <input id="radar" onkeyup="buscarAlumno()" class="w-full bg-black border border-lime-400 p-2 uppercase" placeholder="🔍 BUSCADOR RADAR (DNI O NOMBRE)...">

    <div id="visor" class="mt-4 p-4 border border-zinc-800 h-64 overflow-y-auto"></div>

    <script>
        let MATRICULA = [];

        function cargarDatos(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = JSON.parse(ev.target.result);
                MATRICULA = data.mat;
                procesarEstadisticas();
                renderVisor(MATRICULA);
            };
            reader.readAsText(e.target.files[0]);
        }

        function procesarEstadisticas() {
            const total = MATRICULA.length;
            const arg = MATRICULA.filter(a => a.alu_nac === 'ARG').length;
            const par = MATRICULA.filter(a => a.alu_nac === 'PAR').length;
            const auh = MATRICULA.filter(a => a.alu_auh === 'SI').length;
            
            document.getElementById('stats').innerHTML = `
                <div class="border p-2">TOTAL: ${total}</div>
                <div class="border p-2">ARG: ${arg}</div>
                <div class="border p-2">PAR: ${par}</div>
                <div class="border p-2">AUH: ${auh}</div>
            `;
        }

        function buscarAlumno() {
            const q = document.getElementById('radar').value.toUpperCase();
            const res = MATRICULA.filter(a => a.alu_dni.includes(q) || a.alu_nombre.includes(q));
            renderVisor(res);
        }

        function renderVisor(lista) {
            document.getElementById('visor').innerHTML = lista.map(a => `
                <div class="border-b border-zinc-800 p-2 hover:bg-zinc-900 cursor-pointer" onclick="verLegajo('${a.alu_dni}')">
                    ${a.alu_nombre} | DNI: ${a.alu_dni} | SALA: ${a.alu_sala}
                </div>
            `).join('');
        }

        function verLegajo(dni) {
            const a = MATRICULA.find(x => x.alu_dni === dni);
            alert(`LEGAJO 360 COMPLETO:
Nombre: ${a.alu_nombre}
DNI: ${a.alu_dni}
Madre: ${a.m_nombre}
Estudios Madre: ${a.m_est}
Domicilio: ${a.alu_dom}
AUH: ${a.alu_auh}`);
        }
    </script>
</body>
</html>
