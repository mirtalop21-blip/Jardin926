<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 | JARDÍN 926 - INTEGRADO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container-fluid mt-3">
    <div class="alert alert-secondary">
        <label>Subir Matrícula (JSON):</label>
        <input type="file" id="json-loader" class="form-control" accept=".json">
    </div>

    <ul class="nav nav-tabs">
        <li class="nav-item"><a class="nav-link active" onclick="show('dashboard')">Fotografía Institucional</a></li>
        <li class="nav-item"><a class="nav-link" onclick="show('legajo-edit')">Pestaña 1: Legajo 360</a></li>
        <li class="nav-item"><a class="nav-link" onclick="show('bajas')">Bitácora de Bajas</a></li>
    </ul>

    <div id="dashboard" class="tab-pane active p-3">
        <div id="grid-salas" class="row"></div>
    </div>

    <div id="legajo-edit" class="tab-pane hidden p-3">
        <input type="text" id="radar" class="form-control" placeholder="Radar búsqueda...">
        <div id="form-legajo" class="mt-3 border p-3">
            </div>
    </div>

    <div id="bajas" class="tab-pane hidden p-3">
        <select id="select-sala" class="form-select w-25 mb-3" onchange="renderBajas()">
            <option value="">Seleccionar Sala</option>
        </select>
        <div id="lista-bajas"></div>
    </div>
</div>

<script>
    let db = []; // Base global

    // 1. CARGA EFICIENTE DE JSON
    document.getElementById('json-loader').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(event) {
            db = JSON.parse(event.target.result).mat;
            alert("Base de datos cargada: " + db.length + " alumnos.");
            renderDashboard();
        };
        reader.readAsText(file);
    });

    // 2. FOTO INSTITUCIONAL -> LEGAJO
    function renderDashboard() {
        const grid = document.getElementById('grid-salas');
        const salas = [...new Set(db.map(a => a.alu_sala))];
        grid.innerHTML = salas.map(s => `
            <div class="col-md-2 p-2">
                <div class="card bg-primary text-white p-3" onclick="abrirLegajoSala('${s}')">
                    Sala ${s}
                </div>
            </div>
        `).join('');
    }

    function abrirLegajoSala(sala) {
        show('legajo-edit');
        // Aquí podrías filtrar el buscador por la sala automáticamente
        document.getElementById('radar').value = sala;
    }

    // 3. SEGUIMIENTO DE BAJAS
    function renderBajas() {
        const sala = document.getElementById('select-sala').value;
        const bajas = db.filter(a => a.alu_sala === sala && a.estado === 'BAJA');
        // Renderizar tabla de seguimiento
    }

    // 4. LÓGICA DE NAVEGACIÓN
    function show(id) {
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }
</script>
<style>.hidden { display: none; }</style>
</body>
</html>
