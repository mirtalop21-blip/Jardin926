<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 PRO | GESTIÓN ÉLITE J926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; --border: #333; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Segoe UI', sans-serif; font-size: 11px; }
        .input-elite { background: #000; border: 1px solid var(--border); padding: 8px; color: var(--nuke); width: 100%; text-transform: uppercase; border-radius: 4px; outline: none; }
        .input-elite:focus { border-color: var(--nuke); }
        .tab-content { display: none; } .active-tab { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn-nuke { background: var(--nuke); color: #000; font-weight: bold; padding: 10px; cursor: pointer; border-radius: 4px; border: none; transition: 0.2s; }
        .btn-nuke:hover { background: #bfe600; transform: scale(1.02); }
        .btn-dark { background: #222; border: 1px solid #555; color: #fff; padding: 8px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        .btn-dark:hover { background: #333; border-color: var(--nuke); }
        .card-sala { cursor: pointer; transition: 0.2s; border: 1px solid #444; border-radius: 8px; background: #111; }
        .card-sala:hover { transform: translateY(-3px); border-color: var(--nuke); box-shadow: 0 4px 15px rgba(223, 255, 0, 0.2); }
        .table-elite w-full { text-align: left; border-collapse: collapse; }
        .table-elite th, .table-elite td { padding: 8px; border-bottom: 1px solid #333; }
        .table-elite th { color: var(--nuke); }
    </style>
</head>
<body class="p-4" onload="initSystem()">

    <!-- HEADER -->
    <header class="mb-4 p-4 bg-zinc-900 border border-zinc-800 rounded flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-black text-nuke italic">TITANIUM 360 <span class="text-white text-sm">| J926</span></h1>
            <p id="status_db" class="text-gray-400 font-bold mt-1">SISTEMA INICIANDO...</p>
        </div>
        <div class="flex gap-2">
            <input type="file" id="import_excel" class="hidden" accept=".xlsx, .xls" onchange="importarExcelReal(event)">
            <button onclick="document.getElementById('import_excel').click()" class="btn-nuke text-xs">📥 IMPORTAR EXCEL OFICIAL</button>
            <button onclick="limpiarSistema()" class="btn-dark text-xs border-red-500 hover:bg-red-900">⚠️ RESETEAR SISTEMA</button>
        </div>
    </header>

    <!-- NAVEGACIÓN -->
    <nav class="flex gap-2 mb-6 border-b border-zinc-800 pb-4 text-xs font-black uppercase overflow-x-auto">
        <button onclick="show('v_salas')" class="btn-dark hover:text-nuke">1. FOTO SALAS</button>
        <button onclick="show('v_legajo')" class="btn-dark hover:text-nuke">2. LEGAJO / RADAR</button>
        <button onclick="show('v_espera')" class="btn-dark hover:text-orange-400">3. LISTA ESPERA PRO</button>
        <button onclick="show('v_bajas')" class="btn-dark hover:text-red-500">4. BITÁCORA BAJAS</button>
    </nav>

    <!-- V1: SALAS INTERACTIVAS -->
    <section id="v_salas" class="tab-content active-tab">
        <h2 class="text-xl font-black text-white mb-4">MAPA DE MATRÍCULA EN TIEMPO REAL</h2>
        <div id="grid_salas" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4"></div>
        
        <div id="modal_sala" class="hidden mt-6 p-4 border border-zinc-700 bg-black rounded">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2 mb-4">
                <h3 id="modal_sala_titulo" class="font-black text-nuke text-xl"></h3>
                <button onclick="document.getElementById('modal_sala').classList.add('hidden')" class="text-red-500 font-bold">X CERRAR</button>
            </div>
            <div id="modal_sala_lista" class="grid grid-cols-1 md:grid-cols-3 gap-2"></div>
        </div>
    </section>

    <!-- V2: LEGAJO 360 Y RADAR -->
    <section id="v_legajo" class="tab-content">
        <div class="mb-4">
            <input type="text" id="radar" onkeyup="buscarRadar()" class="input-elite text-lg border-nuke" placeholder="🔍 RADAR: BUSCAR POR DNI O APELLIDO DEL ALUMNO...">
        </div>
        <div class="grid md:grid-cols-2 gap-4" id="form_master">
            <div class="space-y-2 border border-zinc-800 p-4 rounded bg-black">
                <h2 class="text-nuke font-black uppercase mb-2">I. DATOS DEL ALUMNO (SOLO LECTURA EXCEL)</h2>
                <input id="alu_nombre" class="input-elite text-gray-400" placeholder="APELLIDO Y NOMBRE" readonly>
                <input id="alu_dni" type="text" class="input-elite text-gray-400" placeholder="DNI" readonly>
                <input id="alu_sala" class="input-elite text-gray-400" placeholder="SALA ASIGNADA" readonly>
                <input id="alu_dom" class="input-elite text-gray-400" placeholder="DOMICILIO" readonly>
            </div>
            <div class="space-y-2 border border-zinc-800 p-4 rounded bg-black">
                <h2 class="text-blue-400 font-black uppercase mb-2">II. CONTACTO FAMILIAR (EDITABLE)</h2>
                <input id="m_nombre" class="input-elite" placeholder="NOMBRE MADRE/PADRE/TUTOR">
                <input id="m_tel" class="input-elite" placeholder="TELÉFONO DE EMERGENCIA">
                <input id="m_obs" class="input-elite" placeholder="OBSERVACIONES MÉDICAS / GENERALES">
                <button onclick="guardarLegajoAdicional()" class="btn-nuke w-full mt-2">💾 GUARDAR DATOS DE CONTACTO</button>
            </div>
        </div>
    </section>

    <!-- V3: LISTA DE ESPERA PRO -->
    <section id="v_espera" class="tab-content">
        <div class="grid md:grid-cols-3 gap-6">
            <div class="col-span-1 bg-black border border-zinc-800 p-4 rounded">
                <h2 class="text-orange-400 font-black text-lg mb-4">AÑADIR A ESPERA</h2>
                <input id="esp_nombre" class="input-elite mb-2" placeholder="NOMBRE DEL POSTULANTE">
                <input id="esp_tel" class="input-elite mb-2" placeholder="TELÉFONO DE CONTACTO">
                <input id="esp_sala" class="input-elite mb-4" placeholder="SALA DESEADA (Ej: 3ºA)">
                <button onclick="agregarEspera()" class="btn-nuke w-full !bg-orange-400 !text-white">➕ REGISTRAR POSTULANTE</button>
            </div>
            <div class="col-span-2 bg-black border border-zinc-800 p-4 rounded overflow-auto h-96">
                <h2 class="text-white font-black text-lg mb-4">REGISTRO HISTÓRICO DE ESPERA</h2>
                <table class="table-elite w-full text-left">
                    <thead><tr><th>FECHA</th><th>POSTULANTE</th><th>CONTACTO</th><th>SALA</th><th>ACCIÓN</th></tr></thead>
                    <tbody id="tabla_espera"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- V4: BITÁCORA DE BAJAS -->
    <section id="v_bajas" class="tab-content">
        <div class="grid md:grid-cols-3 gap-6">
            <div class="col-span-1 bg-black border border-zinc-800 p-4 rounded">
                <h2 class="text-red-500 font-black text-lg mb-4">REGISTRAR BAJA</h2>
                <input id="baja_nombre" class="input-elite mb-2" placeholder="NOMBRE DEL ALUMNO">
                <input id="baja_motivo" class="input-elite mb-4" placeholder="MOTIVO (Ej: Mudanza, Económico)">
                <button onclick="agregarBaja()" class="btn-nuke w-full !bg-red-600 !text-white">🚨 CONFIRMAR BAJA</button>
            </div>
            <div class="col-span-2 bg-black border border-zinc-800 p-4 rounded overflow-auto h-96">
                <h2 class="text-white font-black text-lg mb-4">HISTORIAL DE BAJAS</h2>
                <table class="table-elite w-full text-left">
                    <thead><tr><th>FECHA</th><th>ALUMNO</th><th>MOTIVO</th><th>ACCIÓN</th></tr></thead>
                    <tbody id="tabla_bajas"></tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- JAVASCRIPT -->
    <script>
        let DB = { mat: [], esp: [], bajas: [] };
        let alumnoSeleccionadoDNI = null;

        function initSystem() {
            const local = JSON.parse(localStorage.getItem('T360_J926_PRO'));
            if(local) {
                if(local.mat) DB.mat = local.mat;
                if(local.esp) DB.esp = local.esp;
                if(local.bajas) DB.bajas = local.bajas;
            }
            actualizarEstado();
            show('v_salas');
        }

        function actualizarEstado() {
            localStorage.setItem('T360_J926_PRO', JSON.stringify(DB));
            document.getElementById('status_db').innerText = `MATRÍCULA: ${DB.mat.length} | ESPERA: ${DB.esp.length} | BAJAS: ${DB.bajas.length}`;
        }

        function limpiarSistema() {
            if(confirm("⚠️ ADVERTENCIA: Esto borrará TODOS los datos (matrícula, listas de espera y bajas). ¿Estás seguro?")) {
                DB = { mat: [], esp: [], bajas: [] };
                actualizarEstado();
                location.reload();
            }
        }

        function show(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-tab');
            if(id === 'v_salas') renderSalasReales();
            if(id === 'v_espera') renderEspera();
            if(id === 'v_bajas') renderBajas();
        }

        // ==========================================
        // 1. IMPORTAR EXCEL 
        // ==========================================
        function importarExcelReal(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                let nuevosAlumnos = [];
                
                workbook.SheetNames.forEach(sheetName => {
                    const sheet = workbook.Sheets[sheetName];
                    const filas = XLSX.utils.sheet_to_json(sheet, {defval: ""});
                    
                    filas.forEach(fila => {
                        let nombre = fila["APELLIDO Y NOMBRE DE LOS ALUMNOS"] || fila["APELLIDO Y NOMBRE"] || fila["ALUMNOS"];
                        let dni = fila["DOC. IDENTIDAD"] || fila["DNI"];
                        let grado = fila["GRADO"];
                        let seccion = fila["SECCION"] || fila["SECCIÓN"];
                        let domicilio = fila["DOMICILIO"];
                        
                        if (nombre && dni && grado && seccion) {
                            let salaFormateada = grado.toString().trim() + " " + seccion.toString().trim();
                            
                            // Mantener datos adicionales si el alumno ya existía
                            let existe = DB.mat.find(a => a.alu_dni === dni.toString());
                            
                            nuevosAlumnos.push({
                                alu_nombre: nombre.toUpperCase(),
                                alu_dni: dni.toString(),
                                alu_sala: salaFormateada,
                                alu_dom: domicilio ? domicilio.toString().toUpperCase() : "S/D",
                                m_nombre: existe ? existe.m_nombre : "",
                                m_tel: existe ? existe.m_tel : "",
                                m_obs: existe ? existe.m_obs : ""
                            });
                        }
                    });
                });
                
                if(nuevosAlumnos.length > 0) {
                    DB.mat = nuevosAlumnos;
                    actualizarEstado();
                    alert(`✅ EXCEL PROCESADO CON ÉXITO.\nSe cargaron ${nuevosAlumnos.length} alumnos.`);
                    renderSalasReales();
                } else {
                    alert("❌ Error: No se detectaron columnas válidas (Verifica que existan GRADO, SECCION, DOC. IDENTIDAD y APELLIDO Y NOMBRE).");
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ==========================================
        // 2. FOTO SALAS
        // ==========================================
        function renderSalasReales() {
            const grid = document.getElementById('grid_salas');
            grid.innerHTML = '';
            const salasUnicas = [...new Set(DB.mat.map(item => item.alu_sala))].sort();
            
            if(salasUnicas.length === 0) {
                grid.innerHTML = `<p class="text-gray-500 col-span-4">No hay alumnos. Por favor, importa tu archivo Excel oficial.</p>`;
                return;
            }

            salasUnicas.forEach(sala => {
                if(!sala || sala === " ") return;
                const cantidad = DB.mat.filter(a => a.alu_sala === sala).length;
                grid.innerHTML += `
                    <div class="card-sala p-4 text-center border-t-4 border-nuke" onclick="verAlumnosSala('${sala}')">
                        <p class="font-black text-white text-xs">SALA</p>
                        <p class="font-black text-nuke text-xl">${sala}</p>
                        <div class="mt-2 text-sm bg-zinc-800 rounded py-1">${cantidad} ALUMNOS</div>
                    </div>`;
            });
        }

        function verAlumnosSala(sala) {
            document.getElementById('modal_sala').classList.remove('hidden');
            document.getElementById('modal_sala_titulo').innerText = `LISTADO | SALA: ${sala}`;
            const lista = document.getElementById('modal_sala_lista');
            lista.innerHTML = '';
            
            DB.mat.filter(a => a.alu_sala === sala).forEach(a => {
                lista.innerHTML += `
                    <div class="flex justify-between items-center p-2 border border-zinc-800 bg-zinc-900 cursor-pointer hover:border-nuke" onclick="abrirEnRadar('${a.alu_dni}')">
                        <span class="font-bold text-[10px] uppercase">${a.alu_nombre}</span>
                        <span class="text-[10px] text-nuke font-bold">> VER</span>
                    </div>`;
            });
        }

        // ==========================================
        // 3. RADAR Y LEGAJO
        // ==========================================
        function abrirEnRadar(dni) {
            show('v_legajo');
            document.getElementById('radar').value = dni;
            buscarRadar();
        }

        function buscarRadar() {
            const q = document.getElementById('radar').value.toUpperCase();
            document.getElementById('alu_nombre').value = "";
            document.getElementById('alu_dni').value = "";
            document.getElementById('alu_sala').value = "";
            document.getElementById('alu_dom').value = "";
            document.getElementById('m_nombre').value = "";
            document.getElementById('m_tel').value = "";
            document.getElementById('m_obs').value = "";
            alumnoSeleccionadoDNI = null;

            if(q.length < 3) return;
            const res = DB.mat.find(a => a.alu_dni.includes(q) || a.alu_nombre.includes(q));
            
            if(res) {
                alumnoSeleccionadoDNI = res.alu_dni;
                document.getElementById('alu_nombre').value = res.alu_nombre;
                document.getElementById('alu_dni').value = res.alu_dni;
                document.getElementById('alu_sala').value = res.alu_sala;
                document.getElementById('alu_dom').value = res.alu_dom;
                document.getElementById('m_nombre').value = res.m_nombre || "";
                document.getElementById('m_tel').value = res.m_tel || "";
                document.getElementById('m_obs').value = res.m_obs || "";
            }
        }

        function guardarLegajoAdicional() {
            if(!alumnoSeleccionadoDNI) {
                alert("Primero busca y selecciona un alumno en el Radar.");
                return;
            }
            let index = DB.mat.findIndex(a => a.alu_dni === alumnoSeleccionadoDNI);
            if(index !== -1) {
                DB.mat[index].m_nombre = document.getElementById('m_nombre').value.toUpperCase();
                DB.mat[index].m_tel = document.getElementById('m_tel').value;
                DB.mat[index].m_obs = document.getElementById('m_obs').value.toUpperCase();
                actualizarEstado();
                alert("Datos de contacto actualizados correctamente.");
            }
        }

        // ==========================================
        // 4. LISTA DE ESPERA
        // ==========================================
        function agregarEspera() {
            const nombre = document.getElementById('esp_nombre').value.toUpperCase();
            const tel = document.getElementById('esp_tel').value;
            const sala = document.getElementById('esp_sala').value.toUpperCase();
            
            if(!nombre) return alert("Falta el nombre.");
            
            DB.esp.push({
                id: Date.now(),
                fecha: new Date().toLocaleDateString(),
                nombre: nombre,
                tel: tel || "S/D",
                sala: sala || "S/D"
            });
            
            document.getElementById('esp_nombre').value = '';
            document.getElementById('esp_tel').value = '';
            document.getElementById('esp_sala').value = '';
            
            actualizarEstado();
            renderEspera();
        }

        function renderEspera() {
            const tabla = document.getElementById('tabla_espera');
            tabla.innerHTML = '';
            DB.esp.forEach(e => {
                tabla.innerHTML += `
                    <tr>
                        <td class="text-gray-400">${e.fecha}</td>
                        <td class="font-bold">${e.nombre}</td>
                        <td>${e.tel}</td>
                        <td><span class="bg-orange-500/20 text-orange-400 px-2 py-1 rounded">${e.sala}</span></td>
                        <td><button onclick="borrarEspera(${e.id})" class="text-red-500 hover:text-white">BORRAR</button></td>
                    </tr>`;
            });
        }

        function borrarEspera(id) {
            DB.esp = DB.esp.filter(e => e.id !== id);
            actualizarEstado();
            renderEspera();
        }

        // ==========================================
        // 5. BITÁCORA DE BAJAS
        // ==========================================
        function agregarBaja() {
            const nombre = document.getElementById('baja_nombre').value.toUpperCase();
            const motivo = document.getElementById('baja_motivo').value.toUpperCase();
            
            if(!nombre) return alert("Ingresa el nombre del alumno.");
            
            DB.bajas.push({
                id: Date.now(),
                fecha: new Date().toLocaleDateString(),
                nombre: nombre,
                motivo: motivo || "SIN ESPECIFICAR"
            });
            
            document.getElementById('baja_nombre').value = '';
            document.getElementById('baja_motivo').value = '';
            
            actualizarEstado();
            renderBajas();
        }

        function renderBajas() {
            const tabla = document.getElementById('tabla_bajas');
            tabla.innerHTML = '';
            DB.bajas.forEach(b => {
                tabla.innerHTML += `
                    <tr>
                        <td class="text-gray-400">${b.fecha}</td>
                        <td class="font-bold">${b.nombre}</td>
                        <td>${b.motivo}</td>
                        <td><button onclick="borrarBaja(${b.id})" class="text-gray-500 hover:text-white">ELIMINAR</button></td>
                    </tr>`;
            });
        }

        function borrarBaja(id) {
            DB.bajas = DB.bajas.filter(b => b.id !== id);
            actualizarEstado();
            renderBajas();
        }
    </script>
</body>
</html>
