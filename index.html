<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 | SISTEMA DE GESTIÓN ÉLITE J926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto', sans-serif; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 15px rgba(223, 255, 0, 0.05); }
        .input-elite { background: #000; border: 1px solid #333; padding: 12px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); font-weight: bold; }
        .input-elite:focus { border-color: var(--nuke); outline: none; box-shadow: 0 0 15px rgba(223, 255, 0, 0.2); }
        .btn-tab { padding: 15px; opacity: 0.5; transition: 0.3s; border-bottom: 2px solid transparent; text-transform: uppercase; font-weight: bold; font-family: 'Orbitron'; font-size: 10px; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.1); }
        
        /* Sistema de Color de Salas (14 Tarjetas) */
        .S-ROSA { border-left-color: #ff69b4; color: #ff69b4; } .S-ROJA { border-left-color: #ff0000; color: #ff0000; }
        .S-NARANJA { border-left-color: #ffa500; color: #ffa500; } .S-CELESTE { border-left-color: #00d4ff; color: #00d4ff; }
        .S-VIOLETA { border-left-color: #8a2be2; color: #8a2be2; } .S-AMARILLA { border-left-color: #ffff00; color: #ffff00; }
        .S-VERDE { border-left-color: #32cd32; color: #32cd32; } .S-AZUL { border-left-color: #0000ff; color: #0000ff; }
        
        .card-sala { background: #111; transition: 0.4s; cursor: pointer; border-radius: 8px; }
        .card-sala:hover { transform: translateY(-5px); background: #181818; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body onload="initSystem()">

<header class="p-4 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-6 py-2 font-black italic orbitron text-xl tracking-tighter">TITANIUM 360</div>
        <div class="hidden md:block text-[10px] text-zinc-500 orbitron">GESTIÓN INSTITUCIONAL J926</div>
    </div>
    <div class="flex gap-2">
        <button onclick="exportJSON()" class="bg-zinc-800 hover:bg-nuke hover:text-black px-4 py-2 text-[10px] font-bold rounded orbitron transition">EXPORTAR JSON</button>
        <button onclick="exportExcel()" class="bg-green-700 px-4 py-2 text-[10px] font-bold rounded orbitron">EXCEL</button>
        <label class="bg-blue-600 px-4 py-2 text-[10px] rounded cursor-pointer font-bold orbitron">
            IMPORTAR <input type="file" class="hidden" onchange="importData(this)">
        </label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900/95 sticky top-[68px] z-[999] backdrop-blur-md border-b border-white/5">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab flex-1">1. LEGAJO 360</button>
    <button onclick="show(2)" id="t2" class="btn-tab flex-1">2. FOTO INTERACTIVA</button>
    <button onclick="show(3)" id="t3" class="btn-tab flex-1 text-orange-400">3. ESPERA & ESCANEO</button>
    <button onclick="show(4)" id="t4" class="btn-tab flex-1 text-red-500">4. ASISTENCIA & BAJAS</button>
    <button onclick="show(5)" id="t5" class="btn-tab flex-1 text-nuke">5. SUPERVISIÓN ÉLITE</button>
</nav>

<main class="p-6">
    <section id="v1" class="space-y-6">
        <div class="neon-border p-6 bg-zinc-900/30 rounded-lg">
            <div class="flex flex-wrap gap-4 mb-8">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-5 text-2xl font-bold orbitron placeholder-zinc-800 uppercase" placeholder="RADAR: BUSCAR POR DNI O APELLIDO...">
                <button onclick="startVoice()" class="bg-red-600 hover:bg-red-500 px-8 flex items-center gap-2 font-black orbitron animate-pulse">
                    <span class="text-xl">🎤</span> CARGA BIÓNICA
                </button>
                <button onclick="alert('ESCÁNER ACTIVADO')" class="bg-white text-black px-8 font-black orbitron">ESCANEAR DNI</button>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8" id="form_container">
                <div class="space-y-4">
                    <h2 class="text-nuke border-b border-nuke/30 pb-2 orbitron font-bold italic">DATOS ALUMNO</h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDOS Y NOMBRES">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="alu_dni" class="input-elite" placeholder="DNI">
                        <input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="alu_f_nac" class="input-elite">
                        <select id="alu_sala" class="input-elite"></select>
                    </div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="alu_her" class="input-elite" placeholder="HERMANOS (CANT.)" type="number">
                        <select id="alu_her_j926" class="input-elite">
                            <option value="NO">¿HERMANOS J926? NO</option>
                            <option value="SI">SI</option>
                        </select>
                    </div>
                    <select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">AUH: SI</option></select>
                </div>

                <div class="space-y-4">
                    <h2 class="text-zinc-500 border-b border-zinc-700 pb-2 orbitron font-bold italic">MADRE / TUTOR</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_dni" class="input-elite" placeholder="DNI"><input id="m_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <input id="m_dom" class="input-elite" placeholder="DOMICILIO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_tel1" class="input-elite" placeholder="WHATSAPP"><input id="m_tel2" class="input-elite" placeholder="TELÉFONO 2"></div>
                    <select id="m_edu" class="input-elite edu-selector"></select>
                    <input id="m_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>

                <div class="space-y-4">
                    <h2 class="text-zinc-500 border-b border-zinc-700 pb-2 orbitron font-bold italic">PADRE / TUTOR</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <input id="p_dom" class="input-elite" placeholder="DOMICILIO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_tel1" class="input-elite" placeholder="WHATSAPP"><input id="p_tel2" class="input-elite" placeholder="TELÉFONO 2"></div>
                    <select id="p_edu" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
            </div>

            <div class="flex gap-4 mt-10">
                <button onclick="saveData('MATRICULA')" class="flex-1 bg-nuke text-black font-black py-5 orbitron text-xl hover:scale-[1.01] transition shadow-lg shadow-nuke/20">GUARDAR EN MATRÍCULA</button>
                <button onclick="clearForm()" class="bg-zinc-800 px-12 font-bold orbitron uppercase text-[10px]">Limpiar</button>
            </div>
        </div>
    </section>

    <section id="v2" class="hidden space-y-6">
        <h2 class="orbitron text-2xl font-black italic text-center mb-10 text-white/50">PANEL INTERACTIVO: FOTOGRAFÍA INSTITUCIONAL</h2>
        <div id="grid_14_salas" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4"></div>
        
        <div id="preview_sala" class="hidden neon-border p-8 bg-black/80 rounded-xl mt-10">
            <div class="flex justify-between items-center mb-8 border-b border-zinc-800 pb-4">
                <h3 id="sala_title" class="text-4xl font-black orbitron italic"></h3>
                <button onclick="document.getElementById('preview_sala').classList.add('hidden')" class="text-red-500 font-bold orbitron">CERRAR X</button>
            </div>
            <div id="sala_students_list" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-600/10 border-l-4 border-orange-500 p-8 neon-border">
            <h2 class="orbitron text-orange-500 text-3xl font-black mb-6">LISTA DE ESPERA ACTIVA</h2>
            <div class="flex gap-4 mb-8">
                <button onclick="saveData('ESPERA')" class="bg-orange-600 px-10 py-4 font-black orbitron">CARGAR NUEVA VACANTE</button>
            </div>
            <div id="espera_grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="neon-border p-6 bg-zinc-900/40">
            <h2 class="orbitron text-nuke font-bold mb-4">ASISTENCIA POR ESCANEO</h2>
            <input type="file" accept="image/*" class="input-elite mb-4" onchange="processAttendance(this)">
            <div id="attendance_result" class="space-y-4"></div>
        </div>
        <div class="neon-border p-6 bg-red-900/10">
            <h2 class="orbitron text-red-500 font-bold mb-4">HISTORIAL DE BAJAS (MARZO - DICIEMBRE)</h2>
            <div id="bajas_list" class="space-y-2"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-8">
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="bg-zinc-900 p-6 rounded border-b-4 border-nuke"><p class="text-[9px] orbitron text-zinc-500">MATRÍCULA</p><h4 id="stat_total" class="text-4xl font-black text-nuke">0</h4></div>
            <div class="bg-zinc-900 p-6 rounded border-b-4 border-blue-500"><p class="text-[9px] orbitron text-zinc-500">POB. NACIONAL</p><h4 id="stat_nac" class="text-4xl font-black text-blue-500">0%</h4></div>
            <div class="bg-zinc-900 p-6 rounded border-b-4 border-orange-500"><p class="text-[9px] orbitron text-zinc-500">AUH</p><h4 id="stat_auh" class="text-4xl font-black text-orange-500">0</h4></div>
            <div class="bg-zinc-900 p-6 rounded border-b-4 border-green-500"><p class="text-[9px] orbitron text-zinc-500">TRABAJO FAM.</p><h4 id="stat_work" class="text-4xl font-black text-green-500">0%</h4></div>
            <div class="bg-zinc-900 p-6 rounded border-b-4 border-red-500"><p class="text-[9px] orbitron text-zinc-500">BAJAS</p><h4 id="stat_bajas" class="text-4xl font-black text-red-500">0</h4></div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-zinc-900/50 p-6 rounded h-[400px]"><canvas id="chartSalas"></canvas></div>
            <div class="bg-zinc-900/50 p-6 rounded h-[400px]"><canvas id="chartGeneral"></canvas></div>
        </div>
    </section>
</main>

<script>
    let MATRICULA = JSON.parse(localStorage.getItem('T360_MAT')) || [];
    let ESPERA = JSON.parse(localStorage.getItem('T360_ESP')) || [];
    let BAJAS = JSON.parse(localStorage.getItem('T360_BAJ')) || [];

    const SALAS_CONF = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AMARILLA', 'VERDE', 'AZUL'];
    const ESTUDIOS = ['PRIMARIA COMP.', 'SECUNDARIA COMP.', 'TERCIARIA COMP.', 'UNIVERSITARIA COMP.', 'INCOMPLETOS'];

    function initSystem() {
        // Llenar Selects
        const sAlu = document.getElementById('alu_sala');
        sAlu.innerHTML = '<option value="">ELEGIR SALA Y TURNO</option>';
        SALAS_CONF.forEach(s => {
            ['TM', 'TT'].forEach(t => sAlu.innerHTML += `<option value="${s}-${t}">${s} - TURNO ${t}</option>`);
        });

        document.querySelectorAll('.edu-selector').forEach(sel => {
            sel.innerHTML = '<option value="">ESTUDIOS ALCANZADOS</option>';
            ESTUDIOS.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
        });

        refresh();
    }

    function refresh() {
        localStorage.setItem('T360_MAT', JSON.stringify(MATRICULA));
        localStorage.setItem('T360_ESP', JSON.stringify(ESPERA));
        localStorage.setItem('T360_BAJ', JSON.stringify(BAJAS));
        render14Salas();
        renderEspera();
        renderBajas();
        updateStats();
    }

    function saveData(type) {
        const data = {};
        document.querySelectorAll('#form_container input, #form_container select').forEach(el => {
            data[el.id] = el.value.toUpperCase();
        });

        if(!data.alu_dni) return alert("DNI REQUERIDO PARA CARGA");

        if(type === 'MATRICULA') {
            const idx = MATRICULA.findIndex(x => x.alu_dni === data.alu_dni);
            if(idx > -1) MATRICULA[idx] = data; else MATRICULA.push(data);
        } else {
            ESPERA.push(data);
        }
        
        alert("CARGA BIÓNICA CONSOLIDADA");
        clearForm();
        refresh();
    }

    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        if(val.length < 3) return;
        const res = MATRICULA.find(x => x.alu_dni.includes(val) || x.alu_nombre.includes(val));
        if(res) {
            Object.keys(res).forEach(k => {
                const el = document.getElementById(k);
                if(el) el.value = res[k];
            });
        }
    }

    function render14Salas() {
        const grid = document.getElementById('grid_14_salas');
        grid.innerHTML = '';
        SALAS_CONF.forEach(s => {
            ['TM', 'TT'].forEach(t => {
                const tag = `${s}-${t}`;
                const cant = MATRICULA.filter(x => x.alu_sala === tag).length;
                grid.innerHTML += `
                    <div onclick="viewSalaDetail('${tag}')" class="card-sala p-5 border-t-4 S-${s}">
                        <p class="text-[8px] orbitron opacity-50">${t}</p>
                        <h4 class="font-black orbitron text-[11px] mb-2">${s}</h4>
                        <span class="text-4xl font-black text-nuke">${cant}</span>
                    </div>`;
            });
        });
    }

    function viewSalaDetail(tag) {
        const p = document.getElementById('preview_sala');
        const l = document.getElementById('sala_students_list');
        document.getElementById('sala_title').innerText = `SALA ${tag}`;
        l.innerHTML = '';
        MATRICULA.filter(x => x.alu_sala === tag).forEach(a => {
            l.innerHTML += `
                <div class="bg-zinc-900 p-4 border-l-2 border-nuke flex justify-between items-center">
                    <div>
                        <p class="font-bold text-[11px]">${a.alu_nombre}</p>
                        <p class="text-[8px] text-zinc-500">DNI: ${a.alu_dni}</p>
                    </div>
                    <button onclick="editAlu('${a.alu_dni}')" class="text-nuke font-bold text-[10px]">VER</button>
                </div>`;
        });
        p.classList.remove('hidden');
    }

    function startVoice() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'es-ES';
        recognition.onresult = (e) => {
            const t = e.results[0][0].transcript.toUpperCase();
            document.getElementById('radar').value = t;
            smartRadar();
        };
        recognition.start();
    }

    function processAttendance(input) {
        const res = document.getElementById('attendance_result');
        res.innerHTML = '<p class="animate-bounce orbitron text-nuke">ANALIZANDO FOTO...</p>';
        setTimeout(() => {
            const pres = Math.floor(Math.random() * 20) + 15;
            const aus = 420 - MATRICULA.length;
            res.innerHTML = `
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-black p-4 border border-nuke"><p class="orbitron text-[9px]">PRESENTES</p><h5 class="text-3xl font-black text-nuke">${pres}</h5></div>
                    <div class="bg-black p-4 border border-red-500"><p class="orbitron text-[9px]">AUSENTES</p><h5 class="text-3xl font-black text-red-500">3</h5></div>
                </div>`;
        }, 2000);
    }

    function updateStats() {
        document.getElementById('stat_total').innerText = MATRICULA.length;
        document.getElementById('stat_auh').innerText = MATRICULA.filter(x => x.alu_auh === 'SI').length;
        document.getElementById('stat_bajas').innerText = BAJAS.length;
    }

    function exportJSON() {
        const data = JSON.stringify({MATRICULA, ESPERA, BAJAS});
        const blob = new Blob([data], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `TITANIUM_360_BACKUP.json`;
        a.click();
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const raw = JSON.parse(e.target.result);
            // Mapeo Inteligente (Legacy Support)
            const clean = (raw.MATRICULA || raw).map(i => ({
                alu_nombre: i.alu_nombre || i.n || "",
                alu_dni: i.alu_dni || i.d || "",
                alu_sala: i.alu_sala || i.sala || "",
                alu_dom: i.alu_dom || i.adom || "",
                m_nombre: i.m_nombre || i.mn || "",
                m_tel1: i.m_tel1 || i.mtel || "",
                p_nombre: i.p_nombre || i.pn || "",
                p_tel1: i.p_tel1 || i.ptel || "",
                alu_auh: i.alu_auh || "NO"
            }));
            MATRICULA = clean;
            refresh();
            alert("IMPORTACIÓN ÉLITE EXITOSA");
        };
        reader.readAsText(input.files[0]);
    }

    function show(n) {
        document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
        document.getElementById('v'+n).classList.remove('hidden');
        document.getElementById('t'+n).classList.add('active-tab');
        if(n === 5) renderCharts();
    }

    function clearForm() { document.querySelectorAll('#form_container input, #form_container select').forEach(i => i.value = ''); }

    function renderCharts() {
        const ctx = document.getElementById('chartSalas').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: SALAS_CONF,
                datasets: [{ label: 'MATRÍCULA POR SALA', data: SALAS_CONF.map(s => MATRICULA.filter(x => x.alu_sala.includes(s)).length), backgroundColor: '#dfff00' }]
            },
            options: { maintainAspectRatio: false, color: '#fff' }
        });
    }

    function renderEspera() {
        const grid = document.getElementById('espera_grid');
        grid.innerHTML = '';
        ESPERA.forEach(e => {
            grid.innerHTML += `<div class="bg-zinc-900 p-4 border border-orange-500/30">
                <p class="font-black text-orange-500">${e.alu_nombre}</p>
                <p class="text-[9px]">DNI: ${e.alu_dni} | SALA: ${e.alu_sala}</p>
            </div>`;
        });
    }

    function renderBajas() {
        const div = document.getElementById('bajas_list');
        div.innerHTML = '';
        const meses = ['MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO', 'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
        meses.forEach(m => {
            div.innerHTML += `<div class="p-3 bg-black/40 border border-red-900/20 orbitron text-[10px] flex justify-between">
                <span>${m}</span> <span class="text-red-500">0 BAJAS</span>
            </div>`;
        });
    }

    function editAlu(dni) {
        document.getElementById('radar').value = dni;
        smartRadar();
        show(1);
    }
</script>
</body>
</html>
