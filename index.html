<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 ELITE | OPERATIVO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-lime-400 font-mono p-2 text-[11px]">
    <header class="border-b border-lime-400 mb-2">
        <h1 class="text-lg font-black">TITANIUM 360 ELITE</h1>
        <input type="file" onchange="cargar(event)" class="text-[9px] w-full">
    </header>

    <nav class="flex gap-1 mb-2">
        <button onclick="tab('v1')" class="border p-1">1. LEGAJOS</button>
        <button onclick="tab('v2')" class="border p-1">2. SALAS</button>
        <button onclick="tab('v5')" class="border p-1">5. SUPERVISIÓN</button>
    </nav>

    <div id="v1" class="tab block">
        <input id="q" onkeyup="buscar()" class="w-full bg-black border p-1" placeholder="RADAR: DNI/NOMBRE...">
        <div id="visor" class="h-64 overflow-y-auto mt-1 border border-zinc-800 p-2"></div>
    </div>

    <div id="v2" class="tab hidden">
        <div id="salas_grid" class="grid grid-cols-2 gap-1"></div>
    </div>

    <div id="v5" class="tab hidden">
        <div id="stats" class="p-2 border mb-2"></div>
        <button onclick="exportar()" class="w-full bg-lime-400 text-black font-bold p-1">📥 DESCARGAR EXCEL OFICIAL</button>
    </div>

    <script>
        let DATA = [];

        function tab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function cargar(e) {
            const r = new FileReader();
            r.onload = (ev) => {
                DATA = JSON.parse(ev.target.result).mat;
                renderSalas();
                renderStats();
            };
            r.readAsText(e.target.files[0]);
        }

        function renderSalas() {
            const salas = ["3ºA", "3ºB", "4ºA", "4ºB"]; // Ajustar según tu JSON
            document.getElementById('salas_grid').innerHTML = salas.map(s => `
                <div class="border p-2 cursor-pointer hover:bg-zinc-900" onclick="filtrarSala('${s}')">
                    SALA ${s}<br>${DATA.filter(a=>a.alu_sala==s).length} ALUMNOS
                </div>
            `).join('');
        }

        function filtrarSala(sala) {
            tab('v1');
            const res = DATA.filter(a => a.alu_sala === sala);
            renderVisor(res);
        }

        function renderVisor(lista) {
            document.getElementById('visor').innerHTML = lista.map(a => `
                <div class="border-b p-1 cursor-pointer" onclick="verLegajo('${a.alu_dni}')">
                    ${a.alu_nombre} | DNI: ${a.alu_dni}
                </div>
            `).join('');
        }

        function verLegajo(dni) {
            const a = DATA.find(x => x.alu_dni == dni);
            alert(`--- FICHA DE LEGAJO 360 ---\n
Alumno: ${a.alu_nombre}\n
Nacimiento: ${a.alu_f_nac}\n
Madre: ${a.m_nombre} | Tel: ${a.m_tel}\n
Estudios Madre: ${a.m_est}\n
AUH: ${a.alu_auh}\n
Domicilio: ${a.alu_dom}`);
        }

        function renderStats() {
            const tot = DATA.length;
            const arg = DATA.filter(a => a.alu_nac == 'ARG').length;
            document.getElementById('stats').innerHTML = `TOTAL MATRÍCULA: ${tot}<br>TOTAL ARGENTINOS: ${arg}`;
        }

        function exportar() {
            let csv = "NOMBRE,DNI,SALA,MADRE\n" + DATA.map(a => `${a.alu_nombre},${a.alu_dni},${a.alu_sala},${a.m_nombre}`).join('\n');
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'SUPERVISION_TITANIUM.csv'; a.click();
        }
    </script>
</body>
</html>
