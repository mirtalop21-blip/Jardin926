<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 | GESTIÓN REAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-lime-400 p-2 font-mono text-[10px]">
    <header class="border-b border-lime-400 pb-2 mb-2">
        <h1 class="font-black text-lg">TITANIUM 360 - MOTOR OPERATIVO</h1>
        <input type="file" onchange="cargar(event)" class="w-full">
    </header>

    <div class="grid grid-cols-3 gap-1 mb-2">
        <button onclick="tab('V1')" class="border p-1">LEGAJOS</button>
        <button onclick="tab('V2')" class="border p-1">SALAS</button>
        <button onclick="tab('V5')" class="border p-1">STATS</button>
    </div>

    <div id="V1" class="tab block">
        <input id="q" onkeyup="buscar()" class="w-full bg-black border p-1" placeholder="RADAR: DNI/NOMBRE...">
        <div id="visor" class="h-64 overflow-y-auto mt-2"></div>
    </div>

    <div id="V2" class="tab hidden grid grid-cols-2 gap-1" id="salas_grid"></div>

    <div id="V5" class="tab hidden p-2 border" id="stats"></div>

    <script>
        let DATA = [];

        function tab(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function cargar(e) {
            const r = new FileReader();
            r.onload = (ev) => {
                DATA = JSON.parse(ev.target.result).mat;
                renderizarTodo();
            };
            r.readAsText(e.target.files[0]);
        }

        function renderizarTodo() {
            // Render Salas Real
            const salas = [...new Set(DATA.map(a => a.alu_sala))];
            document.getElementById('V2').innerHTML = salas.map(s => `
                <div class="border p-2 cursor-pointer hover:bg-zinc-900" onclick="filtrar('${s}')">
                    SALA ${s}: ${DATA.filter(a=>a.alu_sala==s).length}
                </div>
            `).join('');

            // Estadísticas Reales
            const tot = DATA.length;
            const arg = DATA.filter(a => a.alu_nac == 'ARG').length;
            document.getElementById('stats').innerHTML = `
                MATRÍCULA TOTAL: ${tot}<br>
                ARGENTINOS: ${arg} (${((arg/tot)*100).toFixed(1)}%)<br>
                AUH: ${DATA.filter(a => a.alu_auh == 'SI').length}
            `;
        }

        function filtrar(sala) {
            tab('V1');
            renderVisor(DATA.filter(a => a.alu_sala === sala));
        }

        function renderVisor(lista) {
            document.getElementById('visor').innerHTML = lista.map(a => `
                <div class="border-b p-1 cursor-pointer" onclick="verFicha('${a.alu_dni}')">
                    ${a.alu_nombre} | DNI: ${a.alu_dni}
                </div>
            `).join('');
        }

        function verFicha(dni) {
            const a = DATA.find(x => x.alu_dni == dni);
            alert(`--- LEGAJO 360 REAL ---\n
Alumno: ${a.alu_nombre}\n
Sala: ${a.alu_sala}\n
Madre: ${a.m_nombre} | Tel: ${a.m_tel}\n
Ocupación Madre: ${a.m_ocu}\n
Estudios Madre: ${a.m_est}\n
AUH: ${a.alu_auh}\n
Domicilio: ${a.alu_dom}`);
        }

        function buscar() {
            const q = document.getElementById('q').value.toUpperCase();
            renderVisor(DATA.filter(a => a.alu_dni.includes(q) || a.alu_nombre.includes(q)));
        }
    </script>
</body>
</html>
