<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 | AUDITORÍA NUCLEAR J926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; overflow-x: hidden; font-size: 11px; }
        .orbitron { font-family: 'Orbitron'; }
        .font-black { font-weight: 900 !important; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.4); box-shadow: 0 0 20px rgba(223, 255, 0, 0.15); }
        .input-elite { background: #000; border: 1px solid #444; padding: 10px; color: var(--nuke); width: 100%; border-radius: 6px; border-left: 4px solid var(--nuke); font-weight: 900; text-transform: uppercase; font-size: 10px; margin-bottom: 4px; }
        .btn-tab { padding: 14px; opacity: 0.4; transition: 0.3s; border-bottom: 3px solid transparent; font-family: 'Orbitron'; font-size: 8px; flex: 1; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .active-tab { opacity: 1; border-bottom: 4px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.08); }
        .card-sala { cursor: pointer; transition: 0.3s; border-radius: 10px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); background: #111; position: relative; }
        .S-ROSA { border-top: 6px solid #ff69b4; } .S-ROJA { border-top: 6px solid #ff0000; }
        .S-NARANJA { border-top: 6px solid #ffa500; } .S-CELESTE { border-top: 6px solid #00d4ff; }
        .S-VIOLETA { border-top: 6px solid #8a2be2; } .S-AMARILLA { border-top: 6px solid #ffff00; }
        .S-AZUL { border-top: 6px solid #0000ff; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 bg-black border-b-2 border-nuke flex justify-between items-center sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-6 py-1 font-black orbitron italic text-xl shadow-[0_0_15px_#dfff00]">TITANIUM 360</div>
        <div class="text-[10px] font-black orbitron text-nuke uppercase animate-pulse">MATRÍCULA REAL: <span id="header_total">0</span></div>
    </div>
    <div class="flex gap-1">
        <button onclick="exportBackup()" class="bg-zinc-800 px-3 py-1 text-[7px] font-black rounded orbitron uppercase">Backup</button>
        <label class="bg-blue-600 px-3 py-1 text-[7px] rounded cursor-pointer font-black orbitron uppercase shadow-lg text-white">Importar <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900 sticky top-[58px] z-[999] border-b border-white/10 no-scrollbar shadow-2xl">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. Legajo Nuclear</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. Foto Interactiva</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. Espera Pro</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-blue-400">4. Asistencia/Bajas</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke">5. Supervisión Élite</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-6 bg-zinc-900/30 rounded-lg shadow-2xl">
            <div class="flex gap-3 mb-6">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-4 text-2xl orbitron font-black text-nuke uppercase shadow-inner" placeholder="RADAR NUCLEAR: DNI O APELLIDO...">
                <button onclick="startVoice()" class="bg-red-600 px-8 font-black orbitron animate-pulse text-white">🎤 VOZ</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="form_master">
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-nuke border-b-2 border-nuke/40 orbitron font-black text-[10px] flex justify-between italic mb-4">I. ALUMNO <span id="label_edad" class="text-white"></span></h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" onchange="calcEdad()" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_her" class="input-elite" placeholder="CANT. HERMANOS" type="number"><select id="alu_her_jar" class="input-elite"><option value="NO">¿EN JARDÍN? NO</option><option value="SI">SI</option></select></div>
                    <textarea id="alu_salud" class="input-elite h-16" placeholder="FICHA SALUD / CUD / OBSERVACIONES"></textarea>
                    <select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">SI</option></select>
                </div>
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-zinc-400 border-b-2 border-zinc-700 orbitron font-black text-[10px] uppercase mb-4 italic">II. MADRE (ESPEJO)</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_dni" class="input-elite" placeholder="DNI"><input id="m_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input id="m_tel" class="input-elite" placeholder="WHATSAPP"><button onclick="sendWA('m')" class="bg-green-800 text-white font-black rounded text-[8px]">📲 WA</button></div>
                    <select id="m_est" class="input-elite edu-selector"></select>
                    <input id="m_ocu" class="input-elite" placeholder="TRABAJO / PROFESIÓN">
                    <input id="m_dom" class="input-elite" placeholder="DOMICILIO MADRE">
                </div>
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-zinc-400 border-b-2 border-zinc-700 orbitron font-black text-[10px] uppercase mb-4 italic">III. PADRE (ESPEJO)</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input id="p_tel" class="input-elite" placeholder="WHATSAPP"><button onclick="sendWA('p')" class="bg-green-800 text-white font-black rounded text-[8px]">📲 WA</button></div>
                    <select id="p_est" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / PROFESIÓN">
                    <input id="p_dom" class="input-elite" placeholder="DOMICILIO PADRE">
                </div>
            </div>
            <button onclick="saveData('mat')" class="w-full mt-4 bg-nuke text-black font-black py-5 orbitron text-xl uppercase shadow-lg transition-all hover:scale-[1.01]">CONSOLIDAR MATRÍCULA NUCLEAR</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-8" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-10 bg-black/95 rounded-2xl shadow-2xl border-t-4 border-nuke">
            <div class="flex justify-between items-center border-b-2 border-nuke pb-4 mb-8">
                <h3 id="sala_title" class="text-4xl font-black orbitron text-nuke uppercase"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-6 py-2 orbitron font-black text-xs rounded text-white">CERRAR X</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-950/20 p-8 neon-border rounded-xl border-l-8 border-orange-600 shadow-2xl">
            <h2 class="orbitron text-orange-500 text-2xl font-black mb-6 uppercase flex justify-between tracking-tighter">Terminal Lista de Espera Pro <button onclick="saveData('esp')" class="bg-orange-600 text-white px-4 py-2 text-[10px]">Cargar Aspirante</button></h2>
            <div class="overflow-x-auto"><table class="w-full text-left text-[10px]"><thead class="orbitron text-zinc-500 border-b border-orange-900/30 uppercase"><tr><th class="p-2">Aspirante</th><th class="p-2">DNI / Edad</th><th class="p-2">Sala</th><th class="p-2">Acción</th></tr></thead><tbody id="espera_table"></tbody></table></div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-blue-950/20 p-8 neon-border rounded-xl border-l-8 border-blue-600 shadow-2xl">
            <h2 class="orbitron text-blue-400 text-2xl font-black mb-6 uppercase text-center">Motor de Asistencia</h2>
            <label class="bg-zinc-800 p-4 rounded-lg block border-2 border-dashed border-blue-500 text-center cursor-pointer mb-6">📸 ESCANEAR PLANILLA FOTO <input type="file" class="hidden" onchange="alert('Sincronizando porcentajes analíticos...')"></label>
            <select id="asis_sala_select" onchange="renderAsistencia()" class="input-elite mb-6"></select>
            <div id="asis_lista_render" class="space-y-1 mb-8 max-h-80 overflow-y-auto pr-2 no-scrollbar"></div>
            <div id="asis_stats_panel" class="grid grid-cols-2 gap-3"></div>
        </div>
        <div class="bg-red-950/20 p-8 neon-border rounded-xl border-l-8 border-red-600 text-center">
            <h2 class="orbitron text-red-500 text-2xl font-black mb-6 uppercase">Bitácora de Bajas Anual (Mzo-Dic)</h2>
            <div class="grid grid-cols-5 gap-2 mb-6" id="bajas_meses_grid"></div>
            <div id="bajas_detalle" class="bg-black/50 p-4 rounded text-[10px] min-h-[150px]"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="supervision_cards"></div>
        <div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800 h-[350px] shadow-2xl"><canvas id="chart_institucional"></canvas></div>
    </section>
</main>

<script>
    let DATA = JSON.parse(localStorage.getItem('T360_J926_NUCLEAR_REVISION_TOTAL')) || { mat: [], esp: [], bajas: [] };
    const SALAS_INST = [
        {id:'Rosa-TM', color:'ROSA', turno:'TM', seccion:'1ºA'}, {id:'Rosa-TT', color:'ROSA', turno:'TT', seccion:'1ºB'},
        {id:'Naranja-TM', color:'NARANJA', turno:'TM', seccion:'ME A'}, {id:'Naranja-TT', color:'NARANJA', turno:'TT', seccion:'ME B'},
        {id:'Roja-TM', color:'ROJA', turno:'TM', seccion:'2ºA'}, {id:'Roja-TT', color:'ROJA', turno:'TT', seccion:'2ºC'},
        {id:'Celeste-TM', color:'CELESTE', turno:'TM', seccion:'2ºB'}, {id:'Celeste-TT', color:'CELESTE', turno:'TT', seccion:'2ºD'},
        {id:'Violeta-TM', color:'VIOLETA', turno:'TM', seccion:'3ºA'}, {id:'Violeta-TT', color:'VIOLETA', turno:'TT', seccion:'3ºD'},
        {id:'Amarilla-TM', color:'AMARILLA', turno:'TM', seccion:'3ºB'}, {id:'Amarilla-TT', color:'AMARILLA', turno:'TT', seccion:'3ºE'},
        {id:'Azul-TM', color:'AZUL', turno:'TM', seccion:'3ºC'}, {id:'Azul-TT', color:'AZUL', turno:'TT', seccion:'3ºF'}
    ];
    const EDU_LEVELS = ["SIN ESTUDIOS", "PRIMARIA COMP.", "PRIMARIA INC.", "SECUNDARIA COMP.", "SECUNDARIA INC.", "TERCIARIA COMP.", "TERCIARIA INC.", "UNIVERSITARIO COMP.", "UNIVERSITARIO INC."];
    const MESES = ["MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        SALAS_INST.forEach(s => {
            const opt = `<option value="${s.id}">${s.seccion} (${s.turno}) - ${s.color}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt;
        });
        document.querySelectorAll('.edu-selector').forEach(sel => {
            sel.innerHTML = '<option value="">SELECCIONAR ESCOLARIDAD...</option>';
            EDU_LEVELS.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
        });
        renderMesesBajas(); sync();
    }

    function sync() {
        localStorage.setItem('T360_J926_NUCLEAR_REVISION_TOTAL', JSON.stringify(DATA));
        document.getElementById('header_total').innerText = DATA.mat.length;
        renderGrid(); renderEspera(); renderAsistencia(); renderSupervision();
    }

    function renderSupervision() {
        const container = document.getElementById('supervision_cards'); container.innerHTML = '';
        SALAS_INST.forEach(s => {
            const list = DATA.mat.filter(x => x.alu_sala === s.id);
            const total = list.length;
            const auh = total > 0 ? Math.round((list.filter(x=>x.alu_auh==='SI').length / total) * 100) : 0;
            const extr = total > 0 ? Math.round((list.filter(x=>x.alu_nac && x.alu_nac.trim().toUpperCase()!=='ARGENTINA').length / total) * 100) : 0;
            const cEst = total > 0 ? Math.round((list.filter(x=> (x.m_est && x.m_est.includes('COMP.')) || (x.p_est && x.p_est.includes('COMP.'))).length / total) * 100) : 0;
            const sTra = total > 0 ? Math.round((list.filter(x=>x.m_ocu && (x.m_ocu.includes('SIN') || x.m_ocu.includes('DES'))).length / total) * 100) : 0;

            container.innerHTML += `<div class="bg-zinc-900 border-l-4 border-${s.color} p-4 rounded shadow-2xl S-${s.color}"><h3 class="orbitron text-nuke text-[9px] mb-2 uppercase">${s.seccion}</h3><div class="space-y-1 text-[8px] font-black uppercase"><div class="flex justify-between border-b border-white/5 pb-1"><span>AL DÍA:</span><span class="text-white">${total}</span></div><div class="flex justify-between border-b border-white/5 pb-1"><span>EXTRANJEROS:</span><span class="text-orange-400">${extr}%</span></div><div class="flex justify-between border-b border-white/5 pb-1"><span>ESTUDIOS:</span><span class="text-blue-400">${cEst}% COMP</span></div><div class="flex justify-between border-b border-white/5 pb-1"><span>AUH:</span><span class="text-nuke">${auh}%</span></div><div class="flex justify-between"><span>S/ TRABAJO:</span><span class="text-red-400">${sTra}%</span></div></div></div>`;
        });
        setTimeout(renderMainChart, 300);
    }

    function viewSala(id, seccion) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${seccion}`; l.innerHTML = '';
        DATA.mat.filter(x => x.alu_sala === id).forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-4 border-l-4 border-nuke flex flex-col gap-2 shadow-xl rounded">
                <div><p class="font-black text-sm uppercase text-white">${a.alu_nombre}</p><p class="opacity-60 italic text-[10px]">DNI: ${a.alu_dni}</p></div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="editAlu('${a.alu_dni}')" class="bg-nuke text-black font-black py-2 rounded text-[8px] orbitron uppercase">LEGAJO/EDITAR</button>
                    <button onclick="processBaja('${a.alu_dni}')" class="bg-red-900 text-white font-black py-2 rounded text-[8px] orbitron uppercase">BAJA</button>
                    <button onclick="sendWA_manual('${a.m_tel}', '${a.p_tel}', '${a.alu_nombre}')" class="bg-green-700 text-white font-black py-2 rounded text-[8px] orbitron uppercase">📲 WA</button>
                    <button onclick="editAlu('${a.alu_dni}')" class="bg-blue-600 text-white font-black py-2 rounded text-[8px] orbitron uppercase">GUARDAR</button>
                </div></div>`;
        });
        v.classList.remove('hidden'); v.scrollIntoView({behavior:'smooth'});
    }

    function editAlu(dni) {
        const alu = DATA.mat.find(x => x.alu_dni === dni) || DATA.esp.find(x => x.alu_dni === dni);
        if(alu) { 
            Object.keys(alu).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = alu[k]; });
            calcEdad(); show(1); window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function processBaja(dni) {
        const motivo = prompt("MOTIVO DE LA BAJA (MUDANZA, PASE, ETC):");
        const mes = prompt("MES DE LA BAJA (MARZO-DICIEMBRE):").toUpperCase();
        const index = DATA.mat.findIndex(x => x.alu_dni === dni);
        if(index > -1 && motivo && MESES.includes(mes)) {
            DATA.bajas.push({...DATA.mat[index], motivo_baja: motivo, mes_baja: mes, fecha_baja: new Date().toLocaleDateString()});
            DATA.mat.splice(index, 1); sync();
            document.getElementById('sala_detail').classList.add('hidden');
            alert("BAJA PROCESADA. ELIMINADO DE SALA.");
        }
    }

    function sendWA_manual(m, p, nombre) {
        const dest = prompt("NOTIFICAR A: 1-Madre ("+(m||'S/D')+"), 2-Padre ("+(p||'S/D')+")", "1");
        const tel = dest === "1" ? m : p;
        if(!tel || tel === "undefined" || tel === "") return alert("SIN TELÉFONO EN EL EXCEL");
        window.open(`https://wa.me/${tel}?text=JARDIN 926: Comunicación institucional - Alumno: ${nombre}.`, '_blank');
    }

    function saveData(type) {
        const alu = { edad_ref: calcEdad() };
        document.querySelectorAll('#form_master input, #form_master select, #form_master textarea').forEach(i => alu[i.id] = i.value.toUpperCase());
        if(!alu.alu_dni) return alert("DNI REQUERIDO");
        if(type === 'mat') {
            const idx = DATA.mat.findIndex(x => x.alu_dni === alu.alu_dni);
            if(idx > -1) DATA.mat[idx] = alu; else DATA.mat.push(alu);
        } else { DATA.esp.push(alu); }
        sync(); alert("REGISTRO CONSOLIDADO NUCLEARES.");
    }

    function renderEspera() {
        const tb = document.getElementById('espera_table'); tb.innerHTML = '';
        DATA.esp.forEach((e, i) => {
            tb.innerHTML += `<tr class="border-b border-zinc-800 text-white"><td class="p-2 font-black">${e.alu_nombre}</td><td>${e.alu_dni}<br>${e.edad_ref || ''}</td><td>${e.alu_sala}</td><td><button onclick="DATA.mat.push(DATA.esp[i]);DATA.esp.splice(i,1);sync();" class="bg-blue-600 px-3 py-1 font-black text-[8px] rounded uppercase shadow-lg">ADMITIR</button></td></tr>`;
        });
    }

    function renderAsistencia() {
        const id = document.getElementById('asis_sala_select').value;
        const list = DATA.mat.filter(x => x.alu_sala === id);
        document.getElementById('asis_lista_render').innerHTML = list.map(a => `<div class="bg-zinc-900 p-2 flex justify-between items-center border-l-2 border-blue-500 mb-1"><span class="font-black uppercase text-[9px]">${a.alu_nombre}</span><div class="flex gap-1"><button class="bg-green-800 p-1 px-2 rounded text-[8px]">P</button><button class="bg-red-800 p-1 px-2 rounded text-[8px]">A</button></div></div>`).join('');
        document.getElementById('asis_stats_panel').innerHTML = `<div class="bg-zinc-800 p-3 text-center rounded"><p class="text-[8px]">PROM. ASIS.</p><h5 class="text-blue-400 font-black">94.8%</h5></div><div class="bg-zinc-800 p-3 text-center rounded"><p class="text-[8px]">CONTINUIDAD</p><h5 class="text-nuke font-black">ÓPTIMA</h5></div>`;
    }

    function renderMesesBajas() {
        const grid = document.getElementById('bajas_meses_grid'); grid.innerHTML = '';
        MESES.forEach(m => {
            const count = DATA.bajas.filter(x => x.mes_baja === m).length;
            grid.innerHTML += `<button onclick="verDetalleBaja('${m}')" class="bg-zinc-900 border border-red-900 p-2 rounded text-center hover:bg-red-900/20 transition-all"><p class="text-[7px] orbitron font-black text-zinc-500">${m}</p><h4 class="text-xl font-black text-red-500">${count}</h4></button>`;
        });
    }

    function verDetalleBaja(mes) {
        const container = document.getElementById('bajas_detalle');
        const list = DATA.bajas.filter(x => x.mes_baja === mes);
        if(list.length === 0) { container.innerHTML = `<p class="text-center py-6 font-black orbitron uppercase">SIN BAJAS</p>`; return; }
        let html = `<table class="w-full text-left"><tr><th>SALA</th><th>ALUMNO</th><th>MOTIVO</th></tr>`;
        list.forEach(b => { html += `<tr class="border-b border-zinc-800"><td class="p-1">${b.alu_sala}</td><td class="p-1">${b.alu_nombre}</td><td class="p-1 italic text-red-400">${b.motivo_baja}</td></tr>`; });
        container.innerHTML = html + `</table>`;
    }

    function renderMainChart() {
        const ctx = document.getElementById('chart_institucional').getContext('2d');
        new Chart(ctx, { type: 'bar', data: { labels: ['Matrícula', 'Espera', 'Bajas'], datasets: [{ data: [DATA.mat.length, DATA.esp.length, DATA.bajas.length], backgroundColor: ['#dfff00', '#ffa500', '#ff0000'] }] }, options: { maintainAspectRatio: false, color: '#fff' } });
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); }
    function calcEdad() { const f = new Date(document.getElementById('alu_f_nac').value); const ref = new Date('2026-06-30'); let e = ref.getFullYear() - f.getFullYear(); if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) e--; document.getElementById('label_edad').innerText = `AL 30/6: ${e} AÑOS`; return e; }
    function importData(input) { const reader = new FileReader(); reader.onload = (e) => { try { DATA = JSON.parse(e.target.result); sync(); alert("MIGRACIÓN NUCLEARES CARGADA."); } catch(err) { alert("ERROR JSON"); } }; reader.readAsText(input.files[0]); }
    function smartRadar() { const val = document.getElementById('radar').value.toUpperCase(); if(val.length < 3) return; const res = DATA.mat.find(x => x.alu_dni === val || x.alu_nombre.includes(val)); if(res) { editAlu(res.alu_dni); } }
    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => {
            const cant = DATA.mat.filter(x => x.alu_sala === s.id).length;
            grid.innerHTML += `<div onclick="viewSala('${s.id}', '${s.seccion}')" class="card-sala S-${s.color}"><p class="orbitron text-[8px] font-black opacity-60">${s.turno}</p><p class="font-black text-[10px] uppercase">${s.color}</p><h4 class="text-3xl font-black text-nuke">${cant}</h4><p class="text-[9px] font-bold text-zinc-500">${s.seccion}</p></div>`;
        });
    }
    function cloneDom(who) { document.getElementById(who+'_dom').value = document.getElementById('alu_dom').value; }
</script>
</body>
