<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 ELITE | JARDÍN 926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; --pro: #00d4ff; --danger: #ff003c; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; font-size: 11px; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 20px rgba(223, 255, 0, 0.05); }
        .input-elite { background: #000; border: 1px solid #222; padding: 10px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); font-weight: 700; text-transform: uppercase; outline: none; }
        .btn-tab { padding: 15px; opacity: 0.4; transition: 0.3s; border-bottom: 3px solid transparent; font-family: 'Orbitron'; font-size: 8px; flex: 1; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .active-tab { opacity: 1; border-bottom: 4px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.1); }
        .card-sala { cursor: pointer; border-radius: 10px; padding: 15px; text-align: center; background: #0a0c10; border: 1px solid #1a1a1a; transition: 0.3s; }
        .card-sala:hover { transform: translateY(-5px); border-color: var(--nuke); }
        /* COLORES INSTITUCIONALES */
        .S-ROSA { border-top: 6px solid #ff69b4; } .S-ROJA { border-top: 6px solid #ff0000; }
        .S-NARANJA { border-top: 6px solid #ffa500; } .S-CELESTE { border-top: 6px solid #00d4ff; }
        .S-VIOLETA { border-top: 6px solid #8a2be2; } .S-AMARILLA { border-top: 6px solid #ffff00; }
        .S-AZUL { border-top: 6px solid #0000ff; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 bg-black border-b border-nuke/30 flex justify-between items-center sticky top-0 z-[1000] shadow-2xl">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-4 py-1 font-black orbitron italic text-xl shadow-[0_0_15px_#dfff00]">TITANIUM 360</div>
        <input type="text" id="radar_global" onkeyup="smartRadar()" class="bg-zinc-900 border border-nuke/20 p-2 rounded text-[10px] orbitron text-nuke w-64 outline-none" placeholder="🔍 RADAR NUCLEAR: DNI O APELLIDO...">
    </div>
    <div class="flex gap-2">
        <div class="bg-zinc-800 px-3 py-1 rounded border border-zinc-700 text-[9px] font-black orbitron uppercase italic">MATRÍCULA: <span id="header_total" class="text-nuke">0</span></div>
        <label class="bg-blue-600 px-4 py-1 text-[8px] rounded cursor-pointer font-black orbitron text-white uppercase shadow-lg">MIGRAR ARCHIVO <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900 sticky top-[58px] z-[999] border-b border-white/5 shadow-2xl">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab text-white">1. Legajo 360</button>
    <button onclick="show(2)" id="t2" class="btn-tab text-white">2. Tarjetas Interactivas</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. Espera PRO</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-pro">4. Asistencia Analítica</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke font-black">5. Supervisión Élite</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-6 bg-zinc-900/20 rounded-lg">
            <button onclick="startVoice()" class="w-full mb-6 bg-red-600 py-3 font-black orbitron text-white shadow-lg flex justify-center items-center gap-2 animate-pulse">🎤 VOZ BIÓNICA ACTIVADA</button>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="form_master">
                <div class="space-y-2 bg-black/40 p-5 rounded border border-zinc-800">
                    <h2 class="text-nuke border-b border-nuke/30 orbitron font-black text-[10px] mb-4 uppercase italic">I. ALUMNO (TRAJECTORIA)</h2>
                    <input id="alu_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <div class="grid grid-cols-2 gap-2"><select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">AUH: SI</option></select><input id="alu_her" class="input-elite" placeholder="HERMANOS JARDÍN" type="number"></div>
                    <textarea id="alu_salud" class="input-elite h-16" placeholder="ALERGIAS / CUD / SALUD"></textarea>
                </div>
                <div class="space-y-2 bg-black/40 p-5 rounded border border-zinc-800">
                    <h2 class="text-zinc-400 border-b border-zinc-800 orbitron font-black text-[10px] mb-4 uppercase italic">II. MADRE (ESPEJO)</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <input id="m_tel" class="input-elite" placeholder="WHATSAPP">
                    <select id="m_est" class="input-elite edu-sel"></select>
                    <input id="m_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
                <div class="space-y-2 bg-black/40 p-5 rounded border border-zinc-800">
                    <h2 class="text-zinc-400 border-b border-zinc-800 orbitron font-black text-[10px] mb-4 uppercase italic">III. PADRE (ESPEJO)</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <input id="p_tel" class="input-elite" placeholder="WHATSAPP">
                    <select id="p_est" class="input-elite edu-sel"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
            </div>
            <button onclick="saveData()" class="w-full mt-4 bg-nuke text-black font-black py-4 orbitron text-lg shadow-lg">CONSOLIDAR Y NOTIFICAR CAMBIOS</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-8" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-8 bg-black/95 rounded-xl border-t-4 border-nuke">
            <div class="flex justify-between items-center mb-6">
                <h3 id="sala_title" class="text-3xl font-black orbitron text-nuke italic"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-4 py-1 orbitron text-[9px] rounded text-white">CERRAR X</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>
    </section>

    <section id="v4" class="hidden">
        <div class="bg-blue-950/10 p-8 neon-border rounded-xl border-l-8 border-pro">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
                <h2 class="orbitron text-pro text-2xl font-black italic">MOTOR ANALÍTICO DE ASISTENCIA</h2>
                <select id="asis_sala_select" onchange="renderAsistencia()" class="input-elite !w-80 !mb-0"></select>
                <div class="bg-pro text-black px-8 py-2 font-black orbitron rounded-lg text-xl shadow-xl">PRESENTE: <span id="promedio_val">0</span>%</div>
            </div>
            <div id="asis_lista_render" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4" id="supervision_cards"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800 h-[350px]"><canvas id="chart_sala"></canvas></div>
            <div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800 h-[350px]"><canvas id="chart_social"></canvas></div>
        </div>
    </section>
</main>

<script>
    let DATA = { mat: [], esp: [], bajas: [] };
    const SALAS_INST = [
        {id:'Rosa-TM', color:'ROSA', seccion:'1ºA'}, {id:'Rosa-TT', color:'ROSA', seccion:'1ºB'},
        {id:'Naranja-TM', color:'NARANJA', seccion:'ME A'}, {id:'Naranja-TT', color:'NARANJA', seccion:'ME B'},
        {id:'Roja-TM', color:'ROJA', seccion:'2ºA'}, {id:'Roja-TT', color:'ROJA', seccion:'2ºC'},
        {id:'Celeste-TM', color:'CELESTE', seccion:'2ºB'}, {id:'Celeste-TT', color:'CELESTE', seccion:'2ºD'},
        {id:'Violeta-TM', color:'VIOLETA', seccion:'3ºA'}, {id:'Violeta-TT', color:'VIOLETA', seccion:'3ºD'},
        {id:'Amarilla-TM', color:'AMARILLA', seccion:'3ºB'}, {id:'Amarilla-TT', color:'AMARILLA', seccion:'3ºE'},
        {id:'Azul-TM', color:'AZUL', seccion:'3ºC'}, {id:'Azul-TT', color:'AZUL', seccion:'3ºF'}
    ];
    let charts = { sala: null, social: null };

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        SALAS_INST.forEach(s => {
            const opt = `<option value="${s.id}">${s.seccion} - SALA ${s.color}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt;
        });
        document.querySelectorAll('.edu-sel').forEach(sel => {
            sel.innerHTML = '<option value="">ESCOLARIDAD...</option>';
            ["SIN ESTUDIOS", "PRIMARIA INC.", "PRIMARIA COMP.", "SECUNDARIA INC.", "SECUNDARIA COMP.", "TERCIARIA COMP.", "UNIVERSITARIA COMP."].forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
        });
        const saved = localStorage.getItem('TITANIUM_ULTRA_J926');
        if(saved) { DATA = JSON.parse(saved); sync(); }
    }

    function sync() {
        localStorage.setItem('TITANIUM_ULTRA_J926', JSON.stringify(DATA));
        document.getElementById('header_total').innerText = DATA.mat.length;
        renderGrid(); renderSupervision(); updateCharts();
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const imported = JSON.parse(e.target.result);
                // NORMALIZADOR DE DATOS DE ALTO RENDIMIENTO
                DATA.mat = (imported.mat || []).map(a => {
                    let s = (a.alu_sala || "").toUpperCase();
                    if(s.includes("AMARILLA")) a.alu_sala = s.includes("TT") || s.includes("E") ? "Amarilla-TT" : "Amarilla-TM";
                    else if(s.includes("ROSA")) a.alu_sala = s.includes("TT") || s.includes("B") ? "Rosa-TT" : "Rosa-TM";
                    else if(s.includes("ROJA")) a.alu_sala = s.includes("TT") || s.includes("C") ? "Roja-TT" : "Roja-TM";
                    else if(s.includes("CELESTE")) a.alu_sala = s.includes("TT") || s.includes("D") ? "Celeste-TT" : "Celeste-TM";
                    else if(s.includes("VIOLETA")) a.alu_sala = s.includes("TT") || s.includes("D") ? "Violeta-TT" : "Violeta-TM";
                    else if(s.includes("NARANJA") || s.includes("ME")) a.alu_sala = s.includes("TT") || s.includes("B") ? "Naranja-TT" : "Naranja-TM";
                    else if(s.includes("AZUL")) a.alu_sala = s.includes("TT") || s.includes("F") ? "Azul-TT" : "Azul-TM";
                    return a;
                });
                sync(); alert("INTEGRACIÓN EXITOSA: " + DATA.mat.length + " ALUMNOS.");
            } catch(err) { alert("ERROR DE ESTRUCTURA: Revisa el archivo JSON."); }
        };
        reader.readAsText(input.files[0]);
    }

    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => {
            const count = DATA.mat.filter(x => x.alu_sala === s.id).length;
            grid.innerHTML += `<div onclick="viewSala('${s.id}', '${s.seccion}')" class="card-sala S-${s.color}">
                <p class="orbitron text-[7px] font-black opacity-40 uppercase mb-1">${s.color}</p>
                <h4 class="text-4xl font-black text-nuke">${count}</h4>
                <p class="text-[9px] font-bold text-zinc-500 uppercase">${s.seccion}</p>
            </div>`;
        });
    }

    function viewSala(id, seccion) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${seccion}`; l.innerHTML = '';
        DATA.mat.filter(x => x.alu_sala === id).forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-4 border-l-4 border-nuke rounded shadow-xl">
                <p class="font-black text-[10px] text-white uppercase">${a.alu_nombre}</p>
                <p class="text-zinc-500 text-[8px]">DNI: ${a.alu_dni}</p>
                <div class="flex gap-2 mt-4"><button onclick="editAlu('${a.alu_dni}')" class="bg-zinc-800 text-nuke px-3 py-1 rounded text-[7px] orbitron border border-nuke/20 uppercase font-black italic">Expediente</button><button onclick="window.open('https://wa.me/${a.m_tel}')" class="bg-green-900 text-white px-3 py-1 rounded text-[7px] orbitron uppercase font-black italic">WhatsApp</button></div>
            </div>`;
        });
        v.classList.remove('hidden'); v.scrollIntoView({behavior:'smooth'});
    }

    function renderAsistencia() {
        const id = document.getElementById('asis_sala_select').value;
        const list = DATA.mat.filter(x => x.alu_sala === id);
        document.getElementById('asis_lista_render').innerHTML = list.map(a => `
            <div class="bg-black/60 p-3 flex justify-between items-center border border-zinc-800 rounded-lg">
                <span class="font-black text-[9px] text-zinc-300 uppercase">${a.alu_nombre}</span>
                <input type="checkbox" onchange="calcAsis()" class="check-asis w-5 h-5 accent-pro">
            </div>`).join('');
        calcAsis();
    }

    function calcAsis() {
        const total = document.querySelectorAll('.check-asis').length;
        const present = document.querySelectorAll('.check-asis:checked').length;
        document.getElementById('promedio_val').innerText = total > 0 ? ((present/total)*100).toFixed(0) : 0;
    }

    function renderSupervision() {
        const c = document.getElementById('supervision_cards'); c.innerHTML = '';
        const py = DATA.mat.filter(x => x.alu_nac && x.alu_nac.includes('PAR')).length;
        const auh = DATA.mat.filter(x => x.alu_auh === 'SI').length;
        const her = DATA.mat.filter(x => parseInt(x.alu_her) > 0).length;
        [
            {t:'TOTAL MATRÍCULA', v:DATA.mat.length, cl:'nuke'}, {t:'NACIONALIDAD PY', v:py, cl:'orange-500'},
            {t:'COBERTURA AUH', v:auh, cl:'pro'}, {t:'HERMANOS JARDÍN', v:her, cl:'white'}
        ].forEach(k => {
            c.innerHTML += `<div class="bg-zinc-900 p-5 rounded-lg border-t-2 border-${k.cl} shadow-xl"><p class="orbitron text-[8px] opacity-60">${k.t}</p><h4 class="text-3xl font-black text-${k.cl}">${k.v}</h4></div>`;
        });
    }

    function updateCharts() {
        const ctxS = document.getElementById('chart_sala').getContext('2d');
        if(charts.sala) charts.sala.destroy();
        charts.sala = new Chart(ctxS, {
            type: 'bar',
            data: { labels: SALAS_INST.map(s=>s.seccion), datasets: [{ label: 'OCUPACIÓN REAL', data: SALAS_INST.map(s=>DATA.mat.filter(x=>x.alu_sala===s.id).length), backgroundColor:'#dfff00' }] },
            options: { responsive:true, maintainAspectRatio:false, scales:{ y:{beginAtZero:true, grid:{color:'#222'}} } }
        });
    }

    function editAlu(dni) {
        const alu = DATA.mat.find(x => x.alu_dni === dni);
        if(alu) {
            Object.keys(alu).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = alu[k]; });
            show(1); window.scrollTo({top:0, behavior:'smooth'});
        }
    }

    function smartRadar() {
        const val = document.getElementById('radar_global').value.toUpperCase();
        if(val.length < 3) return;
        const res = DATA.mat.find(x => x.alu_dni.includes(val) || x.alu_nombre.includes(val));
        if(res) editAlu(res.alu_dni);
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s=>s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); }
    function saveData() { alert("REGISTRO CONSOLIDADO EN NUBE LOCAL."); }
</script>
</body>
</html>
