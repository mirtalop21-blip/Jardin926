<div class="container-fluid radar-legajo-container text-white p-4" style="background-color: #0b0c10; font-family: sans-serif;">
    
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2" style="border-color: #1f2833 !important;">
        <h2 style="color: #66fcf1; font-weight: bold; font-size: 1.5rem;">1. RADAR 360 & LEGAJO (EDICIÓN PRINCIPAL)</h2>
        <div>
            <button class="btn btn-sm mx-1" style="background-color: #00ff87; color: #000; font-weight: bold;">💾 GUARDAR MATRÍCULA</button>
            <button class="btn btn-sm btn-danger mx-1" style="font-weight: bold;">❌ BAJA</button>
        </div>
    </div>

    <form id="formMatrícula">
        <div class="row g-4">
            
            <div class="col-12 col-md-4 p-3 rounded" style="background-color: #121212; border: 1px solid #00ff87;">
                <h4 style="color: #00ff87; border-bottom: 1px solid #333;" class="pb-2">DATOS ALUMNO</h4>
                
                <div class="mb-3">
                    <label class="form-label text-uppercase small">Apellido y Nombre</label>
                    <input type="text" id="nombre_alumno" class="form-control bg-dark text-white border-secondary" placeholder="APELLIDO Y NOMBRE" required>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">DNI</label>
                        <input type="number" id="dni_alumno" class="form-control bg-dark text-white border-secondary" placeholder="DNI" required>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">Nacionalidad</label>
                        <input type="text" id="nac_alumno" class="form-control bg-dark text-white border-secondary" placeholder="NACIONALIDAD" value="ARGENTINA">
                    </div>
                </div>
                <div class="row">
                    <div class="col-7 mb-3">
                        <label class="form-label text-uppercase small">Fecha de Nacimiento</label>
                        <input type="date" id="fnac_alumno" class="form-control bg-dark text-white border-secondary" onchange="calcularEdadCorte()">
                    </div>
                    <div class="col-5 mb-3">
                        <label class="form-label text-uppercase small">Edad al 30/6</label>
                        <input type="text" id="edad_alumno" class="form-control bg-dark text-info border-secondary font-weight-bold" readonly placeholder="-">
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">Hermanos (Cant.)</label>
                        <input type="number" id="hermanos_cant" class="form-control bg-dark text-white border-secondary" min="0" value="0">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">¿Hermanos en Jardín?</label>
                        <select id="hermanos_jardin" class="form-select bg-dark text-white border-secondary">
                            <option value="NO">NO</option>
                            <option value="SI">SÍ</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-uppercase small">Domicilio Completo</label>
                    <input type="text" id="domicilio_alumno" class="form-control bg-dark text-white border-secondary" placeholder="CALLE, NÚMERO, LOCALIDAD" oninput="actualizarDomiciliosEspejo()">
                </div>
                <div class="mb-3">
                    <label class="form-label text-uppercase small">Ficha de Salud</label>
                    <select id="ficha_salud" class="form-select bg-dark text-white border-secondary">
                        <option value="PENDIENTE">PENDIENTE / EN TRÁMITE</option>
                        <option value="ENTREGADA">ENTREGADA Y COMPLETA</option>
                        <option value="INCOMPLETA">INCOMPLETA</option>
                    </select>
                </div>
            </div>

            <div class="col-12 col-md-4 p-3 rounded" style="background-color: #121212; border: 1px solid #66fcf1;">
                <h4 style="color: #66fcf1; border-bottom: 1px solid #333;" class="pb-2">DATOS MADRE</h4>
                
                <div class="mb-3">
                    <label class="form-label text-uppercase small">Apellido y Nombre</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="APELLIDO Y NOMBRE">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">DNI</label>
                        <input type="number" class="form-control bg-dark text-white border-secondary" placeholder="DNI">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">Nacionalidad</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="NACIONALIDAD">
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">Ocupación</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="TRABAJO / OFICIO">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">Teléfono</label>
                        <input type="tel" class="form-control bg-dark text-white border-secondary" placeholder="NÚMERO DE CONTACTO">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-uppercase small">Estudios Alcanzados</label>
                    <select class="form-select bg-dark text-white border-secondary">
                        <option value="SIN ESTUDIOS">SIN ESTUDIOS</option>
                        <option value="PRIMARIA INCOMPLETA">PRIMARIA INCOMPLETA</option>
                        <option value="PRIMARIA COMPLETA">PRIMARIA COMPLETA</option>
                        <option value="SECUNDARIA INCOMPLETA">SECUNDARIA INCOMPLETA</option>
                        <option value="SECUNDARIA COMPLETA">SECUNDARIA COMPLETA</option>
                        <option value="TERCIARIA INCOMPLETA">TERCIARIA INCOMPLETA</option>
                        <option value="TERCIARIA COMPLETA">TERCIARIA COMPLETA</option>
                        <option value="UNIVERSITARIOS INCOMPLETO">UNIVERSITARIO INCOMPLETO</option>
                        <option value="UNIVERSITARIOS COMPLETO">UNIVERSITARIO COMPLETO</option>
                    </select>
                </div>
                <div class="mb-3 form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="mismo_dom_madre" checked onchange="toggleDomicilio('madre')">
                    <label class="form-check-label small" for="mismo_dom_madre">Mismo domicilio del alumno</label>
                </div>
                <div class="mb-3">
                    <input type="text" id="domicilio_madre" class="form-control bg-dark text-white border-secondary" placeholder="DOMICILIO MADRE" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label text-uppercase small">¿Percibe AUH?</label>
                    <select class="form-select bg-dark text-white border-secondary">
                        <option value="NO">NO</option>
                        <option value="SI">SÍ</option>
                    </select>
                </div>
            </div>

            <div class="col-12 col-md-4 p-3 rounded" style="background-color: #121212; border: 1px solid #66fcf1;">
                <h4 style="color: #66fcf1; border-bottom: 1px solid #333;" class="pb-2">DATOS PADRE</h4>
                
                <div class="mb-3">
                    <label class="form-label text-uppercase small">Apellido y Nombre</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="APELLIDO Y NOMBRE">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">DNI</label>
                        <input type="number" class="form-control bg-dark text-white border-secondary" placeholder="DNI">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">Nacionalidad</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="NACIONALIDAD">
                    </div>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">Ocupación</label>
                        <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="TRABAJO / OFICIO">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label text-uppercase small">Teléfono</label>
                        <input type="tel" class="form-control bg-dark text-white border-secondary" placeholder="NÚMERO DE CONTACTO">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-uppercase small">Estudios Alcanzados</label>
                    <select class="form-select bg-dark text-white border-secondary">
                        <option value="SIN ESTUDIOS">SIN ESTUDIOS</option>
                        <option value="PRIMARIA INCOMPLETA">PRIMARIA INCOMPLETA</option>
                        <option value="PRIMARIA COMPLETA">PRIMARIA COMPLETA</option>
                        <option value="SECUNDARIA INCOMPLETA">SECUNDARIA INCOMPLETA</option>
                        <option value="SECUNDARIA COMPLETA">SECUNDARIA COMPLETA</option>
                        <option value="TERCIARIA INCOMPLETA">TERCIARIA INCOMPLETA</option>
                        <option value="TERCIARIA COMPLETA">TERCIARIA COMPLETA</option>
                        <option value="UNIVERSITARIOS INCOMPLETO">UNIVERSITARIO INCOMPLETO</option>
                        <option value="UNIVERSITARIOS COMPLETO">UNIVERSITARIO COMPLETO</option>
                    </select>
                </div>
                <div class="mb-3 form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="mismo_dom_padre" checked onchange="toggleDomicilio('padre')">
                    <label class="form-check-label small" for="mismo_dom_padre">Mismo domicilio del alumno</label>
                </div>
                <div class="mb-3">
                    <input type="text" id="domicilio_padre" class="form-control bg-dark text-white border-secondary" placeholder="DOMICILIO PADRE" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label text-uppercase small">¿Percibe AUH?</label>
                    <select class="form-select bg-dark text-white border-secondary">
                        <option value="NO">NO</option>
                        <option value="SI">SÍ</option>
                    </select>
                </div>
            </div>

        </div>
    </form>
</div>

<script>
    // 1. Lógica para calcular la edad exacta obtenida al 30 de Junio del año en curso
    function calcularEdadCorte() {
        const fechaNacInput = document.getElementById('fnac_alumno').value;
        if (!fechaNacInput) return;

        const fechaNac = new Date(fechaNacInput);
        const anioActual = new Date().getFullYear();
        
        // Creamos la fecha límite del 30 de Junio del año actual
        const fechaCorte = new Date(anioActual, 5, 30); // Mes 5 es Junio en JS (0-11)

        let edad = anioActual - fechaNac.getFullYear();
        
        // Ajustamos si el cumpleaños es posterior al 30 de junio en su mes nativo
        const mesNac = fechaNac.getMonth();
        const diaNac = fechaNac.getDate();

        if (mesNac > 5 || (mesNac === 5 && diaNac > 30)) {
            edad--;
        }

        document.getElementById('edad_alumno').value = edad >= 0 ? edad + " años" : "Error";
    }

    // 2. Sincronización automática de domicilios espejo
    function actualizarDomiciliosEspejo() {
        const domAlumno = document.getElementById('domicilio_alumno').value;
        
        if (document.getElementById('mismo_dom_madre').checked) {
            document.getElementById('domicilio_madre').value = domAlumno;
        }
        if (document.getElementById('mismo_dom_padre').checked) {
            document.getElementById('domicilio_padre').value = domAlumno;
        }
    }

    // 3. Bloqueo/Desbloqueo de campos espejo si deciden ingresar otra dirección
    function toggleDomicilio(tipo) {
        const checkbox = document.getElementById(`mismo_dom_${tipo}`);
        const inputDom = document.getElementById(`domicilio_${tipo}`);
        
        if (checkbox.checked) {
            inputDom.readOnly = true;
            actualizarDomiciliosEspejo();
        } else {
            inputDom.readOnly = false;
            inputDom.value = ""; // Limpia para dejar escribir un nuevo domicilio
            inputDom.focus();
        }
    }
    
    // Inicializar espejos por defecto al cargar
    window.onload = function() {
        actualizarDomiciliosEspejo();
    };
</script>
