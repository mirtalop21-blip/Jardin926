<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 ELITE | JARDÍN 926 | AUDITORÍA TOTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; --danger: #ff003c; --pro: #00d4ff; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; font-size: 11px; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.4); box-shadow: 0 0 15px rgba(223, 255, 0, 0.1); }
        .input-elite { background: #000; border: 1px solid #333; padding: 10px; color: var(--nuke); width: 100%; border-radius: 6px; border-left: 4px solid var(--nuke); font-weight: 900; text-transform: uppercase; margin-bottom: 4px; outline: none; }
        .btn-tab { padding: 14px; opacity: 0.4; transition: 0.3s; border-bottom: 3px solid transparent; font-family: 'Orbitron'; font-size: 8px; flex: 1; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .active-tab { opacity: 1; border-bottom: 4px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.08); }
        .card-sala { cursor: pointer; border-radius: 10px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); background: #111; transition: 0.3s; }
        .card-sala:hover { transform: scale(1.05); border-color: var(--nuke); }
        .S-ROSA { border-top: 6px solid #ff69b4; } .S-ROJA { border-top: 6px solid #ff0000; }
        .S-NARANJA { border-top: 6px solid #ffa500; } .S-CELESTE { border-top: 6px solid #00d4ff; }
        .S-VIOLETA { border-top: 6px solid #8a2be2; } .S-AMARILLA { border-top: 6px solid #ffff00; }
        .S-AZUL { border-top: 6px solid #0000ff; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 bg-black border-b-2 border-nuke flex justify-between items-center sticky top-0 z-[1000] shadow-2xl">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-6 py-1 font-black orbitron italic text-xl shadow-[0_0_20px_#dfff00]">TITANIUM 360</div>
        <input type="text" id="radar_global" onkeyup="smartRadar()" class="bg-zinc-900 border border-nuke/30 p-2 rounded text-[10px] orbitron text-nuke w-48 outline-none" placeholder="🔍 RADAR NUCLEAR">
    </div>
    <div class="flex gap-2">
        <div class="bg-zinc-800 px-3 py-1 rounded border border-zinc-700 text-[9px] font-black orbitron uppercase italic">Mat: <span id="header_total" class="text-nuke">0</span></div>
        <label class="bg-blue-600 px-4 py-1 text-[8px] rounded cursor-pointer font-black orbitron text-white uppercase shadow-lg">MIGRAR JSON <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900 sticky top-[58px] z-[999] border-b border-white/10 no-scrollbar shadow-2xl">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. Legajo 360</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. Foto Interactiva</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. Espera Pro</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-blue-400">4. Asistencia/Bajas</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke font-black">5. Supervisión Élite</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-6 bg-zinc-900/30 rounded-lg shadow-2xl">
            <div class="flex gap-2 mb-6">
                <button onclick="startVoice()" class="flex-1 bg-red-600 py-3 font-black orbitron text-white shadow-lg animate-pulse">🎤 CARGA BIÓNICA ACTIVADA</button>
                <button onclick="alert('Iniciando Escaneo Biónico...')" class="bg-zinc-800 px-6 font-black orbitron text-nuke border border-nuke">📸 ESCANEO</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="form_master">
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-nuke border-b-2 border-nuke/40 orbitron font-black text-[10px] flex justify-between mb-4 italic uppercase">I. Alumno <span id="label_edad" class="text-white"></span></h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" onchange="calcEdad()" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_her" class="input-elite" placeholder="HERMANOS" type="number"><select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">SI</option></select></div>
                    <textarea id="alu_salud" class="input-elite h-16" placeholder="ALERGIAS / CUD / SALUD"></textarea>
                </div>
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-zinc-400 border-b-2 border-zinc-700 orbitron font-black text-[10px] uppercase mb-4 italic">II. MADRE (ESPEJO)</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_dni" class="input-elite" placeholder="DNI"><input id="m_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input id="m_tel" class="input-elite" placeholder="WHATSAPP"><input id="m_tel_aux" class="input-elite" placeholder="TEL AUX"></div>
                    <select id="m_est" class="input-elite edu-selector"></select>
                    <input id="m_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-zinc-400 border-b-2 border-zinc-700 orbitron font-black text-[10px] uppercase mb-4 italic">III. PADRE (ESPEJO)</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input id="p_tel" class="input-elite" placeholder="WHATSAPP"><input id="p_tel_aux" class="input-elite" placeholder="TEL AUX"></div>
                    <select id="p_est" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
            </div>
            <button onclick="saveData('mat')" class="w-full mt-4 bg-nuke text-black font-black py-5 orbitron text-xl uppercase shadow-lg">CONSOLIDAR Y GUARDAR MATRÍCULA</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-8" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-10 bg-black/95 rounded-2xl shadow-2xl border-t-4 border-nuke">
            <div class="flex justify-between items-center border-b-2 border-nuke pb-4 mb-8">
                <h3 id="sala_title" class="text-4xl font-black orbitron text-nuke uppercase italic"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-6 py-2 orbitron font-black text-xs rounded text-white uppercase">CERRAR X</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-950/20 p-8 neon-border rounded-xl border-l-8 border-orange-600 shadow-2xl">
            <h2 class="orbitron text-orange-500 text-2xl font-black mb-6 uppercase flex justify-between">LISTA DE ESPERA PRO <button onclick="saveData('esp')" class="bg-orange-600 text-white px-4 py-2 text-[10px] rounded uppercase shadow-lg font-black">Cargar Aspirante</button></h2>
            <div class="overflow-x-auto"><table class="w-full text-left text-[10px]"><thead class="orbitron text-zinc-500 border-b border-orange-900/30 uppercase"><tr><th class="p-2">Aspirante</th><th class="p-2">DNI / Edad al 30/6</th><th class="p-2">Sala</th><th class="p-2">Acción</th></tr></thead><tbody id="espera_table"></tbody></table></div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-blue-950/20 p-8 neon-border rounded-xl border-l-8 border-blue-600">
            <h2 class="orbitron text-blue-400 text-2xl font-black mb-6 uppercase text-center italic">Presentismo Espejo</h2>
            <label class="bg-zinc-800 p-4 rounded-lg block border-2 border-dashed border-blue-500 text-center cursor-pointer mb-6 uppercase orbitron text-[10px] font-black italic">📸 CARGAR FOTO PLANILLA ASISTENCIA <input type="file" class="hidden" onchange="alert('ANALIZANDO IMAGEN... OBTENIENDO PROMEDIOS...')"></label>
            <select id="asis_sala_select" onchange="renderAsistencia()" class="input-elite mb-6"></select>
            <div id="asis_lista_render" class="space-y-1 mb-8 max-h-80 overflow-y-auto pr-2 no-scrollbar"></div>
            <div id="asis_stats_panel" class="grid grid-cols-3 gap-3"></div>
        </div>
        <div class="bg-red-950/20 p-8 neon-border rounded-xl border-l-8 border-red-600">
            <h2 class="orbitron text-red-500 text-2xl font-black mb-6 uppercase text-center italic">Bitácora de Bajas Anual</h2>
            <div class="grid grid-cols-5 gap-2 mb-6" id="bajas_meses_grid"></div>
            <div id="bajas_detalle" class="bg-black/50 p-4 rounded text-[10px] min-h-[150px] uppercase font-black"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="supervision_cards"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[400px]">
            <div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800 shadow-2xl"><canvas id="chart_sala"></canvas></div>
            <div class="bg-zinc-900 p-8 rounded-xl shadow-2xl border border-zinc-800 h-[350px] flex items-center justify-center italic orbitron text-nuke uppercase font-black text-center">ANÁLISIS POBLACIONAL EN TIEMPO REAL ACTIVADO</div>
        </div>
    </section>
</main>

<script>
    let DATA = { mat: [], esp: [], bajas: [] };
    const SALAS_INST = [
        {id:'Rosa-TM', color:'ROSA', turno:'TM', seccion:'1ºA'}, {id:'Rosa-TT', color:'ROSA', turno:'TT', seccion:'1ºB'},
        {id:'Naranja-TM', color:'NARANJA', turno:'TM', seccion:'ME A'}, {id:'Naranja-TT', color:'NARANJA', turno:'TT', seccion:'ME B'},
        {id:'Roja-TM', color:'ROJA', turno:'TM', seccion:'2ºA'}, {id:'Roja-TT', color:'ROJA', turno:'TT', seccion:'2ºC'},
        {id:'Celeste-TM', color:'CELESTE', turno:'TM', seccion:'2ºB'}, {id:'Celeste-TT', color:'CELESTE', turno:'TT', seccion:'2ºD'},
        {id:'Violeta-TM', color:'VIOLETA', turno:'TM', seccion:'3ºA'}, {id:'Violeta-TT', color:'VIOLETA', turno:'TT', seccion:'3ºD'},
        {id:'Amarilla-TM', color:'AMARILLA', turno:'TM', seccion:'3ºB'}, {id:'Amarilla-TT', color:'AMARILLA', turno:'TT', seccion:'3ºE'},
        {id:'Azul-TM', color:'AZUL', turno:'TM', seccion:'3ºC'}, {id:'Azul-TT', color:'AZUL', turno:'TT', seccion:'3ºF'}
    ];
    const MESES = ["MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
    let mainChart = null;

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        SALAS_INST.forEach(s => {
            const opt = `<option value="${s.id}">${s.seccion} (${s.turno}) - SALA ${s.color}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt;
        });
        document.querySelectorAll('.edu-selector').forEach(sel => {
            sel.innerHTML = '<option value="">SELECCIONAR ESCOLARIDAD...</option>';
            ["SIN ESTUDIOS", "PRIMARIA COMP.", "PRIMARIA INC.", "SECUNDARIA COMP.", "SECUNDARIA INC.", "TERCIARIA COMP.", "UNIVERSITARIA COMP."].forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
        });
        renderMesesBajas();
        const saved = localStorage.getItem('TITANIUM_360_ELITE_PRO');
        if(saved) { DATA = JSON.parse(saved); sync(); }
    }

    function sync() {
        localStorage.setItem('TITANIUM_360_ELITE_PRO', JSON.stringify(DATA));
        document.getElementById('header_total').innerText = DATA.mat.length;
        renderGrid(); renderEspera(); renderAsistencia(); renderSupervision(); updateChart();
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const imported = JSON.parse(e.target.result);
                // IMPORTADOR UNIVERSAL: Reasigna las salas automáticamente por nombre o ID
                DATA.mat = (imported.mat || []).map(a => {
                    let s = (a.alu_sala || "").toUpperCase();
                    if(s.includes("AMARILLA")) a.alu_sala = s.includes("TT") || s.includes("E") ? "Amarilla-TT" : "Amarilla-TM";
                    else if(s.includes("ROSA")) a.alu_sala = s.includes("TT") || s.includes("B") ? "Rosa-TT" : "Rosa-TM";
                    else if(s.includes("ROJA")) a.alu_sala = s.includes("TT") || s.includes("C") ? "Roja-TT" : "Roja-TM";
                    else if(s.includes("CELESTE")) a.alu_sala = s.includes("TT") || s.includes("D") ? "Celeste-TT" : "Celeste-TM";
                    else if(s.includes("VIOLETA")) a.alu_sala = s.includes("TT") || s.includes("D") ? "Violeta-TT" : "Violeta-TM";
                    else if(s.includes("NARANJA") || s.includes("ME")) a.alu_sala = s.includes("TT") || s.includes("B") ? "Naranja-TT" : "Naranja-TM";
                    else if(s.includes("AZUL")) a.alu_sala = s.includes("TT") || s.includes("F") ? "Azul-TT" : "Azul-TM";
                    return a;
                });
                DATA.esp = imported.esp || [];
                DATA.bajas = imported.bajas || [];
                sync();
                alert("CARGA ANALÍTICA EXITOSA: " + DATA.mat.length + " ALUMNOS ACTIVADOS.");
            } catch(err) { alert("ERROR CRÍTICO: Archivo no válido."); }
        };
        reader.readAsText(input.files[0]);
    }

    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => {
            const count = DATA.mat.filter(x => x.alu_sala === s.id).length;
            grid.innerHTML += `<div onclick="viewSala('${s.id}', '${s.seccion}')" class="card-sala S-${s.color}">
                <p class="orbitron text-[8px] font-black opacity-60 uppercase mb-1">${s.color}</p>
                <h4 class="text-3xl font-black text-nuke">${count}</h4>
                <p class="text-[9px] font-bold text-zinc-500 uppercase">${s.seccion}</p>
            </div>`;
        });
    }

    function viewSala(id, seccion) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${seccion}`; l.innerHTML = '';
        DATA.mat.filter(x => x.alu_sala === id).forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-5 border-l-4 border-nuke shadow-2xl rounded-lg">
                <p class="font-black text-xs uppercase text-white mb-1 italic">${a.alu_nombre}</p>
                <p class="text-zinc-500 font-bold text-[9px]">DNI: ${a.alu_dni}</p>
                <div class="mt-4"><button onclick="editAlu('${a.alu_dni}')" class="w-full bg-zinc-800 text-nuke font-black py-2 rounded text-[7px] orbitron border border-nuke/20 uppercase hover:bg-nuke hover:text-black transition">VER LEGAJO / EDITAR</button></div>
            </div>`;
        });
        v.classList.remove('hidden'); v.scrollIntoView({behavior:'smooth'});
    }

    function renderAsistencia() {
        const id = document.getElementById('asis_sala_select').value;
        const list = DATA.mat.filter(x => x.alu_sala === id);
        const render = document.getElementById('asis_lista_render');
        render.innerHTML = list.map(a => `
            <div class="bg-black/60 p-3 flex justify-between items-center border border-zinc-800 rounded-lg shadow-lg">
                <span class="font-black text-[9px] text-zinc-300 uppercase italic">${a.alu_nombre}</span>
                <input type="checkbox" onchange="calcPromedio()" class="asis-check accent-pro w-6 h-6 rounded">
            </div>`).join('');
        calcPromedio();
    }

    function calcPromedio() {
        const total = document.querySelectorAll('.asis-check').length;
        const pres = document.querySelectorAll('.asis-check:checked').length;
        const prom = total > 0 ? ((pres / total) * 100).toFixed(0) : 0;
        document.getElementById('asis_stats_panel').innerHTML = `<div class="bg-zinc-800 p-3 text-center rounded"><p class="text-[8px] uppercase">PROMEDIO</p><h5 class="text-pro font-black text-xl">${prom}%</h5></div><div class="bg-zinc-800 p-3 text-center rounded"><p class="text-[8px] uppercase">PRESENTES</p><h5 class="text-nuke font-black text-xl">${pres}</h5></div><div class="bg-zinc-800 p-3 text-center rounded"><p class="text-[8px] uppercase">FALTAS</p><h5 class="text-red-500 font-black text-xl">${total-pres}</h5></div>`;
    }

    function renderSupervision() {
        const c = document.getElementById('supervision_cards'); c.innerHTML = '';
        const auh = DATA.mat.filter(x => x.alu_auh === 'SI').length;
        const par = DATA.mat.filter(x => x.alu_nac && x.alu_nac.includes('PAR')).length;
        const her = DATA.mat.filter(x => parseInt(x.alu_her) > 0).length;
        [{t:'MATRÍCULA INSTITUCIONAL', v:DATA.mat.length, cl:'nuke'}, {t:'BENEFICIARIOS AUH', v:auh, cl:'pro'}, {t:'NACIONALIDAD PY', v:par, cl:'orange-500'}, {t:'HERMANOS JARDÍN', v:her, cl:'white'}].forEach(k => {
            c.innerHTML += `<div class="bg-zinc-900 p-6 rounded-lg border-t-2 border-${k.cl} shadow-xl"><p class="orbitron text-[8px] opacity-60 uppercase italic font-black">${k.t}</p><h4 class="text-4xl font-black text-${k.cl} mt-2 font-black">${k.v}</h4></div>`;
        });
    }

    function updateChart() {
        const ctx = document.getElementById('chart_sala').getContext('2d');
        if(mainChart) mainChart.destroy();
        mainChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: SALAS_INST.map(s => s.seccion), datasets: [{ label: 'ALUMNOS POR SALA', data: SALAS_INST.map(s => DATA.mat.filter(x => x.alu_sala === s.id).length), backgroundColor: '#dfff00' }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#222' } } } }
        });
    }

    function editAlu(dni) {
        const alu = DATA.mat.find(x => x.alu_dni === dni) || DATA.esp.find(x => x.alu_dni === dni);
        if(alu) { Object.keys(alu).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = alu[k]; }); show(1); calcEdad(); window.scrollTo({top:0, behavior:'smooth'}); }
    }

    function calcEdad() {
        const f = document.getElementById('alu_f_nac').value;
        if(f) {
            const fecha = new Date(f); const ref = new Date('2026-06-30');
            let e = ref.getFullYear() - fecha.getFullYear();
            if (ref < new Date(ref.getFullYear(), fecha.getMonth(), fecha.getDate())) e--;
            document.getElementById('label_edad').innerText = `| EDAD AL 30/6: ${e} AÑOS`;
            return e;
        }
    }

    function renderEspera() {
        const tb = document.getElementById('espera_table'); tb.innerHTML = '';
        DATA.esp.forEach((e, i) => {
            tb.innerHTML += `<tr class="border-b border-zinc-800 text-white uppercase font-black italic"><td class="p-2">${e.alu_nombre}</td><td class="p-2">${e.alu_dni} | ${e.edad_ref || 'S/D'} AÑOS</td><td class="p-2">${e.alu_sala}</td><td class="p-2"><button onclick="DATA.mat.push(DATA.esp[i]);DATA.esp.splice(i,1);sync();" class="bg-pro text-black px-3 py-1 font-black rounded text-[8px]">ADMITIR</button></td></tr>`;
        });
    }

    function renderMesesBajas() {
        const grid = document.getElementById('bajas_meses_grid'); grid.innerHTML = '';
        MESES.forEach(m => {
            const count = DATA.bajas.filter(x => x.mes_baja === m).length;
            grid.innerHTML += `<button onclick="verDetalleBaja('${m}')" class="bg-zinc-900 border border-red-900 p-2 rounded text-center"><p class="text-[7px] orbitron font-black text-zinc-500 uppercase italic">${m}</p><h4 class="text-xl font-black text-red-500">${count}</h4></button>`;
        });
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); }
    function saveData() { alert("CONSOLIDADO."); sync(); }
    function smartRadar() { const val = document.getElementById('radar_global').value.toUpperCase(); if(val.length < 3) return; const res = DATA.mat.find(x => x.alu_dni.includes(val) || x.alu_nombre.includes(val)); if(res) editAlu(res.alu_dni); }
</script>
</body>
</html>
