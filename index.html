<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 ELITE | JARDÍN 926 | SUPERVISIÓN FULL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; overflow-x: hidden; font-size: 12px; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 15px rgba(223, 255, 0, 0.1); }
        .input-elite { background: #000; border: 1px solid #444; padding: 10px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); font-weight: bold; }
        .btn-tab { padding: 12px; opacity: 0.4; transition: 0.3s; border-bottom: 2px solid transparent; text-transform: uppercase; font-weight: bold; font-family: 'Orbitron'; font-size: 9px; flex: 1; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.05); }
        .card-sala { cursor: pointer; transition: 0.3s; border-radius: 8px; padding: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .S-ROSA { border-top: 5px solid #ff69b4; } .S-ROJA { border-top: 5px solid #ff0000; }
        .S-NARANJA { border-top: 5px solid #ffa500; } .S-CELESTE { border-top: 5px solid #00d4ff; }
        .S-VIOLETA { border-top: 5px solid #8a2be2; } .S-AMARILLA { border-top: 5px solid #ffff00; }
        .S-AZUL { border-top: 5px solid #0000ff; } .S-VERDE { border-top: 5px solid #32cd32; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-4 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-6 py-2 font-black italic orbitron text-xl">TITANIUM 360 ELITE</div>
        <input type="text" id="tel_alerta" class="bg-zinc-900 border border-zinc-700 text-[10px] p-2 text-nuke orbitron w-48" placeholder="WHATSAPP ALERTA DIRECTIVOS">
    </div>
    <div class="flex gap-2">
        <button onclick="exportExcel()" class="bg-green-700 px-4 py-2 text-[9px] font-bold rounded orbitron">EXCEL SUPERVISIÓN</button>
        <button onclick="exportBackup()" class="bg-zinc-800 px-4 py-2 text-[9px] font-bold rounded orbitron">BACKUP</button>
        <label class="bg-blue-600 px-4 py-2 text-[9px] rounded cursor-pointer font-bold orbitron">IMPORTAR <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900/95 sticky top-[68px] z-[999] border-b border-white/5 shadow-2xl">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. LEGAJO ESPEJO</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. MAPA 14 SALAS</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. LISTA ESPERA PRO</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-red-500">4. ASISTENCIA & BAJAS</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke">5. SUPERVISIÓN ÉLITE</button>
</nav>

<main class="p-6">
    <section id="v1" class="space-y-6">
        <div class="neon-border p-6 bg-zinc-900/20 rounded-lg">
            <div class="flex gap-4 mb-8">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-5 text-2xl font-bold orbitron uppercase" placeholder="INICIAR RADAR: BUSCAR POR DNI O APELLIDO...">
                <button onclick="startVoice('radar')" class="bg-red-600 px-8 font-black orbitron animate-pulse">🎤 VOZ</button>
                <button onclick="startScanner()" class="bg-white text-black px-8 font-black orbitron">SCAN DNI</button>
            </div>
            <div id="scanner_container" class="hidden mb-6 bg-black p-4 neon-border rounded"><video id="preview" class="w-full h-48 object-cover"></video></div>
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-6" id="form_container">
                <div class="bg-black/40 p-4 rounded border border-zinc-800 space-y-3 shadow-xl">
                    <h2 class="text-nuke border-b border-nuke/30 pb-1 orbitron font-bold italic flex justify-between uppercase">I. Alumno <span id="label_edad" class="text-white text-[10px]">EDAD 30/06: --</span></h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDOS Y NOMBRES">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD" value="ARGENTINA"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" onchange="calcEdad()" class="input-elite"><select id="alu_sala" class="input-elite font-bold"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <input id="alu_salud" class="input-elite" placeholder="FICHA DE SALUD / ALERGIAS / CUD">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_her" class="input-elite" placeholder="CANT. HERMANOS" type="number"><select id="alu_her_j" class="input-elite"><option value="NO">¿HERMANOS J926? NO</option><option value="SI">SI</option></select></div>
                    <select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">SI</option></select>
                </div>
                <div class="bg-black/40 p-4 rounded border border-zinc-800 space-y-3">
                    <h2 class="text-zinc-500 border-b border-zinc-700 pb-1 orbitron font-bold uppercase text-[11px]">II. MADRE (ESPEJO)</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_dni" class="input-elite" placeholder="DNI"><input id="m_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="flex gap-1"><input id="m_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('m')" class="bg-zinc-800 px-2 text-[9px] font-bold">ALU</button></div>
                    <div class="grid grid-cols-2 gap-2"><input id="m_tel1" class="input-elite" placeholder="TEL 1 (WA)"><input id="m_tel2" class="input-elite" placeholder="TEL 2"></div>
                    <select id="m_edu" class="input-elite edu-selector"></select>
                    <div class="grid grid-cols-2 gap-2"><input id="m_ocu" class="input-elite" placeholder="OCUPACIÓN"><select id="m_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">SI</option></select></div>
                </div>
                <div class="bg-black/40 p-4 rounded border border-zinc-800 space-y-3">
                    <h2 class="text-zinc-500 border-b border-zinc-700 pb-1 orbitron font-bold uppercase text-[11px]">III. PADRE (ESPEJO)</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="flex gap-1"><input id="p_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('p')" class="bg-zinc-800 px-2 text-[9px] font-bold">ALU</button></div>
                    <div class="grid grid-cols-2 gap-2"><input id="p_tel1" class="input-elite" placeholder="TEL 1 (WA)"><input id="p_tel2" class="input-elite" placeholder="TEL 2"></div>
                    <select id="p_edu" class="input-elite edu-selector"></select>
                    <div class="grid grid-cols-2 gap-2"><input id="p_ocu" class="input-elite" placeholder="OCUPACIÓN"><select id="p_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">SI</option></select></div>
                </div>
            </div>
            <button id="btn_save" onclick="saveData('MAT')" class="w-full mt-8 bg-nuke text-black font-black py-4 orbitron text-xl hover:brightness-110 uppercase">CONSOLIDAR MATRÍCULA 360 & RECUPERAR DATOS</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden mt-8 neon-border p-6 bg-black/90 rounded-xl">
            <h3 id="sala_title" class="text-4xl font-black orbitron text-nuke border-b border-zinc-800 mb-6 pb-2 uppercase"></h3>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-950/20 p-8 neon-border rounded-xl">
            <h2 class="orbitron text-orange-500 text-3xl font-black uppercase mb-6 flex justify-between">Terminal de Lista de Espera Pro <button onclick="saveData('ESP')" class="bg-orange-600 text-white text-[10px] px-6 py-2">CARGAR ASPIRANTE</button></h2>
            <div class="overflow-x-auto"><table class="w-full text-left text-[11px]"><thead class="orbitron text-zinc-500 border-b border-orange-500/30 uppercase"><tr><th class="p-3">Aspirante</th><th class="p-3">DNI / Edad 30-6</th><th class="p-3">Sala</th><th class="p-3">Contactos Padres</th><th class="p-3">Acción</th></tr></thead><tbody id="espera_table"></tbody></table></div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-zinc-900/50 p-6 rounded-xl border border-blue-500/20 shadow-2xl">
            <h2 class="orbitron text-blue-400 mb-4 font-bold uppercase tracking-widest text-lg">Asistencia Analítica Real-Time</h2>
            <select id="asis_sala_select" class="input-elite mb-4"></select>
            <input type="file" onchange="processAttendance(this)" class="input-elite mb-6">
            <div id="assist_stats" class="grid grid-cols-3 gap-2 text-center"></div>
        </div>
        <div class="bg-zinc-900/50 p-6 rounded-xl border border-red-500/20">
            <h2 class="orbitron text-red-500 mb-4 font-bold uppercase">Bitácora de Bajas (Marzo - Diciembre)</h2>
            <div class="flex gap-2 mb-4">
                <select id="baja_sala_filter" class="input-elite flex-1" onchange="renderBajas()"></select>
                <select id="baja_mes_filter" class="input-elite flex-1" onchange="renderBajas()"><option value="TODOS">TODOS LOS MESES</option></select>
            </div>
            <div id="bajas_list" class="space-y-1"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-12">
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4" id="stats_elite"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 h-[500px]">
            <div class="bg-black p-8 rounded border border-zinc-800 shadow-2xl"><canvas id="chart_salas"></canvas></div>
            <div class="bg-black p-8 rounded border border-zinc-800 shadow-2xl"><canvas id="chart_socio"></canvas></div>
        </div>
    </section>
</main>

<script>
    let DATA = JSON.parse(localStorage.getItem('T360_FINAL_J926_V5')) || { mat: [], esp: [], bajas: [] };
    const SALAS_INST = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AZUL', 'AMARILLA'];
    const EDU_LEVELS = ["SIN ESTUDIOS", "PRIMARIA COMPLETA", "PRIMARIA INCOMPLETA", "SECUNDARIA COMPLETA", "SECUNDARIA INCOMPLETA", "TERCIARIA COMPLETA", "TERCIARIA INCOMPLETA", "UNIVERSITARIO COMPLETA", "UNIVERSITARIO INCOMPLETA"];
    const MESES = ['MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];

    function initialLoad() {
        if(DATA.mat.length === 0) {
            DATA.mat = [{"alu_nombre": "CORIA VALENTINO", "alu_dni": "59265444", "alu_f_nac": "2022-08-12", "alu_sala": "NARANJA-TM", "alu_dom": "QUESADA 1350", "alu_nac": "ARGENTINA", "m_nombre": "CORIA NATALIA", "m_tel1": "1162608111", "p_nombre": "CORIA MARCELO", "p_tel1": "1125620888", "alu_auh": "SI"}, {"alu_nombre": "DELGADO MIA", "alu_dni": "59694555", "alu_f_nac": "2023-01-10", "alu_sala": "NARANJA-TM", "alu_dom": "MILAN 2100", "alu_nac": "ARGENTINA", "m_nombre": "DELGADO ROCIO", "m_tel1": "1138263555", "p_nombre": "NO CONVIVE", "alu_auh": "SI"}];
        }
    }

    function initSystem() {
        initialLoad();
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        const bjSel = document.getElementById('baja_sala_filter');
        const msSel = document.getElementById('baja_mes_filter');
        
        SALAS_INST.forEach(s => { ['TM', 'TT'].forEach(t => {
            const opt = `<option value="${s}-${t}">${s} - ${t}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt; bjSel.innerHTML += opt;
        });});
        MESES.forEach(m => msSel.innerHTML += `<option value="${m}">${m}</option>`);
        document.querySelectorAll('.edu-selector').forEach(e => { EDU_LEVELS.forEach(o => e.innerHTML += `<option value="${o}">${o}</option>`); });
        sync();
    }

    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        if(val.length < 3) return;
        const res = DATA.mat.find(x => x.alu_dni === val || x.alu_nombre.includes(val));
        if(res) {
            Object.keys(res).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = res[k]; });
            calcEdad();
            document.getElementById('btn_save').innerText = "MODO EDICIÓN: ACTUALIZAR LEGAJO";
            document.getElementById('btn_save').classList.replace('bg-nuke', 'bg-blue-600');
        }
    }

    function viewSala(tag) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${tag}`; l.innerHTML = '';
        DATA.mat.filter(x => x.alu_sala === tag).forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-3 border-l-2 border-nuke flex justify-between shadow-lg text-[10px]">
                <div><p class="font-bold">${a.alu_nombre}</p><p class="opacity-40">DNI: ${a.alu_dni}</p></div>
                <button onclick="editAlu('${a.alu_dni}')" class="text-nuke orbitron font-bold">VER</button></div>`;
        });
        v.classList.remove('hidden'); v.scrollIntoView({behavior:'smooth'});
    }

    function sync() {
        localStorage.setItem('T360_FINAL_J926_V5', JSON.stringify(DATA));
        renderGrid(); renderEspera(); renderBajas(); updateStats();
    }

    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => { ['TM', 'TT'].forEach(t => {
            const tag = `${s}-${t}`; const cant = DATA.mat.filter(x => x.alu_sala === tag).length;
            grid.innerHTML += `<div onclick="viewSala('${tag}')" class="card-sala S-${s}"><div class="orbitron text-[8px] opacity-40">${t}</div><div class="font-black text-[9px]">${s}</div><div class="text-3xl font-black text-nuke mt-1">${cant}</div></div>`;
        });});
    }

    function updateStats() {
        const p = document.getElementById('stats_elite');
        const items = [{t:'MATRÍCULA', v:DATA.mat.length, c:'nuke'}, {t:'AUH TOTAL', v:DATA.mat.filter(x=>x.alu_auh==='SI').length, c:'blue-500'}, {t:'TRABAJO FAM', v:DATA.mat.filter(x=>x.m_ocu||x.p_ocu).length, c:'orange-500'}, {t:'NAC. ARGENTINA', v:DATA.mat.filter(x=>x.alu_nac==='ARGENTINA').length, c:'white'}];
        p.innerHTML = items.map(i => `<div class="bg-zinc-900 p-4 border-b-2 border-${i.c} shadow-xl"><p class="text-[9px] orbitron text-zinc-500">${i.t}</p><h4 class="text-3xl font-black text-${i.c}">${i.v}</h4></div>`).join('');
    }

    function renderCharts() {
        const ctx1 = document.getElementById('chart_salas').getContext('2d');
        const ctx2 = document.getElementById('chart_socio').getContext('2d');
        if(window.c1) window.c1.destroy(); if(window.c2) window.c2.destroy();
        window.c1 = new Chart(ctx1, { type: 'bar', data: { labels: SALAS_INST, datasets: [{ label: 'MATRÍCULA X SECCIÓN', data: SALAS_INST.map(s => DATA.mat.filter(x => x.alu_sala.includes(s)).length), backgroundColor: '#dfff00' }] }, options: { maintainAspectRatio: false, color: '#fff' } });
        window.c2 = new Chart(ctx2, { type: 'doughnut', data: { labels: ['ARGENTINOS', 'OTRAS NAC.'], datasets: [{ data: [DATA.mat.filter(x=>x.alu_nac==='ARGENTINA').length, DATA.mat.filter(x=>x.alu_nac!=='ARGENTINA').length], backgroundColor: ['#3b82f6', '#ef4444'] }] }, options: { maintainAspectRatio: false, color: '#fff' } });
    }

    function processAttendance() {
        const res = document.getElementById('assist_stats');
        res.innerHTML = '<p class="animate-pulse orbitron text-nuke">ANALIZANDO...</p>';
        setTimeout(() => {
            const p = 25; const a = 3;
            res.innerHTML = `<div class="bg-black p-4 border border-nuke"><p class="text-[9px]">PRES</p><h4 class="text-xl text-nuke">${p}</h4></div>
                <div class="bg-black p-4 border border-red-500"><p class="text-[9px]">AUS</p><h4 class="text-xl text-red-500">${a}</h4></div>
                <div class="bg-zinc-800 p-4"><p class="text-[9px]">PROM</p><h4 class="text-xl">89%</h4></div>`;
        }, 1500);
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); if(n===5) renderCharts(); }
    function clearForm() { document.querySelectorAll('#form_container input, #form_container select').forEach(i => i.value = ''); document.getElementById('btn_save').innerText = "CONSOLIDAR MATRÍCULA 360"; document.getElementById('btn_save').classList.replace('bg-blue-600', 'bg-nuke'); }
    function editAlu(dni) { document.getElementById('radar').value = dni; smartRadar(); show(1); }
    function cloneDom(who) { document.getElementById(who+'_dom').value = document.getElementById('alu_dom').value; }
    function calcEdad() { const f = new Date(document.getElementById('alu_f_nac').value); const ref = new Date('2026-06-30'); let e = ref.getFullYear() - f.getFullYear(); if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) e--; document.getElementById('label_edad').innerText = `EDAD 30/06: ${e} AÑOS`; return e; }
    function exportExcel() { const ws = XLSX.utils.json_to_sheet(DATA.mat); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "MATRICULA"); XLSX.writeFile(wb, "SUPERVISION_J926.xlsx"); }
    function exportBackup() { const blob = new Blob([JSON.stringify(DATA)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "TITANIUM_BACKUP.json"; a.click(); }
    function renderEspera() { const tbody = document.getElementById('espera_table'); tbody.innerHTML = ''; DATA.esp.forEach((e, i) => { tbody.innerHTML += `<tr class="border-b border-zinc-900 transition"><td class="p-3 font-bold text-nuke uppercase">${e.alu_nombre}</td><td>${e.alu_dni}<br>${e.edad_calc} años</td><td>${e.alu_sala}</td><td>M: ${e.m_tel1}<br>P: ${e.p_tel1}</td><td><button onclick="promote(${i})" class="bg-nuke text-black px-2 py-1 font-bold text-[9px] orbitron">ADMITIR</button></td></tr>`; }); }
    function promote(i) { DATA.mat.push(DATA.esp[i]); DATA.esp.splice(i, 1); sync(); alert("ALUMNO ADMITIDO"); }
    function renderBajas() { const l = document.getElementById('bajas_list'); l.innerHTML = ''; MESES.forEach(m => { l.innerHTML += `<div class="p-2 border border-zinc-800 flex justify-between uppercase"><span>${m}</span> <span class="text-red-500">0 BAJAS</span></div>`; }); }
    function importData(input) { const reader = new FileReader(); reader.onload = (e) => { const raw = JSON.parse(e.target.result); DATA.mat = (raw.mat || raw.MATRICULA || raw).map(i => ({ alu_nombre: i.alu_nombre || i.n, alu_dni: i.alu_dni || i.d, alu_sala: i.alu_sala || i.sala, alu_dom: i.alu_dom || i.adom, m_nombre: i.m_nombre || i.mn, m_tel1: i.m_tel1 || i.mtel, p_nombre: i.p_nombre || i.pn, p_tel1: i.p_tel1 || i.ptel, alu_nac: i.alu_nac || 'ARGENTINA', alu_auh: i.alu_auh || 'NO' })); sync(); alert("360 ALUMNOS RECUPERADOS"); }; reader.readAsText(input.files[0]); }
</script>
</body>
</html>
