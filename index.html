<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 TOTAL | JARDÍN 926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Segoe UI', Roboto, sans-serif; font-size: 12px; }
        .orbitron { font-family: 'Orbitron', sans-serif; font-weight: 900; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.4); box-shadow: 0 0 15px rgba(223, 255, 0, 0.1); }
        .input-360 { background: #000; border: 1px solid #444; padding: 12px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 4px solid var(--nuke); font-weight: bold; }
        .btn-nav { padding: 15px; opacity: 0.5; transition: 0.3s; border-bottom: 3px solid transparent; flex: 1; text-transform: uppercase; font-weight: 900; }
        .active-nav { opacity: 1; border-bottom: 4px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.05); }
        .sala-card { cursor: pointer; transition: 0.3s; background: #111; padding: 15px; border-radius: 8px; border: 1px solid #333; text-align: center; }
        .sala-card:hover { border-color: var(--nuke); transform: translateY(-3px); }
    </style>
</head>
<body onload="initApp()">

<header class="p-4 bg-black border-b-2 border-nuke flex justify-between items-center sticky top-0 z-[1000]">
    <div>
        <h1 class="orbitron text-nuke text-2xl italic shadow-nuke">TITANIUM 360 TOTAL</h1>
        <p class="text-[9px] uppercase font-bold text-zinc-500">Arquitectura de Procesos | Jardín 926</p>
    </div>
    <div class="flex gap-2">
        <button onclick="exportJSON()" class="bg-zinc-800 px-4 py-2 rounded font-bold text-[10px]">BACKUP TOTAL</button>
        <label class="bg-nuke text-black px-4 py-2 rounded font-bold text-[10px] cursor-pointer">IMPORTAR <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex bg-zinc-900 sticky top-[72px] z-[999] border-b border-white/10">
    <button onclick="tab(1)" id="t1" class="btn-nav active-nav">Legajo 360</button>
    <button onclick="tab(2)" id="t2" class="btn-nav">Foto Interactiva</button>
    <button onclick="tab(3)" id="t3" class="btn-nav">Lista de Espera</button>
    <button onclick="tab(4)" id="t4" class="btn-nav">Asistencia & Bajas</button>
    <button onclick="tab(5)" id="t5" class="btn-nav">Supervisión Elite</button>
</nav>

<main class="p-6">
    <section id="v1" class="space-y-6">
        <div class="flex gap-4">
            <input type="text" id="radar" onkeyup="searchRadar()" class="flex-1 bg-black border-2 border-nuke p-4 text-xl font-bold text-nuke" placeholder="RADAR: DNI O APELLIDO DEL ALUMNO...">
            <button class="bg-red-600 px-6 font-bold">CARGA BIÓNICA</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="master_form">
            <div class="bg-zinc-900/50 p-5 rounded-lg border border-zinc-700">
                <h3 class="text-nuke font-bold mb-4 uppercase border-b border-nuke/30 pb-2">I. Datos del Alumno</h3>
                <input id="alu_nombre" class="input-360 mb-2" placeholder="APELLIDO Y NOMBRE">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input id="alu_dni" class="input-360" placeholder="DNI">
                    <input id="alu_nac" class="input-360" placeholder="NACIONALIDAD" value="ARGENTINA">
                </div>
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="date" id="alu_f_nac" onchange="calcAge()" class="input-360">
                    <select id="alu_sala" class="input-360"></select>
                </div>
                <input id="alu_dom" class="input-360 mb-2" placeholder="DOMICILIO">
                <textarea id="alu_salud" class="input-360 h-20" placeholder="SALUD / CUD / ALERGIAS"></textarea>
            </div>
            <div class="bg-zinc-900/50 p-5 rounded-lg border border-zinc-700">
                <h3 class="text-zinc-400 font-bold mb-4 uppercase border-b border-zinc-700 pb-2">II. Responsable A</h3>
                <input id="resp_a_nom" class="input-360 mb-2" placeholder="NOMBRE COMPLETO">
                <input id="resp_a_dni" class="input-360 mb-2" placeholder="DNI">
                <input id="resp_a_tel" class="input-360 mb-2" placeholder="TELÉFONO / WHATSAPP">
                <select id="resp_a_edu" class="input-360 mb-2"></select>
                <input id="resp_a_ocu" class="input-360" placeholder="OCUPACIÓN">
            </div>
            <div class="bg-zinc-900/50 p-5 rounded-lg border border-zinc-700">
                <h3 class="text-zinc-400 font-bold mb-4 uppercase border-b border-zinc-700 pb-2">III. Responsable B</h3>
                <input id="resp_b_nom" class="input-360 mb-2" placeholder="NOMBRE COMPLETO">
                <input id="resp_b_dni" class="input-360 mb-2" placeholder="DNI">
                <input id="resp_b_tel" class="input-360 mb-2" placeholder="TELÉFONO / WHATSAPP">
                <select id="resp_b_edu" class="input-360 mb-2"></select>
                <input id="resp_b_ocu" class="input-360" placeholder="OCUPACIÓN">
            </div>
        </div>
        <button onclick="saveStudent('mat')" class="w-full bg-nuke text-black font-black py-4 text-xl shadow-lg">CONSOLIDAR MATRÍCULA 360</button>
    </section>

    <section id="v2" class="hidden">
        <div id="grid_salas" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-4 mb-8"></div>
        <div id="detalle_sala" class="hidden bg-zinc-900 p-6 rounded-xl border-t-4 border-nuke">
            <h2 id="sala_title" class="text-2xl font-bold text-nuke mb-4"></h2>
            <div id="lista_alumnos_sala" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-900/10 p-6 rounded-lg border border-orange-500/30">
            <h2 class="text-orange-500 font-bold text-2xl mb-6">LISTA DE ESPERA ESTRATÉGICA</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-zinc-500 border-b border-zinc-800 uppercase text-[10px]">
                        <tr><th class="p-3">Alumno</th><th>DNI</th><th>Edad al 30/6</th><th>Sala</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="espera_body"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-black p-6 rounded border border-blue-500/20">
            <h2 class="text-blue-400 font-bold mb-4 uppercase">Control de Asistencia</h2>
            <select id="asis_sel" onchange="renderAsis()" class="input-360 mb-4"></select>
            <div id="asis_list" class="space-y-2"></div>
        </div>
        <div class="bg-black p-6 rounded border border-red-500/20">
            <h2 class="text-red-500 font-bold mb-4 uppercase">Bitácora de Bajas</h2>
            <div id="bajas_list" class="space-y-2"></div>
        </div>
    </section>

    <section id="v5" class="hidden">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10" id="metricas_cards"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-zinc-900 p-6 rounded"><canvas id="chart_salas"></canvas></div>
            <div class="bg-zinc-900 p-6 rounded"><canvas id="chart_asis"></canvas></div>
        </div>
    </section>
</main>

<script>
    let DB = JSON.parse(localStorage.getItem('T360_MASTER')) || { mat: [], esp: [], bajas: [] };
    const SALAS = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AZUL', 'AMARILLA', 'VERDE'];
    const TURNOS = ['TM', 'TT'];
    const ESTUDIOS = ['SECUNDARIO INC.', 'SECUNDARIO COMP.', 'TERCIARIO', 'UNIVERSITARIO'];

    function initApp() {
        const s = document.getElementById('alu_sala');
        const as = document.getElementById('asis_sel');
        SALAS.forEach(sala => TURNOS.forEach(turno => {
            let opt = `<option value="${sala} ${turno}">${sala} ${turno}</option>`;
            s.innerHTML += opt; as.innerHTML += opt;
        }));
        document.querySelectorAll('#resp_a_edu, #resp_b_edu').forEach(sel => {
            ESTUDIOS.forEach(e => sel.innerHTML += `<option value="${e}">${e}</option>`);
        });
        sync();
    }

    function sync() {
        localStorage.setItem('T360_MASTER', JSON.stringify(DB));
        renderGrid();
        renderEspera();
        updateMetricas();
    }

    function tab(n) {
        document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
        document.getElementById('v'+n).classList.remove('hidden');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
        document.getElementById('t'+n).classList.add('active-nav');
        if(n === 5) setTimeout(drawCharts, 300);
    }

    function saveStudent(target) {
        const alu = {};
        document.querySelectorAll('#master_form input, #master_form select, #master_form textarea').forEach(i => alu[i.id] = i.value.toUpperCase());
        if(!alu.alu_dni) return alert("DNI OBLIGATORIO");
        
        if(target === 'mat') {
            const idx = DB.mat.findIndex(x => x.alu_dni === alu.alu_dni);
            if(idx > -1) DB.mat[idx] = alu; else DB.mat.push(alu);
        }
        sync();
        alert("DATOS CONSOLIDADOS");
    }

    function renderGrid() {
        const g = document.getElementById('grid_salas'); g.innerHTML = '';
        SALAS.forEach(s => TURNOS.forEach(t => {
            const tag = `${s} ${t}`;
            const cant = DB.mat.filter(x => x.alu_sala === tag).length;
            g.innerHTML += `<div onclick="verSala('${tag}')" class="sala-card border-t-4" style="border-color:${s === 'ROSA'?'#ff69b4':s.toLowerCase()}">
                <p class="text-[9px] font-bold opacity-50">${t}</p>
                <p class="font-black">${s}</p>
                <p class="text-2xl text-nuke">${cant}</p>
            </div>`;
        }));
    }

    function renderEspera() {
        const b = document.getElementById('espera_body'); b.innerHTML = '';
        DB.esp.forEach((e, i) => {
            b.innerHTML += `<tr class="border-b border-zinc-800">
                <td class="p-3 font-bold">${e.alu_nombre}</td>
                <td>${e.alu_dni}</td>
                <td>${e.edad_ref || '---'}</td>
                <td>${e.alu_sala}</td>
                <td><button onclick="admitir(${i})" class="bg-blue-600 text-[9px] px-2 py-1 rounded">ADMITIR</button></td>
            </tr>`;
        });
    }

    function searchRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        if(val.length < 3) return;
        const alu = DB.mat.find(x => x.alu_dni.includes(val) || x.alu_nombre.includes(val));
        if(alu) {
            Object.keys(alu).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = alu[k]; });
        }
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            DB = JSON.parse(e.target.result);
            sync();
            alert("SISTEMA SINCRONIZADO TOTALMENTE");
        };
        reader.readAsText(input.files[0]);
    }
    
    function exportJSON() {
        const blob = new Blob([JSON.stringify(DB)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `TITANIUM_BACKUP_J926.json`;
        a.click();
    }

    function calcAge() {
        const f = new Date(document.getElementById('alu_f_nac').value);
        const ref = new Date('2026-06-30');
        let edad = ref.getFullYear() - f.getFullYear();
        if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) edad--;
        return edad;
    }
</script>
</body>
</html>
