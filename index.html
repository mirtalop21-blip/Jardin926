<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 ELITE | JARDÍN 926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; --pro: #00d4ff; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; font-size: 11px; overflow-x: hidden; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.4); box-shadow: 0 0 15px rgba(223, 255, 0, 0.1); }
        .input-elite { background: #000; border: 1px solid #333; padding: 10px; color: var(--nuke); width: 100%; border-radius: 6px; border-left: 4px solid var(--nuke); font-weight: 900; text-transform: uppercase; margin-bottom: 4px; outline: none; }
        .btn-tab { padding: 14px; opacity: 0.4; transition: 0.3s; border-bottom: 3px solid transparent; font-family: 'Orbitron'; font-size: 8px; flex: 1; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .active-tab { opacity: 1; border-bottom: 4px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.08); }
        
        /* TARJETAS INTERACTIVAS POR COLOR */
        .card-sala { cursor: pointer; border-radius: 12px; padding: 15px; text-align: center; background: #111; transition: 0.3s; border: 1px solid rgba(255,255,255,0.05); }
        .card-sala:hover { transform: scale(1.05); background: #1a1a1a; }
        .S-ROSA { border-top: 8px solid #ff69b4; box-shadow: 0 4px 15px rgba(255,105,180,0.2); }
        .S-ROJA { border-top: 8px solid #ff0000; box-shadow: 0 4px 15px rgba(255,0,0,0.2); }
        .S-NARANJA { border-top: 8px solid #ffa500; box-shadow: 0 4px 15px rgba(255,165,0,0.2); }
        .S-CELESTE { border-top: 8px solid #00d4ff; box-shadow: 0 4px 15px rgba(0,212,255,0.2); }
        .S-VIOLETA { border-top: 8px solid #8a2be2; box-shadow: 0 4px 15px rgba(138,43,226,0.2); }
        .S-AMARILLA { border-top: 8px solid #ffff00; box-shadow: 0 4px 15px rgba(255,255,0,0.2); }
        .S-AZUL { border-top: 8px solid #0000ff; box-shadow: 0 4px 15px rgba(0,0,255,0.2); }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 bg-black border-b-2 border-nuke flex justify-between items-center sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-4 py-1 font-black orbitron italic text-xl">TITANIUM 360</div>
        <input type="text" id="radar_global" onkeyup="smartRadar()" class="bg-zinc-900 border border-nuke/30 p-2 rounded text-[10px] orbitron text-nuke w-64 outline-none" placeholder="🔍 RADAR: ESCRIBE DNI O NOMBRE...">
    </div>
    <div class="flex gap-2">
        <div class="bg-zinc-800 px-3 py-1 rounded border border-zinc-700 text-[9px] font-black orbitron uppercase">Matrícula: <span id="header_total" class="text-nuke">0</span></div>
        <label class="bg-blue-600 px-4 py-1 text-[8px] rounded cursor-pointer font-black orbitron text-white uppercase shadow-lg">MIGRAR ARCHIVO <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900 sticky top-[58px] z-[999] border-b border-white/10 no-scrollbar shadow-2xl">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. Legajo & Voz</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. Foto Interactiva</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. Espera PRO</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-pro">4. Asistencia</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke font-black">5. Supervisión Élite</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-6 bg-zinc-900/30 rounded-lg shadow-2xl">
            <button onclick="startVoice()" class="w-full mb-6 bg-red-600 py-3 font-black orbitron text-white shadow-lg flex justify-center items-center gap-2">🎤 CARGA BIÓNICA ACTIVADA</button>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="form_master">
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-nuke border-b-2 border-nuke/40 orbitron font-black text-[10px] mb-4 italic">I. DATOS DEL ALUMNO</h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                    <input id="alu_dni" class="input-elite" placeholder="DNI">
                    <select id="alu_sala" class="input-elite"></select>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO">
                    <textarea id="alu_salud" class="input-elite h-16" placeholder="ALERGIAS / CUD / SALUD"></textarea>
                </div>
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-zinc-400 border-b-2 border-zinc-700 orbitron font-black text-[10px] uppercase mb-4 italic">II. MADRE</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <input id="m_tel" class="input-elite" placeholder="WHATSAPP">
                    <input id="m_ocu" class="input-elite" placeholder="OCUPACIÓN">
                </div>
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-zinc-400 border-b-2 border-zinc-700 orbitron font-black text-[10px] uppercase mb-4 italic">III. PADRE</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <input id="p_tel" class="input-elite" placeholder="WHATSAPP">
                </div>
            </div>
            <button onclick="saveData()" class="w-full mt-4 bg-nuke text-black font-black py-5 orbitron text-xl uppercase shadow-lg">CONSOLIDAR Y GUARDAR EN NUBE LOCAL</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-8" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-10 bg-black/95 rounded-2xl shadow-2xl border-t-4 border-nuke">
            <div class="flex justify-between items-center border-b-2 border-nuke pb-4 mb-8">
                <h3 id="sala_title" class="text-4xl font-black orbitron text-nuke uppercase italic"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-6 py-2 orbitron font-black text-xs rounded text-white uppercase">CERRAR X</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-950/20 p-8 neon-border rounded-xl border-l-8 border-orange-600">
            <h2 class="orbitron text-orange-500 text-2xl font-black mb-6 uppercase italic">LISTA DE ESPERA ESTRATÉGICA</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="espera_render"></div>
        </div>
    </section>

    <section id="v4" class="hidden">
        <div class="bg-blue-950/20 p-8 neon-border rounded-xl border-l-8 border-pro">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <h2 class="orbitron text-pro text-2xl font-black uppercase italic">REGISTRO DE PRESENTISMO</h2>
                <select id="asis_sala_select" onchange="renderAsistencia()" class="input-elite !w-64 !mb-0"></select>
                <div class="bg-pro text-black px-6 py-2 font-black orbitron rounded shadow-xl">PROMEDIO: <span id="promedio_val">0</span>%</div>
            </div>
            <div id="asis_lista_render" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="supervision_cards"></div>
        <div class="bg-zinc-900 p-8 rounded-xl shadow-2xl border border-zinc-800 h-[400px]">
            <canvas id="chart_institucional"></canvas>
        </div>
    </section>
</main>

<script>
    let DATA = { mat: [], esp: [], bajas: [] };
    const SALAS_INST = [
        {id:'Rosa-TM', color:'ROSA', seccion:'1ºA'}, {id:'Rosa-TT', color:'ROSA', seccion:'1ºB'},
        {id:'Naranja-TM', color:'NARANJA', seccion:'ME A'}, {id:'Naranja-TT', color:'NARANJA', seccion:'ME B'},
        {id:'Roja-TM', color:'ROJA', seccion:'2ºA'}, {id:'Roja-TT', color:'ROJA', seccion:'2ºC'},
        {id:'Celeste-TM', color:'CELESTE', seccion:'2ºB'}, {id:'Celeste-TT', color:'CELESTE', seccion:'2ºD'},
        {id:'Violeta-TM', color:'VIOLETA', seccion:'3ºA'}, {id:'Violeta-TT', color:'VIOLETA', seccion:'3ºD'},
        {id:'Amarilla-TM', color:'AMARILLA', seccion:'3ºB'}, {id:'Amarilla-TT', color:'AMARILLA', seccion:'3ºE'},
        {id:'Azul-TM', color:'AZUL', seccion:'3ºC'}, {id:'Azul-TT', color:'AZUL', seccion:'3ºF'}
    ];
    let mainChart = null;

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        SALAS_INST.forEach(s => {
            const opt = `<option value="${s.id}">${s.seccion} - SALA ${s.color}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt;
        });
        const saved = localStorage.getItem('T360_ELITE_DATA');
        if(saved) { DATA = JSON.parse(saved); sync(); }
    }

    function sync() {
        localStorage.setItem('T360_ELITE_DATA', JSON.stringify(DATA));
        document.getElementById('header_total').innerText = DATA.mat.length;
        renderGrid(); renderSupervision(); renderEspera(); updateChart();
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const imported = JSON.parse(e.target.result);
                DATA.mat = imported.mat || [];
                DATA.esp = imported.esp || [];
                sync();
                alert("SISTEMA SINCRONIZADO: " + DATA.mat.length + " REGISTROS ACTIVADOS.");
            } catch(err) { alert("ERROR CRÍTICO: El archivo no tiene el formato TITANIUM."); }
        };
        reader.readAsText(input.files[0]);
    }

    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => {
            const num = DATA.mat.filter(x => x.alu_sala === s.id).length;
            grid.innerHTML += `<div onclick="viewSala('${s.id}', '${s.seccion}')" class="card-sala S-${s.color}">
                <p class="orbitron text-[8px] font-black opacity-60 mb-1 uppercase">${s.color}</p>
                <h4 class="text-4xl font-black text-nuke">${num}</h4>
                <p class="text-[10px] font-bold text-zinc-400 uppercase">${s.seccion}</p>
            </div>`;
        });
    }

    function viewSala(id, seccion) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${seccion}`; l.innerHTML = '';
        DATA.mat.filter(x => x.alu_sala === id).forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900/80 p-5 border-l-4 border-nuke shadow-2xl rounded-lg">
                <p class="font-black text-xs uppercase text-white mb-1">${a.alu_nombre}</p>
                <p class="text-zinc-500 font-bold text-[9px]">DNI: ${a.alu_dni}</p>
                <button onclick="editAlu('${a.alu_dni}')" class="mt-4 w-full bg-zinc-800 text-nuke font-black py-2 rounded text-[8px] border border-nuke/20 orbitron uppercase hover:bg-nuke hover:text-black transition">VER EXPEDIENTE</button>
            </div>`;
        });
        v.classList.remove('hidden'); v.scrollIntoView({behavior:'smooth'});
    }

    function renderAsistencia() {
        const id = document.getElementById('asis_sala_select').value;
        const list = DATA.mat.filter(x => x.alu_sala === id);
        const render = document.getElementById('asis_lista_render');
        render.innerHTML = list.map(a => `
            <div class="bg-black/60 p-3 flex justify-between items-center border border-zinc-800 rounded-lg shadow-lg">
                <span class="font-black text-[10px] text-zinc-300 uppercase">${a.alu_nombre}</span>
                <input type="checkbox" onchange="calcPromedio()" class="presente-check accent-pro w-6 h-6 rounded">
            </div>`).join('');
        calcPromedio();
    }

    function calcPromedio() {
        const total = document.querySelectorAll('.presente-check').length;
        const pres = document.querySelectorAll('.presente-check:checked').length;
        const prom = total > 0 ? ((pres / total) * 100).toFixed(0) : 0;
        document.getElementById('promedio_val').innerText = prom;
    }

    function renderEspera() {
        const container = document.getElementById('espera_render'); container.innerHTML = '';
        (DATA.esp || []).forEach(e => {
            container.innerHTML += `<div class="bg-zinc-900/50 p-4 border-l-4 border-orange-500 rounded-lg text-xs font-black uppercase text-zinc-300">${e.alu_nombre} | DNI: ${e.alu_dni}</div>`;
        });
    }

    function updateChart() {
        const ctx = document.getElementById('chart_institucional').getContext('2d');
        if(mainChart) mainChart.destroy();
        mainChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: SALAS_INST.map(s => s.seccion),
                datasets: [{ label: 'ALUMNOS ACTIVOS', data: SALAS_INST.map(s => DATA.mat.filter(x => x.alu_sala === s.id).length), backgroundColor: '#dfff00', borderColor: '#000', borderWidth: 1 }]
            },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#222' } } } }
        });
    }

    function renderSupervision() {
        const container = document.getElementById('supervision_cards'); container.innerHTML = '';
        SALAS_INST.forEach(s => {
            const list = DATA.mat.filter(x => x.alu_sala === s.id);
            container.innerHTML += `<div class="bg-zinc-900 p-4 border-t-4 border-nuke rounded-lg shadow-xl">
                <h4 class="orbitron text-nuke text-[9px] font-black">${s.seccion}</h4>
                <p class="text-3xl font-black mt-2">${list.length}</p>
                <p class="text-zinc-500 text-[8px] font-bold">OCUPACIÓN TOTAL</p>
            </div>`;
        });
    }

    function smartRadar() {
        const val = document.getElementById('radar_global').value.toUpperCase();
        if(val.length < 3) return;
        const res = DATA.mat.find(x => x.alu_dni.includes(val) || x.alu_nombre.includes(val));
        if(res) editAlu(res.alu_dni);
    }

    function editAlu(dni) {
        const alu = DATA.mat.find(x => x.alu_dni === dni);
        if(alu) {
            Object.keys(alu).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = alu[k]; });
            show(1); window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function saveData() {
        const alu = {}; document.querySelectorAll('#form_master input, #form_master select, #form_master textarea').forEach(i => alu[i.id] = i.value.toUpperCase());
        const idx = DATA.mat.findIndex(x => x.alu_dni === alu.alu_dni);
        if(idx > -1) DATA.mat[idx] = alu; else DATA.mat.push(alu);
        sync(); alert("REGISTRO CONSOLIDADO.");
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); }
    
    function startVoice() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'es-AR'; recognition.start();
        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript.toUpperCase();
            alert("TITANIUM CAPTÓ: " + text);
        };
    }
</script>
</body>
</html>
