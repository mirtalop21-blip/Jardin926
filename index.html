<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 | AUDITORÍA J926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; overflow-x: hidden; font-size: 11px; }
        .orbitron { font-family: 'Orbitron'; }
        .font-black { font-weight: 900 !important; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.4); box-shadow: 0 0 20px rgba(223, 255, 0, 0.15); }
        .input-elite { background: #000; border: 1px solid #444; padding: 10px; color: var(--nuke); width: 100%; border-radius: 6px; border-left: 4px solid var(--nuke); font-weight: 900; text-transform: uppercase; font-size: 11px; margin-bottom: 4px; }
        .btn-tab { padding: 14px; opacity: 0.4; transition: 0.3s; border-bottom: 3px solid transparent; font-family: 'Orbitron'; font-size: 8px; flex: 1; font-weight: 900; text-transform: uppercase; white-space: nowrap; }
        .active-tab { opacity: 1; border-bottom: 4px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.08); }
        .card-sala { cursor: pointer; transition: 0.3s; border-radius: 10px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); background: #111; position: relative; }
        .S-ROSA { border-top: 6px solid #ff69b4; } .S-ROJA { border-top: 6px solid #ff0000; }
        .S-NARANJA { border-top: 6px solid #ffa500; } .S-CELESTE { border-top: 6px solid #00d4ff; }
        .S-VIOLETA { border-top: 6px solid #8a2be2; } .S-AMARILLA { border-top: 6px solid #ffff00; }
        .S-AZUL { border-top: 6px solid #0000ff; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 bg-black border-b-2 border-nuke flex justify-between items-center sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-6 py-1 font-black orbitron italic text-xl shadow-[0_0_15px_#dfff00]">TITANIUM 360</div>
        <div class="text-[10px] font-black orbitron text-nuke uppercase">Matrícula Real: <span id="header_total">0</span></div>
    </div>
    <div class="flex gap-1 items-center">
        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 text-[8px] font-black orbitron rounded uppercase transition-all shadow-[0_0_10px_rgba(16,185,129,0.4)]">📊 Reporte Excel</button>
        <label class="bg-blue-600 px-3 py-1 text-[7px] rounded cursor-pointer font-black orbitron uppercase text-white">Importar JSON <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900 sticky top-[58px] z-[999] border-b border-white/10 no-scrollbar shadow-2xl">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. Legajo & Edición</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. Foto Interactiva</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. Espera Pro</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-blue-400">4. Asistencia & Foto</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke">5. Superficie Élite (Supervisión)</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-6 bg-zinc-900/30 rounded-lg shadow-2xl">
            <div class="flex gap-3 mb-6">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-4 text-2xl orbitron font-black text-nuke uppercase shadow-inner" placeholder="BUSCADOR RADAR (ESCANEÁ NOMBRE O DNI)...">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="form_master">
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-nuke border-b-2 border-nuke/40 orbitron font-black text-[10px] flex justify-between mb-4">I. ALUMNO <span id="label_edad" class="text-white"></span></h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" onchange="calcEdad()" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <textarea id="alu_salud" class="input-elite h-16" placeholder="FICHA SALUD / OBSERVACIONES / DOMICILIO AUX"></textarea>
                    <select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">SI</option></select>
                </div>
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-zinc-400 border-b-2 border-zinc-700 orbitron font-black text-[10px] uppercase mb-4 italic">II. MADRE</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO / TUTOR">
                    <div class="grid grid-cols-1 gap-2"><input id="m_tel" class="input-elite" placeholder="WHATSAPP / TELÉFONO"></div>
                    <select id="m_est" class="input-elite edu-selector"></select>
                    <input id="m_ocu" class="input-elite" placeholder="OCUPACIÓN / NACIONALIDAD">
                </div>
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700 shadow-xl">
                    <h2 class="text-zinc-400 border-b-2 border-zinc-700 orbitron font-black text-[10px] uppercase mb-4 italic">III. PADRE</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-1 gap-2"><input id="p_tel" class="input-elite" placeholder="WHATSAPP / TELÉFONO"></div>
                    <select id="p_est" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
            </div>
            <button onclick="saveData('mat')" class="w-full mt-4 bg-nuke text-black font-black py-5 orbitron text-xl uppercase shadow-lg transition-all hover:scale-[1.01]">CONSOLIDAR Y GUARDAR MATRÍCULA</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-8" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-10 bg-black/95 rounded-2xl shadow-2xl border-t-4 border-nuke">
            <div class="flex justify-between items-center border-b-2 border-nuke pb-4 mb-8 uppercase">
                <h3 id="sala_title" class="text-4xl font-black orbitron text-nuke"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-6 py-2 orbitron font-black text-xs rounded">CERRAR X</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-orange-950/20 p-8 neon-border rounded-xl border-l-8 border-orange-600 shadow-2xl">
            <h2 class="orbitron text-orange-500 text-2xl font-black mb-6 uppercase flex justify-between tracking-tighter">
                Terminal Lista de Espera Pro 
                <button onclick="saveData('esp')" class="bg-orange-600 hover:bg-orange-700 text-white font-black px-5 py-2 text-[10px] orbitron rounded uppercase transition-all">Cargar Desde Formulario Anterior</button>
            </h2>
            <div class="overflow-x-auto bg-black/40 rounded">
                <table class="w-full text-left text-[10px]">
                    <thead class="orbitron text-zinc-500 border-b border-orange-900/30 uppercase text-[9px]">
                        <tr>
                            <th class="p-2">Aspirante</th>
                            <th class="p-2">DNI</th>
                            <th class="p-2">Sala Asignada</th>
                            <th class="p-2">Acción Mecanizada</th>
                        </tr>
                    </thead>
                    <tbody id="espera_table"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-blue-950/20 p-8 neon-border rounded-xl border-l-8 border-blue-600">
            <h2 class="orbitron text-blue-400 text-2xl font-black mb-6 uppercase">Motor de Asistencia Analítico</h2>
            <select id="asis_sala_select" onchange="renderAsistencia()" class="input-elite mb-6"></select>
            <div id="asis_lista_render" class="space-y-1 mb-8 max-h-80 overflow-y-auto pr-2 no-scrollbar"></div>
            <div id="asis_stats_panel" class="grid grid-cols-3 gap-3"></div>
        </div>
        <div class="bg-red-950/20 p-8 neon-border rounded-xl border-l-8 border-red-600">
            <h2 class="orbitron text-red-500 text-2xl font-black mb-6 uppercase text-center tracking-tighter">Bitácora de Bajas Mensual</h2>
            <div class="grid grid-cols-5 gap-2 mb-6" id="bajas_meses_grid"></div>
            <div id="bajas_detalle" class="bg-black/50 p-4 rounded text-[10px] min-h-[150px]"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-6">
        <div class="bg-zinc-900/80 p-4 rounded border border-zinc-800 flex justify-between items-center">
            <div class="orbitron text-nuke font-black text-sm uppercase">Tablero de Alertas de Control de Gestión</div>
            <div class="text-[9px] text-zinc-400 font-bold uppercase">Umbral Crítico Establecido: <span class="text-red-500 font-black">> 40%</span></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="supervision_cards"></div>
    </section>
</main>

<script>
    // Recuperación biónica automática desde LocalStorage
    let DATA = JSON.parse(localStorage.getItem('T360_J926_AUDITORIA_FINAL_REVISION')) || { mat: [], esp: [], bajas: [] };
    
    // Si por alguna razón estructural interna faltaban los nodos, los blindamos
    if (!DATA.mat) DATA.mat = [];
    if (!DATA.esp) DATA.esp = [];
    if (!DATA.bajas) DATA.bajas = [];

    const SALAS_INST = [
        {id:'Rosa-TM', color:'ROSA', turno:'TM', seccion:'1ºA'}, {id:'Rosa-TT', color:'ROSA', turno:'TT', seccion:'1ºB'},
        {id:'Naranja-TM', color:'NARANJA', turno:'TM', seccion:'ME A'}, {id:'Naranja-TT', color:'NARANJA', turno:'TT', seccion:'ME B'},
        {id:'Roja-TM', color:'ROJA', turno:'TM', seccion:'2ºA'}, {id:'Roja-TT', color:'ROJA', turno:'TT', seccion:'2ºC'},
        {id:'Celeste-TM', color:'CELESTE', turno:'TM', seccion:'2ºB'}, {id:'Celeste-TT', color:'CELESTE', turno:'TT', seccion:'2ºD'},
        {id:'Violeta-TM', color:'VIOLETA', turno:'TM', seccion:'3ºA'}, {id:'Violeta-TT', color:'VIOLETA', turno:'TT', seccion:'3ºD'},
        {id:'Amarilla-TM', color:'AMARILLA', turno:'TM', seccion:'3ºB'}, {id:'Amarilla-TT', color:'AMARILLA', turno:'TT', seccion:'3ºE'},
        {id:'Azul-TM', color:'AZUL', turno:'TM', seccion:'3ºC'}, {id:'Azul-TT', color:'AZUL', turno:'TT', seccion:'3ºF'}
    ];
    const MESES = ["MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
    const EDU_LEVELS = ["S/D", "SIN ESTUDIOS", "PRIMARIA COMP.", "PRIMARIA INC.", "SECUNDARIA COMP.", "SECUNDARIA INC.", "TERCIARIA COMP.", "TERCIARIA INC.", "UNIVERSITARIO COMP.", "UNIVERSITARIO INC."];

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        sSel.innerHTML = ''; asSel.innerHTML = '';
        SALAS_INST.forEach(s => {
            const opt = `<option value="${s.id}">${s.seccion} (${s.turno}) - ${s.color}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt;
        });
        document.querySelectorAll('.edu-selector').forEach(sel => {
            sel.innerHTML = '<option value="S/D">S/D</option>';
            EDU_LEVELS.forEach(e => { if(e !== "S/D") sel.innerHTML += `<option value="${e}">${e}</option>`; });
        });
        renderMesesBajas();
        sync();
    }

    function sync() {
        localStorage.setItem('T360_J926_AUDITORIA_FINAL_REVISION', JSON.stringify(DATA));
        document.getElementById('header_total').innerText = DATA.mat ? DATA.mat.length : 0;
        renderGrid(); renderEspera(); renderAsistencia(); renderSupervision();
    }

    // --- ESCANEO BIÓNICO: ENFOCAR, MAPEAR Y LLEVAR A PESTAÑA 1 ---
    function editAlu(dni) {
        // Buscamos exhaustivamente en matrícula real o lista de espera
        const alu = DATA.mat.find(x => x.alu_dni === dni) || DATA.esp.find(x => x.alu_dni === dni);
        if(alu) { 
            // Vaciamos el formulario maestro para evitar colisiones
            document.querySelectorAll('#form_master input, #form_master select, #form_master textarea').forEach(i => i.value = '');
            
            // Inyección biónica directa campo por campo
            Object.keys(alu).forEach(k => { 
                const el = document.getElementById(k);
                if(el) {
                    el.value = alu[k];
                }
            }); 
            calcEdad(); 
            show(1); // Forzamos redirección inmediata a Pestaña 1
            document.getElementById('radar').value = alu.alu_dni; 
            window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll automático biónico al formulario
        } else {
            alert("ALUMNO NO DETECTADO EN LA BASE ACTIVA");
        }
    }

    // --- CONSOLIDACIÓN DINÁMICA DE FORMULARIO ---
    function saveData(type) {
        const alu = {};
        document.querySelectorAll('#form_master input, #form_master select, #form_master textarea').forEach(i => alu[i.id] = i.value.toUpperCase());
        if(!alu.alu_dni) return alert("DNI OBLIGATORIO PARA OPERAR");
        
        if(type === 'mat') {
            const idx = DATA.mat.findIndex(x => x.alu_dni === alu.alu_dni);
            if(idx > -1) DATA.mat[idx] = alu; else DATA.mat.push(alu);
            alert("MATRÍCULA CONSOLIDADA CON ÉXITO");
        } else if(type === 'esp') {
            const idx = DATA.esp.findIndex(x => x.alu_dni === alu.alu_dni);
            if(idx > -1) DATA.esp[idx] = alu; else DATA.esp.push(alu);
            alert("REGISTRADO EN LISTA DE ESPERA PRO");
        }
        sync();
    }

    // --- MAPEO DE LISTA DE ESPERA PRO ---
    function renderEspera() {
        const tb = document.getElementById('espera_table'); tb.innerHTML = '';
        if(!DATA.esp || DATA.esp.length === 0) {
            tb.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-zinc-600 orbitron">SISTEMA EN ESPERA - SIN ASPIRANTES</td></tr>`;
            return;
        }
        DATA.esp.forEach((e, i) => {
            tb.innerHTML += `<tr class="border-b border-zinc-800 text-white hover:bg-zinc-900/40">
                <td class="p-2 font-black uppercase text-orange-400">${e.alu_nombre}</td>
                <td class="p-2">${e.alu_dni}</td>
                <td class="p-2">${e.alu_sala}</td>
                <td class="p-2">
                    <button onclick="admitirAspirante(${i})" class="bg-blue-600 hover:bg-blue-700 text-white font-black px-3 py-1 font-black text-[8px] rounded uppercase">ADMITIR MATRÍCULA</button>
                </td>
            </tr>`;
        });
    }

    function admitirAspirante(index) {
        if(DATA.esp[index]) {
            DATA.mat.push(DATA.esp[index]);
            DATA.esp.splice(index, 1);
            sync();
            alert("ASPIRANTE ADMITIDO DINÁMICAMENTE EN MATRÍCULA REAL");
        }
    }

    // --- RENDERS DE FOTO INTERACTIVA Y DETALLES DE SALA ---
    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => {
            const cant = DATA.mat ? DATA.mat.filter(x => x.alu_sala === s.id).length : 0;
            grid.innerHTML += `<div onclick="viewSala('${s.id}', '${s.seccion}')" class="card-sala S-${s.color}"><p class="orbitron text-[8px] font-black opacity-60">${s.turno}</p><p class="font-black text-[10px] uppercase">${s.color}</p><h4 class="text-3xl font-black text-nuke">${cant}</h4><p class="text-[9px] font-bold text-zinc-500">${s.seccion}</p></div>`;
        });
    }

    function viewSala(id, seccion) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${seccion}`; l.innerHTML = '';
        const filtered = DATA.mat.filter(x => x.alu_sala === id);
        if(filtered.length === 0) {
            l.innerHTML = `<p class="col-span-full text-center py-4 font-black orbitron text-zinc-600">SALA VACÍA</p>`;
        } else {
            filtered.forEach(a => {
                l.innerHTML += `<div class="bg-zinc-900 p-4 border-l-4 border-nuke flex justify-between items-center mb-2 shadow-xl rounded">
                    <div><p class="font-black text-sm uppercase text-white">${a.alu_nombre}</p><p class="opacity-60 italic text-[10px]">DNI: ${a.alu_dni}</p></div>
                    <div class="flex gap-1">
                        <button onclick="editAlu('${a.alu_dni}')" class="bg-nuke text-black font-black px-3 py-2 rounded text-[8px] orbitron uppercase">LEGAJO</button>
                        <button onclick="processBaja('${a.alu_dni}')" class="bg-red-900 text-white font-black px-3 py-2 rounded text-[8px] orbitron uppercase">BAJA</button>
                        <button onclick="notificarWA('${a.m_tel}', '${a.p_tel}', '${a.alu_nombre}')" class="bg-green-700 text-white font-black px-3 py-2 rounded text-[8px] orbitron uppercase">📲 WA</button>
                    </div>
                </div>`;
            });
        }
        v.classList.remove('hidden'); v.scrollIntoView({behavior:'smooth'});
    }

    // --- PROCESAMIENTO BIÓNICO DE BAJAS CON MOTIVO ---
    function processBaja(dni) {
        const motivo = prompt("CONSIGNAR MOTIVO DE LA BAJA (MUDANZA, PASE, AUSENTISMO, ETC):");
        const mes = prompt("MES CORRESPONDIENTE A LA BAJA (MARZO-DICIEMBRE):").toUpperCase();
        if(motivo && MESES.includes(mes)) {
            const index = DATA.mat.findIndex(x => x.alu_dni === dni);
            if(index > -1) {
                const alu = DATA.mat[index];
                DATA.bajas.push({...alu, motivo_baja: motivo, mes_baja: mes, fecha_baja: new Date().toLocaleDateString()});
                DATA.mat.splice(index, 1);
                sync();
                document.getElementById('sala_detail').classList.add('hidden');
                alert("BAJA GRABADA EN BITÁCORA DE SUPERVISIÓN INSTITUCIONAL.");
            }
        } else { alert("ERROR OPERATIVO: MES INVÁLIDO O MOTIVO INCOMPLETO"); }
    }

    // --- RELEVAMIENTO DE SUPERVISIÓN CON ALERTAS DE CONTROL ---
    function renderSupervision() {
        const container = document.getElementById('supervision_cards'); container.innerHTML = '';
        if(!DATA.mat) return;
        
        SALAS_INST.forEach(s => {
            const list = DATA.mat.filter(x => x.alu_sala === s.id);
            const total = list.length; // N Real Sala

            let auh_si = 0, extranjeros = 0, informal = 0;
            let m_comp = 0, p_comp = 0;

            list.forEach(x => {
                if(x.alu_auh === 'SI') auh_si++;
                if(x.alu_nac && x.alu_nac !== 'ARG') extranjeros++;
                if(x.m_ocu === 'AMA DE CASA' || x.m_ocu === 'S/D' || !x.m_ocu) informal++;
                if(x.m_est && x.m_est.includes('COMP.')) m_comp++;
                if(x.p_est && x.p_est.includes('COMP.')) p_comp++;
            });

            const pct = (val) => total > 0 ? Math.round((val / total) * 100) : 0;
            
            const pAuh = pct(auh_si);
            const pExt = pct(extranjeros);
            const pInf = pct(informal);

            // Alertas visuales dinámicas basadas en los umbrales de vulnerabilidad
            const alertClass = pInf > 40 ? 'border-red-600 bg-red-950/20 shadow-[0_0_15px_rgba(220,38,38,0.3)]' : 'border-white/10 bg-zinc-900';

            container.innerHTML += `
            <div class="${alertClass} border p-4 rounded S-${s.color}">
                <div class="flex justify-between items-center border-b border-white/10 pb-2 mb-2">
                    <h3 class="orbitron text-nuke text-[10px] uppercase font-black">${s.seccion} (${s.turno})</h3>
                    <span class="bg-black text-white px-2 py-0.5 rounded font-black text-[9px]">N: ${total}</span>
                </div>
                <div class="space-y-1.5 text-[9px] font-black uppercase">
                    <div class="flex justify-between"><span>EXTRANJEROS:</span><span class="text-orange-400">${pExt}%</span></div>
                    <div class="flex justify-between"><span>AUH COBERTURA:</span><span class="text-nuke">${pAuh}%</span></div>
                    <div class="flex justify-between"><span>VULNERABILIDAD SOCIAL:</span><span class="${pInf > 40 ? 'text-red-500 font-extrabold shadow-sm' : 'text-zinc-300'}">${pInf}% INF/SD</span></div>
                    <div class="flex justify-between border-t border-zinc-800 pt-1 text-zinc-400 text-[8px]"><span>MADRES ESTUDIOS COMP:</span><span class="text-blue-400">${pct(m_comp)}%</span></div>
                    <div class="flex justify-between text-zinc-400 text-[8px]"><span>PADRES ESTUDIOS COMP:</span><span class="text-cyan-400">${pct(p_comp)}%</span></div>
                </div>
                ${pInf > 40 ? '<div class="mt-2 text-center text-[7px] text-red-500 font-black orbitron tracking-widest animate-pulse">⚠️ ALERTA: VULNERABILIDAD ELEVADA</div>' : ''}
            </div>`;
        });
    }

    // --- INTEGRACIÓN EXCEL REPORTE DE EXPORTACIÓN ---
    function exportToExcel() {
        if(!DATA.mat || DATA.mat.length === 0) return alert("SIN MATRÍCULA ACTIVA PARA EXPORTAR");
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "APELLIDO Y NOMBRE,DNI,SALA,NACIONALIDAD,AUH,MADRE,TEL MADRE,ESTUDIOS MADRE,OCUPACION MADRE,PADRE,TEL PADRE,ESTUDIOS PADRE,OCUPACION PADRE\r\n";
        
        DATA.mat.forEach(x => {
            let row = [
                `"${x.alu_nombre || ''}"`, `"${x.alu_dni || ''}"`, `"${x.alu_sala || ''}"`, `"${x.alu_nac || ''}"`, `"${x.alu_auh || ''}"`,
                `"${x.m_nombre || ''}"`, `"${x.m_tel || ''}"`, `"${x.m_est || ''}"`, `"${x.m_ocu || ''}"`,
                `"${x.p_nombre || ''}"`, `"${x.p_tel || ''}"`, `"${x.p_est || ''}"`, `"${x.p_ocu || ''}"`
            ].join(",");
            csvContent += row + "\r\n";
        });
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `REPORTE_SUPERVISION_TITANIUM_360_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // --- BUSCADOR RADAR REESTRUCTURADO ---
    function smartRadar() { 
        const val = document.getElementById('radar').value.toUpperCase(); 
        if(val.length < 3) return; 
        const res = DATA.mat.find(x => x.alu_dni.includes(val) || x.alu_nombre.includes(val)); 
        if(res) { editAlu(res.alu_dni); } 
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); }
    function calcEdad() { const inputF = document.getElementById('alu_f_nac').value; if(!inputF) return 0; const f = new Date(inputF); const ref = new Date('2026-06-30'); let e = ref.getFullYear() - f.getFullYear(); if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) e--; document.getElementById('label_edad').innerText = `AL 30/6: ${e} AÑOS`; return e; }
    function notificarWA(m, p, nombre) { const tel = m || p; if(!tel || tel === "S/D" || tel === "") return alert("NO REGISTRA CONTACTO"); window.open(`https://wa.me/${tel}?text=TITANIUM 360 - COMUNICADO JARDÍN 926: Ref. Alumno/a ${nombre}.`, '_blank'); }
    function renderAsistencia() { const id = document.getElementById('asis_sala_select').value; const list = DATA.mat.filter(x => x.alu_sala === id); document.getElementById('asis_lista_render').innerHTML = list.map(a => `<div class="bg-zinc-900 p-2 flex justify-between items-center border-l-2 border-blue-500 mb-1"><span class="font-black uppercase text-[9px]">${a.alu_nombre}</span><div class="flex gap-1"><button class="bg-green-800 p-1 px-2 rounded text-[8px]">P</button><button class="bg-red-800 p-1 px-2 rounded text-[8px]">A</button></div></div>`).join(''); document.getElementById('asis_stats_panel').innerHTML = `<div class="bg-zinc-800 p-3 text-center rounded"><p class="text-[8px]">PRESENTE PROMEDIO</p><h5 class="text-nuke font-black">100%</h5></div>`; }
    function renderMesesBajas() { const grid = document.getElementById('bajas_meses_grid'); grid.innerHTML = ''; MESES.forEach(m => { const count = DATA.bajas ? DATA.bajas.filter(x => x.mes_baja === m).length : 0; grid.innerHTML += `<button onclick="verDetalleBaja('${m}')" class="bg-zinc-900 border border-red-900 p-2 rounded text-center hover:bg-red-900/20 transition-all"><p class="text-[7px] orbitron font-black text-zinc-500">${m}</p><h4 class="text-xl font-black text-red-500">${count}</h4></button>`; }); }
    function verDetalleBaja(mes) { const container = document.getElementById('bajas_collapse'); const list = DATA.bajas.filter(x => x.mes_baja === mes); if(list.length === 0) { document.getElementById('bajas_detalle').innerHTML = `<p class="text-center py-6 font-black orbitron uppercase text-zinc-600">SIN MOVIMIENTOS EN ${mes}</p>`; return; } let html = `<h4 class="orbitron text-red-500 mb-2 border-b border-red-900 pb-1 uppercase text-center">${mes}</h4><table class="w-full text-left"><tr><th>SALA</th><th>ALUMNO</th><th>MOTIVO CONSIGNADO</th></tr>`; list.forEach(b => { html += `<tr class="border-b border-zinc-800"><td class="p-1">${b.alu_sala}</td><td class="p-1">${b.alu_nombre}</td><td class="p-1 italic text-red-400 text-[9px]">${b.motivo_baja}</td></tr>`; }); document.getElementById('bajas_detalle').innerHTML = html + `</table>`; }
    function importData(input) { const reader = new FileReader(); reader.onload = (e) => { try { const parsed = JSON.parse(e.target.result); if(parsed && parsed.mat) { DATA = { mat: parsed.mat || [], esp: parsed.esp || [], bajas: parsed.bajas || [] }; } else { DATA = { mat: Array.isArray(parsed) ? parsed : [], esp: [], bajas: [] }; } sync(); alert("SISTEMA BIÓNICO ACTUALIZADO"); } catch(err) { alert("ERROR JSON"); } }; reader.readAsText(input.files[0]); }
</script>
