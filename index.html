<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 TOTAL | JARDÍN 926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; font-size: 11px; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 15px rgba(223, 255, 0, 0.1); }
        .input-elite { background: #000; border: 1px solid #444; padding: 10px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); font-weight: bold; }
        .btn-tab { padding: 12px; opacity: 0.4; transition: 0.3s; border-bottom: 2px solid transparent; text-transform: uppercase; font-weight: bold; font-family: 'Orbitron'; font-size: 9px; flex: 1; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.05); }
        .card-sala { cursor: pointer; transition: 0.3s; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); background: #111; }
        .card-sala:hover { border-color: var(--nuke); transform: scale(1.02); }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-4 py-1 font-black italic orbitron text-xl">TITANIUM 360</div>
        <span class="text-[9px] orbitron hidden md:block">INGENIERÍA DE PROCESOS - JARDÍN 926</span>
    </div>
    <div class="flex gap-2">
        <button onclick="exportExcel()" class="bg-green-700 px-3 py-1 text-[8px] font-bold rounded orbitron">EXCEL</button>
        <button onclick="exportBackup()" class="bg-zinc-800 px-3 py-1 text-[8px] font-bold rounded orbitron">BACKUP</button>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900/95 sticky top-[58px] z-[999]">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. LEGAJOS</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. MAPA SALAS</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. LISTA ESPERA</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-red-500">4. ASISTENCIA/BAJAS</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke">5. SUPERVISIÓN</button>
</nav>

<main class="p-4">
    <section id="v1">
        <div class="neon-border p-4 bg-zinc-900/20 rounded-lg space-y-4">
            <input type="text" id="radar" onkeyup="smartRadar()" class="w-full bg-black border-2 border-nuke p-3 text-lg orbitron uppercase" placeholder="RADAR: DNI O APELLIDO...">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="form_container">
                <div class="space-y-2">
                    <h2 class="text-nuke orbitron text-[10px] border-b border-nuke/30 pb-1">DATOS ALUMNO</h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                    <input id="alu_dni" class="input-elite" placeholder="DNI">
                    <div class="flex gap-2"><input type="date" id="alu_f_nac" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO">
                </div>
                <div class="space-y-2">
                    <h2 class="text-zinc-500 orbitron text-[10px] border-b border-zinc-700 pb-1">MADRE</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE">
                    <input id="m_tel" class="input-elite" placeholder="TELÉFONO">
                    <select id="m_edu" class="input-elite edu-selector"></select>
                </div>
                <div class="space-y-2">
                    <h2 class="text-zinc-500 orbitron text-[10px] border-b border-zinc-700 pb-1">PADRE</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE">
                    <input id="p_tel" class="input-elite" placeholder="TELÉFONO">
                    <select id="p_edu" class="input-elite edu-selector"></select>
                </div>
            </div>
            <button onclick="saveData()" id="btn_save" class="w-full bg-nuke text-black font-black py-3 orbitron">CONSOLIDAR DATOS</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden mt-6 neon-border p-4 bg-black rounded">
            <h3 id="sala_title" class="text-nuke orbitron mb-4 border-b border-nuke"></h3>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-3 gap-2"></div>
        </div>
    </section>

    <section id="v3" class="hidden">
        <div class="bg-zinc-900 p-4 rounded border border-orange-500/30">
            <h2 class="orbitron text-orange-500 mb-4">GESTIÓN DE VACANTES EN ESPERA</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-2 mb-4">
                <input id="esp_nombre" class="input-elite" placeholder="ALUMNO">
                <input id="esp_tel" class="input-elite" placeholder="CONTACTO">
                <select id="esp_prioridad" class="input-elite">
                    <option value="ALTA">PRIORIDAD: ALTA</option>
                    <option value="MEDIA">MEDIA</option>
                    <option value="BAJA">BAJA</option>
                </select>
                <button onclick="addEspera()" class="bg-orange-600 text-white orbitron font-bold">CARGAR A ESPERA</button>
            </div>
            <div id="lista_espera_render" class="space-y-1"></div>
        </div>
    </section>

    <section id="v4" class="hidden">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-zinc-900 p-4 rounded border border-green-500/30">
                <h2 class="orbitron text-green-500 mb-4">REGISTRO DE ASISTENCIA DIARIA</h2>
                <select id="asis_sala" onchange="renderAsis()" class="input-elite mb-4"></select>
                <div id="asis_render" class="space-y-2"></div>
            </div>
            <div class="bg-zinc-900 p-4 rounded border border-red-500/30">
                <h2 class="orbitron text-red-500 mb-4">PROCESAR BAJA DE MATRÍCULA</h2>
                <input type="text" id="baja_radar" onkeyup="radarBaja()" class="input-elite mb-2" placeholder="BUSCAR ALUMNO PARA BAJA...">
                <div id="baja_confirm" class="hidden p-4 bg-red-900/20 border border-red-500 rounded">
                    <p id="baja_label" class="font-bold mb-2"></p>
                    <button onclick="confirmarBaja()" class="bg-red-600 w-full py-2 orbitron font-black text-[10px]">CONFIRMAR BAJA DEFINITIVA</button>
                </div>
                <h3 class="orbitron text-[8px] mt-6 text-zinc-500">HISTORIAL DE BAJAS</h3>
                <div id="bajas_historial" class="text-[9px] opacity-60"></div>
            </div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats_elite"></div>
        <div class="h-[300px] bg-black p-4 rounded border border-zinc-800"><canvas id="chart_salas"></canvas></div>
    </section>
</main>

<script>
    let MASTER = JSON.parse(localStorage.getItem('T360_FINAL')) || { mat: [], esp: [], bajas: [] };
    const SALAS = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AZUL', 'AMARILLA'];
    const EDU = ["SIN ESTUDIOS", "PRIMARIA", "SECUNDARIA INC.", "SECUNDARIA COMP.", "TERCIARIA/UNI"];

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asisSel = document.getElementById('asis_sala');
        SALAS.forEach(s => { ['TM', 'TT'].forEach(t => {
            const opt = `<option value="${s}-${t}">${s} - ${t}</option>`;
            sSel.innerHTML += opt; asisSel.innerHTML += opt;
        });});
        document.querySelectorAll('.edu-selector').forEach(e => { EDU.forEach(o => e.innerHTML += `<option value="${o}">${o}</option>`); });
        sync();
    }

    // --- FUNCIONES DE PERSISTENCIA ---
    function sync() {
        localStorage.setItem('T360_FINAL', JSON.stringify(MASTER));
        renderGrid();
        renderEspera();
        updateStats();
        renderBajas();
    }

    // --- PESTAÑA 1: LEGAJOS ---
    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        const res = MASTER.mat.find(x => x.alu_dni === val || x.alu_nombre.includes(val));
        if(res) {
            Object.keys(res).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = res[k]; });
        }
    }

    function saveData() {
        const dni = document.getElementById('alu_dni').value;
        const index = MASTER.mat.findIndex(x => x.alu_dni === dni);
        const data = {
            alu_nombre: document.getElementById('alu_nombre').value.toUpperCase(),
            alu_dni: dni, alu_f_nac: document.getElementById('alu_f_nac').value,
            alu_sala: document.getElementById('alu_sala').value, alu_dom: document.getElementById('alu_dom').value,
            m_nombre: document.getElementById('m_nombre').value, m_tel: document.getElementById('m_tel').value, m_edu: document.getElementById('m_edu').value,
            p_nombre: document.getElementById('p_nombre').value, p_tel: document.getElementById('p_tel').value, p_edu: document.getElementById('p_edu').value
        };
        if(index > -1) MASTER.mat[index] = data; else MASTER.mat.push(data);
        sync(); alert("DATOS CONSOLIDADOS");
    }

    // --- PESTAÑA 2: MAPA ---
    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS.forEach(s => { ['TM', 'TT'].forEach(t => {
            const tag = `${s}-${t}`; 
            const cant = MASTER.mat.filter(x => x.alu_sala === tag).length;
            grid.innerHTML += `<div onclick="viewSala('${tag}')" class="card-sala border-t-4 border-${s.toLowerCase()}">
                <div class="text-[8px] orbitron">${t}</div><div class="font-bold">${s}</div>
                <div class="text-2xl text-nuke">${cant}</div></div>`;
        });});
    }

    function viewSala(tag) {
        document.getElementById('sala_detail').classList.remove('hidden');
        document.getElementById('sala_title').innerText = "SALA " + tag;
        const list = document.getElementById('sala_list'); list.innerHTML = '';
        MASTER.mat.filter(x => x.alu_sala === tag).forEach(a => {
            list.innerHTML += `<div class="bg-zinc-900 p-2 border-l border-nuke flex justify-between">
                <span>${a.alu_nombre}</span><button onclick="editAlu('${a.alu_dni}')" class="text-nuke font-bold">[VER]</button></div>`;
        });
    }
    function editAlu(dni) { document.getElementById('radar').value = dni; smartRadar(); show(1); }

    // --- PESTAÑA 3: LISTA DE ESPERA ---
    function addEspera() {
        const n = document.getElementById('esp_nombre').value;
        if(!n) return;
        MASTER.esp.push({nombre: n.toUpperCase(), tel: document.getElementById('esp_tel').value, prio: document.getElementById('esp_prioridad').value});
        sync();
    }

    function renderEspera() {
        const r = document.getElementById('lista_espera_render'); r.innerHTML = '';
        MASTER.esp.forEach((e, i) => {
            r.innerHTML += `<div class="flex justify-between bg-black/40 p-2 border-l-2 border-orange-500">
                <span><b class="text-orange-400">[${e.prio}]</b> ${e.nombre} - ${e.tel}</span>
                <button onclick="MASTER.esp.splice(${i},1);sync()" class="text-red-500">ELIMINAR</button></div>`;
        });
    }

    // --- PESTAÑA 4: ASISTENCIA Y BAJAS ---
    function renderAsis() {
        const sala = document.getElementById('asis_sala').value;
        const r = document.getElementById('asis_render'); r.innerHTML = '';
        MASTER.mat.filter(x => x.alu_sala === sala).forEach(a => {
            r.innerHTML += `<div class="flex justify-between items-center bg-black/40 p-2">
                <span>${a.alu_nombre}</span>
                <input type="checkbox" class="w-6 h-6"></div>`;
        });
    }

    let tempBaja = null;
    function radarBaja() {
        const v = document.getElementById('baja_radar').value.toUpperCase();
        tempBaja = MASTER.mat.find(x => x.alu_dni === v || x.alu_nombre.includes(v));
        if(tempBaja) {
            document.getElementById('baja_confirm').classList.remove('hidden');
            document.getElementById('baja_label').innerText = `¿CONFIRMAR BAJA DE: ${tempBaja.alu_nombre}?`;
        }
    }

    function confirmarBaja() {
        MASTER.bajas.push({...tempBaja, fechaBaja: new Date().toLocaleDateString()});
        MASTER.mat = MASTER.mat.filter(x => x.alu_dni !== tempBaja.alu_dni);
        document.getElementById('baja_confirm').classList.add('hidden');
        sync();
    }

    function renderBajas() {
        const h = document.getElementById('bajas_historial'); h.innerHTML = '';
        MASTER.bajas.forEach(b => h.innerHTML += `<div>${b.fechaBaja} - ${b.alu_nombre} (DNI: ${b.alu_dni})</div>`);
    }

    // --- PESTAÑA 5: SUPERVISIÓN ---
    function updateStats() {
        const s = document.getElementById('stats_elite');
        s.innerHTML = `
            <div class="bg-zinc-900 p-3 border-b-2 border-nuke"><p class="text-zinc-500">MATRÍCULA</p><h4 class="text-2xl font-black">${MASTER.mat.length}</h4></div>
            <div class="bg-zinc-900 p-3 border-b-2 border-orange-500"><p class="text-zinc-500">EN ESPERA</p><h4 class="text-2xl font-black">${MASTER.esp.length}</h4></div>
            <div class="bg-zinc-900 p-3 border-b-2 border-red-500"><p class="text-zinc-500">BAJAS</p><h4 class="text-2xl font-black">${MASTER.bajas.length}</h4></div>
            <div class="bg-zinc-900 p-3 border-b-2 border-blue-500"><p class="text-zinc-500">PADRES C/ESTUDIOS</p><h4 class="text-2xl font-black">${MASTER.mat.filter(x=>x.m_edu!=='SIN ESTUDIOS').length}</h4></div>`;
    }

    function show(n) {
        document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
        document.getElementById('v'+n).classList.remove('hidden');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
        document.getElementById('t'+n).classList.add('active-tab');
    }

    function exportExcel() { const ws = XLSX.utils.json_to_sheet(MASTER.mat); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "MATRICULA"); XLSX.writeFile(wb, "SISTEMA_J926.xlsx"); }
    function exportBackup() { const blob = new Blob([JSON.stringify(MASTER)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "T360_BACKUP.json"; a.click(); }
</script>
</body>
</html>
