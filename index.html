<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 | JARDÍN 926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #ccc; font-family: sans-serif; font-size: 11px; }
        .tab-content { display: none; } .active-tab { display: block; }
        .input-elite { background: #000; border: 1px solid #333; padding: 8px; color: var(--nuke); width: 100%; text-transform: uppercase; }
        .btn-nuke { background: var(--nuke); color: #000; font-weight: bold; padding: 10px; cursor: pointer; text-transform: uppercase; }
        .btn-nav { background: #222; border: 1px solid #555; color: #fff; padding: 10px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; } td, th { border: 1px solid #333; padding: 8px; text-align: center; color: white; }
    </style>
</head>
<body class="p-4" onload="initSystem()">

    <header class="mb-6">
        <h1 class="text-2xl font-black text-nuke italic">TITANIUM 360 <span class="text-white text-sm">| JARDÍN 926</span></h1>
        <p id="status_db" class="text-gray-500 font-bold">SISTEMA INICIANDO...</p>
        <div id="nav_menu" class="flex flex-wrap gap-2 mt-4">
            <button onclick="show('v_legajo')" class="btn-nav">1. LEGAJOS</button>
            <button onclick="show('v_salas')" class="btn-nav">2. SALAS</button>
            <button onclick="show('v_espera')" class="btn-nav">3. ESPERA</button>
            <button onclick="show('v_bajas')" class="btn-nav">4. BAJAS</button>
            <button onclick="show('v_asistencia')" class="btn-nav">5. ASISTENCIA 2.0</button>
            <button onclick="show('v_supervision')" class="btn-nav">6. SUPERVISIÓN ÉLITE</button>
            <button onclick="exportarExcelOficial()" class="btn-nuke ml-auto">📥 EXCEL OFICIAL</button>
        </div>
    </header>

    <!-- SECCIÓN LEGAJOS -->
    <section id="v_legajo" class="tab-content active-tab">
        <input type="text" id="radar" class="input-elite" placeholder="🔍 BUSCAR...">
        <div class="mt-4 p-4 border border-zinc-800 bg-black">
            <!-- Formulario de Legajos completo -->
            <h2 class="text-nuke font-bold mb-4">DATOS DEL ALUMNO</h2>
            <div id="form_master" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input id="alu_nombre" class="input-elite" placeholder="NOMBRE Y APELLIDO">
                <input id="alu_dni" class="input-elite" placeholder="DNI">
                <select id="alu_sala" class="input-elite"><option value="3ºA">SALA 3ºA</option><option value="3ºB">SALA 3ºB</option></select>
            </div>
            <button onclick="guardarLegajo()" class="btn-nuke mt-4">GUARDAR LEGAJO</button>
        </div>
    </section>

    <!-- SECCIÓN ASISTENCIA 2.0 -->
    <section id="v_asistencia" class="tab-content">
        <h2 class="text-nuke font-bold mb-4">REGISTRO DE ASISTENCIA 2.0</h2>
        <div id="grid_asis" class="mt-4"></div>
    </section>

    <!-- SECCIÓN SUPERVISIÓN ÉLITE -->
    <section id="v_supervision" class="tab-content">
        <h2 class="text-nuke font-bold mb-4">TABLERO DE SUPERVISIÓN</h2>
        <div id="stats_panel" class="grid grid-cols-4 gap-4"></div>
    </section>

    <script>
        let DB = { mat: [], esp: [], bajas: [] };

        function show(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-tab');
            if(id === 'v_supervision') actualizarSupervision();
        }

        function initSystem() {
            // Carga lógica desde localStorage o JSON
            document.getElementById('status_db').innerText = "SISTEMA CONECTADO | TITANIUM CORE V3";
        }

        function actualizarSupervision() {
            const total = DB.mat.length;
            const arg = DB.mat.filter(a => a.alu_nac === 'ARG').length;
            document.getElementById('stats_panel').innerHTML = `
                <div class="bg-zinc-900 p-4 border border-zinc-700">
                    <p>TOTAL ALUMNOS</p><h3 class="text-2xl text-nuke">${total}</h3>
                </div>
                <div class="bg-zinc-900 p-4 border border-zinc-700">
                    <p>ARGENTINOS</p><h3 class="text-2xl text-nuke">${((arg/total)*100 || 0).toFixed(0)}%</h3>
                </div>
            `;
        }

        function exportarExcelOficial() {
            const ws = XLSX.utils.json_to_sheet(DB.mat);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "SUPERVISION_OFICIAL");
            XLSX.writeFile(wb, "SUPERVISION_JARDIN_926_OFICIAL.xlsx");
        }

        // --- MANTENER TUS OTRAS FUNCIONES AQUÍ ---
    </script>
</body>
</html>
