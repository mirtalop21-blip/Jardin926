<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 ELITE | AUDITORÍA TOTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-lime-400 p-4 font-mono text-[11px]">
    <header class="border-b border-lime-400 pb-2 mb-4">
        <h1 class="text-xl font-black">TITANIUM 360 | AUDITORÍA TOTAL</h1>
        <input type="file" id="file" onchange="procesarCSV(event)" class="mt-2 w-full border p-1">
    </header>

    <div class="flex gap-2 mb-4">
        <button onclick="show('v1')" class="border p-2">1. LEGAJOS</button>
        <button onclick="show('v2')" class="border p-2">2. SALAS</button>
        <button onclick="show('v3')" class="border p-2">3. ESTADÍSTICAS</button>
    </div>

    <div id="v1" class="vista block">
        <input id="q" onkeyup="buscar()" class="w-full bg-black border p-2 mb-2" placeholder="BUSCAR DNI O NOMBRE...">
        <div id="lista" class="h-64 overflow-y-auto"></div>
    </div>

    <div id="v2" class="vista hidden grid grid-cols-2 gap-2" id="grid_salas"></div>
    <div id="v3" class="vista hidden p-4 border" id="stats"></div>

    <script>
        let DATA = { mat: [] };

        function show(id) {
            document.querySelectorAll('.vista').forEach(v => v.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function procesarCSV(e) {
            const r = new FileReader();
            r.onload = (ev) => {
                const lineas = ev.target.result.split('\n');
                // Salteamos las primeras 4 filas de tus CSV (encabezados)
                for (let i = 4; i < lineas.length; i++) {
                    const c = lineas[i].split(',');
                    if (c[9]) { // Si hay nombre en la columna 9
                        DATA.mat.push({
                            alu_nombre: c[9],
                            alu_dni: c[10] || "S/D",
                            alu_sala: c[8] + " " + (c[9] ? c[9] : ""), // Ajuste dinámico
                            m_nombre: c[24] || "N/A"
                        });
                    }
                }
                alert("CARGA EXITOSA: " + DATA.mat.length + " REGISTROS.");
                render();
            };
            r.readAsText(e.target.files[0]);
        }

        function render() {
            // Render Salas
            const salas = [...new Set(DATA.mat.map(a => a.alu_sala))];
            document.getElementById('grid_salas').innerHTML = salas.map(s => `
                <div class="border p-2">SALA ${s}<br>TOTAL: ${DATA.mat.filter(a=>a.alu_sala==s).length}</div>
            `).join('');

            // Stats
            document.getElementById('stats').innerHTML = "TOTAL MATRÍCULA: " + DATA.mat.length;
        }

        function buscar() {
            const q = document.getElementById('q').value.toUpperCase();
            const res = DATA.mat.filter(a => a.alu_nombre.toUpperCase().includes(q) || a.alu_dni.includes(q));
            document.getElementById('lista').innerHTML = res.map(a => `
                <div class="border-b p-2" onclick="alert('MADRE: ${a.m_nombre}')">
                    ${a.alu_nombre} | DNI: ${a.alu_dni}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
