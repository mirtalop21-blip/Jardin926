<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 | Jardín 926</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .sala-card { cursor: pointer; padding: 20px; border-radius: 15px; color: white; margin-bottom: 15px; transition: 0.3s; }
        .sala-card:hover { transform: scale(1.02); }
        .tab-pane { display: none; }
        .active { display: block; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">TITANIUM 360 | Jardín 926</span>
        <button class="btn btn-outline-info" onclick="comandoVoz()">🎤 Radar por Voz</button>
    </div>
</nav>

<div class="container mt-4">
    <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><a class="nav-link" onclick="cambiarTab('dashboard')">Dashboard Institucional</a></li>
        <li class="nav-item"><a class="nav-link" onclick="cambiarTab('legajos')">Legajos 360</a></li>
        <li class="nav-item"><a class="nav-link" onclick="cambiarTab('asistencia')">Asistencia (OCR)</a></li>
        <li class="nav-item"><a class="nav-link" onclick="cambiarTab('supervision')">Supervisión Elite</a></li>
    </ul>

    <div id="content-area" class="p-4 bg-white shadow rounded">
        <div id="dashboard" class="tab-pane active">
            <div class="row" id="grid-salas"></div>
        </div>

        <div id="legajos" class="tab-pane">
            <input type="text" id="radar" class="form-control" placeholder="🔍 Radar: Buscar alumno...">
            <div id="lista-alumnos"></div>
        </div>

        <div id="asistencia" class="tab-pane">
            <input type="file" id="ocr-input" class="form-control mb-2">
            <button class="btn btn-success" onclick="analizarRegistro()">Procesar Registro Manual</button>
            <div id="res-asistencia"></div>
        </div>

        <div id="supervision" class="tab-pane">
            <div id="stats"></div>
            <button class="btn btn-primary" onclick="exportarExcel()">📥 Descargar Excel Supervisión</button>
        </div>
    </div>
</div>

<script>
    let alumnosData = [];

    // Carga inicial del JSON
    async function init() {
        // En tu entorno, el fetch debe apuntar a tu archivo real
        // const response = await fetch('MATRICULA_389_FINAL_DEFINITIVA.json');
        // alumnosData = (await response.json()).mat;
        renderDashboard();
    }

    function renderDashboard() {
        const grid = document.getElementById('grid-salas');
        const salas = ['3ºA', '3ºB', '4ºA', '4ºB', '5ºA', '5ºB', '6ºA', '6ºB', '7ºA', '7ºB', '8ºA', '8ºB', '9ºA', '9ºB'];
        grid.innerHTML = salas.map(s => `
            <div class="col-md-3">
                <div class="sala-card bg-primary" onclick="cambiarTab('legajos')">
                    <h5>Sala ${s}</h5>
                    <p>Total: 28</p>
                </div>
            </div>`).join('');
    }

    // Funciones Nucleares
    function cambiarTab(id) {
        document.querySelectorAll('.tab-pane').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function analizarRegistro() {
        const file = document.getElementById('ocr-input').files[0];
        const { data: { text } } = await Tesseract.recognize(file, 'spa');
        // Lógica de cálculo biónico
        document.getElementById('res-asistencia').innerText = "Análisis: " + text.substring(0, 100) + "...";
    }

    function comandoVoz() {
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.start();
        rec.onresult = (e) => {
            const txt = e.results[0][0].transcript;
            document.getElementById('radar').value = txt;
        };
    }

    function exportarExcel() {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(alumnosData);
        XLSX.utils.book_append_sheet(wb, ws, "Supervision_Oficial");
        XLSX.writeFile(wb, "Reporte_Jardin_926.xlsx");
    }

    init();
</script>
</body>
</html>
