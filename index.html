<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 REAL | JARDÍN 926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; --pro: #00d4ff; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; font-size: 11px; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.4); box-shadow: 0 0 20px rgba(223, 255, 0, 0.1); }
        .input-elite { background: #000; border: 1px solid #333; padding: 10px; color: var(--nuke); width: 100%; border-radius: 6px; border-left: 4px solid var(--nuke); font-weight: 900; outline: none; margin-bottom: 4px; }
        .btn-tab { padding: 16px; opacity: 0.4; font-family: 'Orbitron'; font-size: 8px; flex: 1; font-weight: 900; text-transform: uppercase; color: white; background: none; border: none; border-bottom: 3px solid transparent; }
        .active-tab { opacity: 1; border-bottom: 4px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.08); }
        .card-sala { cursor: pointer; border-radius: 12px; padding: 18px; text-align: center; background: #0a0c10; border: 1px solid #1a1a1a; transition: 0.3s; }
        .card-sala:hover { border-color: var(--nuke); box-shadow: 0 5px 20px rgba(223, 255, 0, 0.2); }
        .S-ROSA { border-top: 8px solid #ff69b4; } .S-ROJA { border-top: 8px solid #ff0000; }
        .S-NARANJA { border-top: 8px solid #ffa500; } .S-CELESTE { border-top: 8px solid #00d4ff; }
        .S-VIOLETA { border-top: 8px solid #8a2be2; } .S-AMARILLA { border-top: 8px solid #ffff00; }
        .S-AZUL { border-top: 8px solid #0000ff; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 bg-black border-b-2 border-nuke flex justify-between items-center sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-5 py-1 font-black orbitron italic text-xl">TITANIUM 360</div>
        <input type="text" id="radar_global" onkeyup="smartRadar()" class="bg-zinc-900 border border-nuke/30 p-2 rounded text-[10px] orbitron text-nuke w-72" placeholder="🔍 BUSCAR DNI O APELLIDO...">
    </div>
    <div class="flex gap-2">
        <div class="bg-zinc-800 px-3 py-1 rounded border border-zinc-700 text-[9px] font-black orbitron text-white flex items-center">MATRÍCULA: <span id="header_total" class="text-nuke ml-1">0</span></div>
        <label class="bg-blue-600 px-4 py-1 text-[8px] rounded cursor-pointer font-black orbitron text-white uppercase shadow-lg flex items-center">CARGAR JSON CONSOLIDADO <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex bg-zinc-900 sticky top-[58px] z-[999] border-b border-white/5">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. Legajo 360</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. Foto Institucional</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. Espera PRO</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-pro">4. Asistencia</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke font-black">5. Supervisión Élite</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-6 bg-zinc-900/30 rounded-lg">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="form_master">
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700">
                    <h2 class="text-nuke border-b border-nuke/40 orbitron font-black text-[10px] mb-4 uppercase">I. Alumno <span id="label_edad" class="text-white"></span></h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                    <input id="alu_dni" class="input-elite" placeholder="DNI">
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO REAL">
                    <input id="alu_sala" class="input-elite" placeholder="SALA ASIGNADA" readonly>
                </div>
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700">
                    <h2 class="text-zinc-400 border-b border-zinc-700 orbitron font-black text-[10px] uppercase mb-4">II. Madre (Espejo)</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <input id="m_dni" class="input-elite" placeholder="DNI">
                    <input id="m_ocu" class="input-elite" placeholder="OCUPACIÓN">
                    <input id="m_est" class="input-elite" placeholder="ESTUDIOS">
                    <input id="m_tel" class="input-elite" placeholder="TELEFONO">
                </div>
                <div class="space-y-2 bg-black/50 p-5 rounded-lg border border-zinc-700">
                    <h2 class="text-zinc-400 border-b border-zinc-700 orbitron font-black text-[10px] uppercase mb-4">III. Padre (Espejo)</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <input id="p_dni" class="input-elite" placeholder="DNI">
                    <input id="p_ocu" class="input-elite" placeholder="OCUPACIÓN">
                    <input id="p_est" class="input-elite" placeholder="ESTUDIOS">
                </div>
            </div>
        </div>
    </section>

    <section id="v2" class="hidden space-y-4">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4 mb-4" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-8 bg-black/95 rounded-2xl">
            <div class="flex justify-between items-center border-b border-nuke pb-4 mb-6">
                <h3 id="sala_title" class="text-2xl font-black orbitron text-nuke uppercase"></h3>
                <button onclick="document.getElementById('sala_detail').classList.add('hidden')" class="bg-zinc-800 px-4 py-2 rounded text-white text-[10px]">CERRAR X</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </section>

    <section id="v3" class="hidden"><div class="p-4 bg-zinc-900 rounded neon-border">No hay aspirantes en espera en el censo actual.</div></section>

    <section id="v4" class="hidden space-y-4">
        <div class="bg-zinc-900 p-6 rounded neon-border flex justify-between items-center">
            <h2 class="orbitron text-pro text-xl font-black uppercase">Asistencia Espejo</h2>
            <select id="asis_sala_select" onchange="renderAsistencia()" class="bg-black border border-zinc-700 p-2 rounded text-pro outline-none"></select>
        </div>
        <div id="asis_lista_render" class="grid grid-cols-1 md:grid-cols-4 gap-3"></div>
    </section>

    <section id="v5" class="hidden space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="supervision_cards"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[400px]">
            <div class="bg-zinc-900 p-6 rounded border border-zinc-800"><canvas id="chart_sala"></canvas></div>
            <div class="bg-zinc-900 p-6 rounded border border-zinc-800 overflow-y-auto">
                <h3 class="orbitron text-nuke text-xs font-black mb-4 uppercase border-b border-zinc-800 pb-2">Porcentajes Reales Sala por Sala</h3>
                <div id="metrics_render_list" class="space-y-2"></div>
            </div>
        </div>
    </section>
</main>

<script>
    let DATA = { mat: [] };
    const SALAS_INST = [
        {id:'Rosa-TM', color:'ROSA', seccion:'1ºA'}, {id:'Rosa-TT', color:'ROSA', seccion:'1ºB'},
        {id:'Naranja-TM', color:'NARANJA', seccion:'ME A'}, {id:'Naranja-TT', color:'NARANJA', seccion:'ME B'},
        {id:'Roja-TM', color:'ROJA', seccion:'2ºA'}, {id:'Roja-TT', color:'ROJA', seccion:'2ºC'},
        {id:'Celeste-TM', color:'CELESTE', seccion:'2ºB'}, {id:'Celeste-TT', color:'CELESTE', seccion:'2ºD'},
        {id:'Violeta-TM', color:'VIOLETA', seccion:'3ºA'}, {id:'Violeta-TT', color:'VIOLETA', seccion:'3ºD'},
        {id:'Amarilla-TM', color:'AMARILLA', seccion:'3ºB'}, {id:'Amarilla-TT', color:'AMARILLA', seccion:'3ºE'},
        {id:'Azul-TM', color:'AZUL', seccion:'3ºC'}, {id:'Azul-TT', color:'AZUL', seccion:'3ºF'}
    ];
    let mainChart = null;

    function initSystem() {
        const asSel = document.getElementById('asis_sala_select');
        asSel.innerHTML = "";
        SALAS_INST.forEach(s => asSel.innerHTML += `<option value="${s.id}">${s.seccion} - Sala ${s.color}</option>`);
        const saved = localStorage.getItem('TITANIUM_CONSOLIDADO_SUPREMO_926');
        if(saved) { DATA = JSON.parse(saved); }
        sync();
    }

    function sync() {
        localStorage.setItem('TITANIUM_CONSOLIDADO_SUPREMO_926', JSON.stringify(DATA));
        document.getElementById('header_total').innerText = DATA.mat.length;
        renderGrid(); 
        renderSupervision(); 
        if(DATA.mat.length > 0) updateChart();
    }

    function importData(input) {
        if (!input.files || input.files.length === 0) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const imported = JSON.parse(e.target.result);
                DATA.mat = imported.mat || [];
                sync();
                alert("BASE DE DATA NORMALIZADA: " + DATA.mat.length + " Alumnos inyectados con legajos y salas.");
            } catch(err) { alert("Error al procesar el archivo JSON."); }
        };
        reader.readAsText(input.files[0]);
    }

    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS_INST.forEach(s => {
            const count = DATA.mat.filter(x => x.alu_sala === s.id).length;
            grid.innerHTML += `<div onclick="viewSala('${s.id}', '${s.seccion}')" class="card-sala S-${s.color}">
                <p class="orbitron text-[8px] opacity-60 uppercase mb-1">${s.color}</p>
                <h4 class="text-3xl font-black text-nuke">${count}</h4>
                <p class="text-[10px] font-bold text-zinc-500 uppercase">${s.seccion}</p>
            </div>`;
        });
    }

    function viewSala(id, seccion) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SECCIÓN: ${seccion}`; l.innerHTML = '';
        const filtrados = DATA.mat.filter(x => x.alu_sala === id);
        if(filtrados.length === 0) { l.innerHTML = '<p class="text-zinc-500 py-2">Sin alumnos asignados.</p>'; }
        filtrados.forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-4 border-l-4 border-nuke rounded">
                <p class="font-black text-xs uppercase text-white">${a.alu_nombre}</p>
                <p class="text-zinc-400 text-[9px] mt-1">DNI: ${a.alu_dni} | RESPONSABLE: ${a.m_nombre}</p>
                <button onclick="editAlu('${a.alu_dni}')" class="w-full mt-3 bg-zinc-800 text-nuke text-[9px] py-1.5 rounded orbitron font-bold">ABRIR LEGAJO EXPEDIENTE</button>
            </div>`;
        });
        v.classList.remove('hidden'); v.scrollIntoView({behavior:'smooth'});
    }

    function renderSupervision() {
        const c = document.getElementById('supervision_cards'); c.innerHTML = '';
        const auh = DATA.mat.filter(x => x.alu_auh === 'SI').length;
        const par = DATA.mat.filter(x => x.alu_nac !== 'ARG').length;
        
        [{t:'MATRÍCULA REAL TOTAL', v:DATA.mat.length, cl:'nuke'}, {t:'COBERTURA AUH TOTAL', v:auh, cl:'pro'}, {t:'POBLACIÓN EXTRANJERA', v:par, cl:'orange-500'}].forEach(k => {
            c.innerHTML += `<div class="bg-zinc-900 p-4 rounded border border-zinc-800 text-center"><p class="orbitron text-[8px] opacity-60 uppercase">${k.t}</p><h4 class="text-3xl font-black text-${k.cl} mt-1">${k.v}</h4></div>`;
        });

        const list = document.getElementById('metrics_render_list'); list.innerHTML = '';
        SALAS_INST.forEach(s => {
            const m = DATA.mat.filter(x => x.alu_sala === s.id);
            const total = m.length;
            const studies = total > 0 ? Math.round((m.filter(x=>x.m_est.includes("COMP.")).length/total)*100) : 0;
            const trabajoMadre = total > 0 ? Math.round((m.filter(x=>x.m_ocu !== "AMA DE CASA").length/total)*100) : 0;
            list.innerHTML += `<div class="p-2 bg-black/40 rounded flex justify-between text-[10px] border-l border-nuke">
                <span class="orbitron font-bold">${s.seccion}</span>
                <span class="text-zinc-400">ESTUDIOS MADRE: ${studies}% | TRABAJO ACTIVO: ${trabajoMadre}%</span>
            </div>`;
        });
    }

    function renderAsistencia() {
        const id = document.getElementById('asis_sala_select').value;
        const render = document.getElementById('asis_lista_render');
        render.innerHTML = DATA.mat.filter(x => x.alu_sala === id).map(a => `
            <div class="bg-zinc-900 p-3 flex justify-between items-center rounded border border-zinc-800">
                <span class="font-bold text-[10px] text-zinc-300 uppercase">${a.alu_nombre}</span>
                <input type="checkbox" onchange="calcPromedio()" class="asis-check w-5 h-5 accent-pro">
            </div>`).join('');
        calcPromedio();
    }

    function calcPromedio() {
        const total = document.querySelectorAll('.asis-check').length;
        const pres = document.querySelectorAll('.asis-check:checked').length;
        document.getElementById('promedio_val').innerText = total > 0 ? ((pres / total) * 100).toFixed(0) : 0;
    }

    function updateChart() {
        const ctxS = document.getElementById('chart_sala').getContext('2d');
        if(mainChart) mainChart.destroy();
        mainChart = new Chart(ctxS, {
            type: 'bar',
            data: { labels: SALAS_INST.map(s => s.seccion), datasets: [{ label: 'ALUMNOS', data: SALAS_INST.map(s => DATA.mat.filter(x => x.alu_sala === s.id).length), backgroundColor: '#dfff00' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }

    function editAlu(dni) {
        const alu = DATA.mat.find(x => x.alu_dni === dni);
        if(alu) { 
            Object.keys(alu).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = alu[k]; }); 
            show(1); 
        }
    }

    function smartRadar() {
        const val = document.getElementById('radar_global').value.toUpperCase();
        if(val.length < 3) return;
        const res = DATA.mat.find(x => x.alu_dni.includes(val) || x.alu_nombre.includes(val));
        if(res) editAlu(res.alu_dni);
    }

    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach((b, i) => { if(i+1 === n) b.className="btn-tab active-tab"; else b.className="btn-tab"; }); }
    function saveData() { alert("Cambios guardados en base local."); sync(); }
</script>
</body>
</html>
