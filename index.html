<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 TOTAL | J926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: sans-serif; font-size: 11px; }
        .input-elite { background: #000; border: 1px solid #333; padding: 8px; color: var(--nuke); width: 100%; text-transform: uppercase; border-radius: 4px; }
        .tab-content { display: none; } .active-tab { display: block; }
        .card-sala { cursor: pointer; border: 1px solid #444; background: #111; padding: 15px; text-align: center; border-radius: 8px; }
        .card-sala:hover { border-color: var(--nuke); }
        .btn-nuke { background: var(--nuke); color: #000; font-weight: bold; padding: 10px; cursor: pointer; border-radius: 4px; border: none; }
    </style>
</head>
<body class="p-4">

    <!-- Navegación -->
    <nav class="flex gap-2 mb-6 border-b border-zinc-800 pb-4 overflow-x-auto text-xs font-bold uppercase">
        <button onclick="show('v1')" class="text-nuke">1. LEGAJO 360</button>
        <button onclick="show('v2')" class="text-white">2. SALAS</button>
        <button onclick="show('v4')" class="text-red-500">4. BAJAS</button>
        <button onclick="show('v5')" class="text-blue-400">5. ASISTENCIA</button>
        <button onclick="show('v6')" class="text-orange-400">6. SUPERVISIÓN</button>
    </nav>

    <!-- V1: LEGAJO 360 (Con niveles de estudio detallados) -->
    <section id="v1" class="tab-content active-tab">
        <input type="text" id="radar" onkeyup="buscarRadar()" class="input-elite mb-4 border-nuke" placeholder="🔍 BUSCAR DNI O APELLIDO...">
        <div class="grid md:grid-cols-3 gap-4">
            <div class="space-y-2 border border-zinc-700 p-4 rounded">
                <h2 class="text-nuke font-black">I. DATOS ALUMNO</h2>
                <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                <input id="alu_dni" class="input-elite" placeholder="DNI">
                <input id="alu_sala" class="input-elite" placeholder="SALA (EJ: 1ºA)">
            </div>
            <div class="space-y-2 border border-zinc-700 p-4 rounded">
                <h2 class="text-blue-400 font-black">II. MADRE/TUTOR</h2>
                <input id="m_nombre" class="input-elite" placeholder="NOMBRE">
                <select id="m_est" class="input-elite">
                    <option value="">NIVEL ESTUDIOS...</option>
                    <option value="SIN ESTUDIOS">SIN ESTUDIOS</option>
                    <option value="PRIMARIA INCOMPLETA">PRIMARIA INCOMPLETA</option>
                    <option value="PRIMARIA COMPLETA">PRIMARIA COMPLETA</option>
                    <option value="SECUNDARIA INCOMPLETA">SECUNDARIA INCOMPLETA</option>
                    <option value="SECUNDARIA COMPLETA">SECUNDARIA COMPLETA</option>
                    <option value="TERCIARIA INCOMPLETA">TERCIARIA INCOMPLETA</option>
                    <option value="TERCIARIA COMPLETA">TERCIARIA COMPLETA</option>
                    <option value="UNIVERSITARIA INCOMPLETA">UNIVERSITARIA INCOMPLETA</option>
                    <option value="UNIVERSITARIA COMPLETA">UNIVERSITARIA COMPLETA</option>
                </select>
            </div>
            <div class="space-y-2 border border-zinc-700 p-4 rounded">
                <h2 class="text-red-400 font-black">III. PADRE/TUTOR</h2>
                <input id="p_nombre" class="input-elite" placeholder="NOMBRE">
                <select id="p_est" class="input-elite">
                    <option value="">NIVEL ESTUDIOS...</option>
                    <option value="SIN ESTUDIOS">SIN ESTUDIOS</option>
                    <option value="PRIMARIA INCOMPLETA">PRIMARIA INCOMPLETA</option>
                    <option value="PRIMARIA COMPLETA">PRIMARIA COMPLETA</option>
                    <option value="SECUNDARIA INCOMPLETA">SECUNDARIA INCOMPLETA</option>
                    <option value="SECUNDARIA COMPLETA">SECUNDARIA COMPLETA</option>
                    <option value="TERCIARIA INCOMPLETA">TERCIARIA INCOMPLETA</option>
                    <option value="TERCIARIA COMPLETA">TERCIARIA COMPLETA</option>
                    <option value="UNIVERSITARIA INCOMPLETA">UNIVERSITARIA INCOMPLETA</option>
                    <option value="UNIVERSITARIA COMPLETA">UNIVERSITARIA COMPLETA</option>
                </select>
            </div>
        </div>
        <div class="flex gap-2 mt-4">
            <button onclick="guardarLegajo()" class="btn-nuke w-full">💾 GUARDAR / ACTUALIZAR LEGAJO</button>
            <button onclick="darDeBaja()" class="bg-red-900 text-white p-2 px-4 rounded font-bold">🚨 BAJA</button>
        </div>
    </section>

    <!-- V2: SALAS -->
    <section id="v2" class="tab-content">
        <div id="grid_salas" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>
        <div id="detalle_sala" class="hidden bg-zinc-900 p-4 rounded border border-zinc-700">
            <h2 id="sala_titulo" class="text-nuke font-black text-lg mb-4"></h2>
            <table class="w-full text-left">
                <tbody id="tabla_sala"></tbody>
            </table>
        </div>
    </section>

    <script>
        let DB = JSON.parse(localStorage.getItem('T360_J926_PRO')) || { mat: [], bajas: [] };

        function show(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-tab');
            if(id === 'v2') renderSalas();
        }

        function renderSalas() {
            const grid = document.getElementById('grid_salas');
            grid.innerHTML = '';
            const salas = ["1ºA", "1ºB", "2ºA", "2ºB", "2ºC", "2ºD", "3ºA", "3ºB", "3ºC", "3ºD", "3ºE", "3ºF"];
            salas.forEach(s => {
                const cant = DB.mat.filter(a => a.alu_sala === s).length;
                grid.innerHTML += `<div class="card-sala" onclick="verDetalle('${s}')"><p class="text-white">${s}</p><h2 class="text-2xl text-nuke">${cant}</h2></div>`;
            });
        }

        function verDetalle(sala) {
            document.getElementById('detalle_sala').classList.remove('hidden');
            document.getElementById('sala_titulo').innerText = "LISTADO: " + sala;
            const tabla = document.getElementById('tabla_sala');
            tabla.innerHTML = "<tr><th class='text-nuke'>ALUMNO</th><th>DNI</th><th>ACCIÓN</th></tr>";
            DB.mat.filter(a => a.alu_sala === sala).forEach(a => {
                tabla.innerHTML += `<tr class='border-b border-zinc-800'>
                    <td class='py-2'>${a.alu_nombre}</td><td>${a.alu_dni || 'S/D'}</td>
                    <td><button onclick="editarAlumno('${a.alu_dni || a.alu_nombre}')" class='bg-zinc-700 p-1 px-2 rounded'>VER LEGAJO</button></td>
                </tr>`;
            });
        }

        function editarAlumno(id) {
            const alu = DB.mat.find(a => (a.alu_dni === id || a.alu_nombre === id));
            if(alu) {
                for(let key in alu) { if(document.getElementById(key)) document.getElementById(key).value = alu[key]; }
                show('v1');
            }
        }

        function guardarLegajo() {
            const dni = document.getElementById('alu_dni').value;
            const alu = {
                alu_nombre: document.getElementById('alu_nombre').value.toUpperCase(),
                alu_dni: dni,
                alu_sala: document.getElementById('alu_sala').value,
                m_nombre: document.getElementById('m_nombre').value.toUpperCase(),
                m_est: document.getElementById('m_est').value,
                p_nombre: document.getElementById('p_nombre').value.toUpperCase(),
                p_est: document.getElementById('p_est').value
            };
            const idx = DB.mat.findIndex(a => a.alu_dni === dni);
            if(idx > -1) DB.mat[idx] = alu; else DB.mat.push(alu);
            localStorage.setItem('T360_J926_PRO', JSON.stringify(DB));
            alert("DATOS CONSOLIDADOS.");
        }

        function buscarRadar() {
            const q = document.getElementById('radar').value.toUpperCase();
            if(q.length < 3) return;
            const res = DB.mat.find(a => a.alu_dni.includes(q) || a.alu_nombre.includes(q));
            if(res) {
                for(let key in res) { if(document.getElementById(key)) document.getElementById(key).value = res[key]; }
            }
        }
        
        // Carga inicial
        window.onload = () => { renderSalas(); };
    </script>
</body>
</html>
