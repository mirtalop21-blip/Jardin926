<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 | JARDÍN 926 | CONTROL TOTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto', sans-serif; font-size: 11px; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 15px rgba(223, 255, 0, 0.1); }
        .btn-tab { padding: 12px; opacity: 0.4; transition: 0.3s; border-bottom: 2px solid transparent; text-transform: uppercase; font-weight: bold; font-family: 'Orbitron'; flex: 1; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.05); }
        .card-sala { cursor: pointer; transition: 0.3s; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); background: #111; position: relative; }
        .card-sala:hover { transform: scale(1.05); filter: brightness(1.2); border-color: var(--nuke); }
        .S-ROSA { border-top: 5px solid #ff69b4; } .S-ROJA { border-top: 5px solid #ff0000; }
        .S-NARANJA { border-top: 5px solid #ffa500; } .S-CELESTE { border-top: 5px solid #00d4ff; }
        .S-VIOLETA { border-top: 5px solid #8a2be2; } .S-AMARILLA { border-top: 5px solid #ffff00; }
        .S-AZUL { border-top: 5px solid #0000ff; } .S-VERDE { border-top: 5px solid #00ff00; }
        .alerta-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid var(--bg); }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-4 py-1 font-black italic orbitron text-lg">TITANIUM 360</div>
        <div id="alert_manager" class="hidden md:flex gap-2">
            <span class="bg-red-900/50 text-red-400 px-3 py-1 rounded-full text-[9px] orbitron border border-red-500 animate-pulse">ALERTA DIRECTIVOS: DATOS INCOMPLETOS</span>
        </div>
    </div>
    <div class="flex gap-2">
        <button onclick="exportBackup()" class="bg-zinc-800 px-3 py-1 text-[8px] font-bold rounded orbitron">RESPALDO JSON</button>
        <label class="bg-blue-600 px-3 py-1 text-[8px] rounded cursor-pointer font-bold orbitron uppercase">Importar Matrícula <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex bg-zinc-900/95 sticky top-[58px] z-[999] border-b border-white/5">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">Carga & Radar</button>
    <button onclick="show(2)" id="t2" class="btn-tab">Salas Interactivas</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-nuke">Supervisión & Datos</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-4 bg-zinc-900/20 rounded-lg">
            <input type="text" id="radar" onkeyup="smartRadar()" class="w-full bg-black border-2 border-nuke p-4 text-xl orbitron uppercase mb-4" placeholder="RADAR: BUSCAR POR DNI O APELLIDO...">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="form_container">
                <div class="space-y-2">
                    <input id="alu_nombre" class="bg-zinc-900 border border-zinc-700 p-3 w-full rounded" placeholder="APELLIDO Y NOMBRE">
                    <div class="flex gap-2">
                        <input id="alu_dni" class="bg-zinc-900 border border-zinc-700 p-3 w-full rounded" placeholder="DNI">
                        <select id="alu_sala" class="bg-zinc-900 border border-zinc-700 p-3 w-full rounded font-bold text-nuke"></select>
                    </div>
                </div>
                <div class="space-y-2">
                    <input id="alu_salud" class="bg-zinc-900 border border-zinc-700 p-3 w-full rounded" placeholder="DATOS SALUD / CUD">
                    <button onclick="saveData()" class="w-full bg-nuke text-black font-black py-3 orbitron text-sm uppercase">CONSOLIDAR ALUMNO</button>
                </div>
            </div>
        </div>
        
        <div class="bg-red-900/10 border border-red-500/30 p-4 rounded-lg">
            <h3 class="orbitron text-red-500 mb-2">PANEL DE ALERTAS (DIRECTIVOS)</h3>
            <div id="directivo_alerts" class="grid grid-cols-1 md:grid-cols-3 gap-2"></div>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-6" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-6 bg-black/95 rounded-xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="sala_title" class="text-2xl font-black orbitron text-nuke uppercase"></h3>
                <button onclick="this.parentElement.parentElement.classList.add('hidden')" class="text-white bg-zinc-800 px-4 py-1 rounded">CERRAR</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="text-zinc-500 border-b border-zinc-800">
                        <tr><th class="p-2">Nombre</th><th class="p-2">DNI</th><th class="p-2">Salud</th><th class="p-2">Acción</th></tr>
                    </thead>
                    <tbody id="sala_list_body"></tbody>
                </table>
            </div>
        </div>
    </section>

    <section id="v3" class="hidden space-y-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats_panel"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-zinc-900 p-4 rounded-lg border border-zinc-800 h-[300px]">
                <canvas id="chart_salas"></canvas>
            </div>
            <div class="bg-zinc-900 p-4 rounded-lg border border-zinc-800 h-[300px]">
                <canvas id="chart_salud"></canvas>
            </div>
        </div>
    </section>
</main>

<script>
    let DATA = JSON.parse(localStorage.getItem('T360_J926_DB')) || [];
    const SALAS = [
        {n:'ROSA', t:'TM'}, {n:'ROJA', t:'TM'}, {n:'NARANJA', t:'TM'}, {n:'CELESTE', t:'TM'}, {n:'VIOLETA', t:'TM'}, {n:'AMARILLA', t:'TM'}, {n:'AZUL', t:'TM'},
        {n:'ROSA', t:'TT'}, {n:'ROJA', t:'TT'}, {n:'NARANJA', t:'TT'}, {n:'CELESTE', t:'TT'}, {n:'VIOLETA', t:'TT'}, {n:'AMARILLA', t:'TT'}, {n:'AZUL', t:'TT'}
    ];

    function initSystem() {
        const sel = document.getElementById('alu_sala');
        SALAS.forEach(s => {
            const val = `${s.n}-${s.t}`;
            sel.innerHTML += `<option value="${val}">${val}</option>`;
        });
        sync();
    }

    function sync() {
        localStorage.setItem('T360_J926_DB', JSON.stringify(DATA));
        renderGrid();
        updateStats();
        updateAlerts();
    }

    function renderGrid() {
        const grid = document.getElementById('mapa_grid');
        grid.innerHTML = '';
        SALAS.forEach(s => {
            const tag = `${s.n}-${s.t}`;
            const lista = DATA.filter(x => x.alu_sala === tag);
            const alertas = lista.filter(x => !x.alu_dni || !x.alu_salud).length;
            
            grid.innerHTML += `
                <div onclick="viewSala('${tag}')" class="card-sala S-${s.n}">
                    ${alertas > 0 ? `<div class="alerta-badge">${alertas}</div>` : ''}
                    <div class="orbitron text-[7px] opacity-40">${s.t}</div>
                    <div class="font-bold">${s.n}</div>
                    <div class="text-2xl font-black text-nuke">${lista.length}</div>
                </div>`;
        });
    }

    function viewSala(tag) {
        const box = document.getElementById('sala_detail');
        const body = document.getElementById('sala_list_body');
        document.getElementById('sala_title').innerText = `SALA ${tag}`;
        body.innerHTML = '';
        
        const lista = DATA.filter(x => x.alu_sala === tag);
        lista.forEach(a => {
            body.innerHTML += `
                <tr class="border-b border-zinc-900">
                    <td class="p-2 uppercase font-bold">${a.alu_nombre}</td>
                    <td class="p-2 ${!a.alu_dni ? 'text-red-500 font-bold' : ''}">${a.alu_dni || 'SIN DNI'}</td>
                    <td class="p-2 text-[9px]">${a.alu_salud || '-'}</td>
                    <td class="p-2"><button onclick="editAlu('${a.alu_dni}')" class="text-nuke font-bold">EDITAR</button></td>
                </tr>`;
        });
        box.classList.remove('hidden');
        box.scrollIntoView({behavior:'smooth'});
    }

    function updateAlerts() {
        const panel = document.getElementById('directivo_alerts');
        const sinDni = DATA.filter(x => !x.alu_dni).length;
        const sinSalud = DATA.filter(x => !x.alu_salud).length;
        const superpoblacion = SALAS.filter(s => DATA.filter(x => x.alu_sala === `${s.n}-${s.t}`).length > 30).length;

        panel.innerHTML = `
            <div class="bg-black p-2 border-l-4 border-red-600">⚠️ ${sinDni} Alumnos sin DNI</div>
            <div class="bg-black p-2 border-l-4 border-orange-500">⚠️ ${sinSalud} Sin ficha de salud</div>
            <div class="bg-black p-2 border-l-4 border-yellow-500">⚠️ ${superpoblacion} Salas con +30 alumnos</div>
        `;
    }

    function updateStats() {
        const p = document.getElementById('stats_panel');
        const items = [
            {t:'MATRÍCULA TOTAL', v:DATA.length, c:'nuke'},
            {t:'TURNO MAÑANA', v:DATA.filter(x=>x.alu_sala.includes('TM')).length, c:'blue-400'},
            {t:'TURNO TARDE', v:DATA.filter(x=>x.alu_sala.includes('TT')).length, c:'orange-400'},
            {t:'COBERTURA SALUD', v:Math.round((DATA.filter(x=>x.alu_salud).length / DATA.length)*100 || 0)+'%', c:'white'}
        ];
        p.innerHTML = items.map(i => `<div class="bg-zinc-900 p-4 rounded border-b-2 border-${i.c}"><p class="text-[9px] orbitron opacity-50">${i.t}</p><h4 class="text-2xl font-black text-${i.c}">${i.v}</h4></div>`).join('');
    }

    let charts = {};
    function renderCharts() {
        if(charts.salas) charts.salas.destroy();
        if(charts.salud) charts.salud.destroy();

        const ctx1 = document.getElementById('chart_salas').getContext('2d');
        charts.salas = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: ['ROSA','ROJA','NARANJA','CELESTE','VIOLETA','AMARILLA','AZUL'],
                datasets: [{
                    label: 'Turno Mañana',
                    data: ['ROSA','ROJA','NARANJA','CELESTE','VIOLETA','AMARILLA','AZUL'].map(n => DATA.filter(x=>x.alu_sala===`${n}-TM`).length),
                    backgroundColor: '#dfff00'
                }]
            },
            options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
        });
    }

    function saveData() {
        const alu = {
            alu_nombre: document.getElementById('alu_nombre').value.toUpperCase(),
            alu_dni: document.getElementById('alu_dni').value,
            alu_sala: document.getElementById('alu_sala').value,
            alu_salud: document.getElementById('alu_salud').value.toUpperCase()
        };
        if(!alu.alu_nombre) return alert("NOMBRE REQUERIDO");
        
        const idx = DATA.findIndex(x => x.alu_dni === alu.alu_dni && alu.alu_dni !== "");
        if(idx > -1) DATA[idx] = alu; else DATA.push(alu);
        
        sync();
        alert("ALUMNO REGISTRADO CORRECTAMENTE");
        document.getElementById('alu_nombre').value = '';
        document.getElementById('alu_dni').value = '';
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const raw = JSON.parse(e.target.result);
            // El motor ahora normaliza los datos de las capturas cargadas (n, d, f, sala)
            DATA = (raw.mat || raw).map(i => ({
                alu_nombre: i.alu_nombre || i.n || "",
                alu_dni: i.alu_dni || i.d || "",
                alu_sala: i.alu_sala || i.sala || "SIN ASIGNAR",
                alu_salud: i.alu_salud || i.salud || ""
            }));
            sync();
            alert("SISTEMA SINCRONIZADO: " + DATA.length + " ALUMNOS LISTOS.");
        };
        reader.readAsText(input.files[0]);
    }

    function exportBackup() {
        const blob = new Blob([JSON.stringify(DATA)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `TITANIUM_J926_BACKUP.json`;
        a.click();
    }

    function show(n) {
        document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
        document.getElementById('v'+n).classList.remove('hidden');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
        document.getElementById('t'+n).classList.add('active-tab');
        if(n===3) setTimeout(renderCharts, 100);
    }
</script>
</body>
</html>
