<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 | AUDITORÍA TOTAL J926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: sans-serif; font-size: 11px; }
        .input-elite { background: #000; border: 1px solid #444; padding: 8px; color: var(--nuke); width: 100%; text-transform: uppercase; }
        .tab-content { display: none; }
        .active-tab { display: block; }
    </style>
</head>
<body class="p-4">

    <nav class="flex gap-2 mb-6 border-b border-zinc-800 pb-2">
        <button onclick="show('v1')">1. LEGAJO 360</button>
        <button onclick="show('v2')">2. FOTO SALAS</button>
        <button onclick="show('v3')">3. ESPERA</button>
        <button onclick="show('v4')">4. ASISTENCIA</button>
        <button onclick="show('v5')">5. SUPERVISIÓN</button>
    </nav>

    <section id="v1" class="tab-content active-tab">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="form_master">
            <div class="space-y-2 border p-4">
                <h2 class="text-nuke font-black">I. ALUMNO</h2>
                <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                <input id="alu_dni" class="input-elite" placeholder="DNI">
                <input type="date" id="alu_nac" class="input-elite">
                <input id="alu_domicilio" class="input-elite" placeholder="DOMICILIO">
                <input type="number" id="alu_hermanos" class="input-elite" placeholder="CANT. HERMANOS">
                <select id="alu_her_jardin" class="input-elite"><option>HERMANO EN JARDÍN: NO</option><option>SI</option></select>
                <textarea id="alu_salud" class="input-elite" placeholder="FICHA SALUD / ALERGIAS"></textarea>
            </div>
            <div class="space-y-2 border p-4">
                <h2 class="text-blue-400 font-black">II. MADRE</h2>
                <input id="m_nombre" class="input-elite" placeholder="NOMBRE Y APELLIDO">
                <input id="m_dni" class="input-elite" placeholder="DNI">
                <input id="m_tel" class="input-elite" placeholder="TELÉFONO">
                <select id="m_estudios" class="input-elite">
                    <option value="SIN">SIN ESTUDIOS</option><option value="PRIMARIA">PRIMARIA COMP/INC</option>
                    <option value="SECUNDARIA">SECUNDARIA COMP/INC</option><option value="TERCIARIA">TERCIARIA COMP/INC</option>
                    <option value="UNIVERSITARIA">UNIVERSITARIA COMP/INC</option>
                </select>
                <select id="m_auh" class="input-elite"><option>AUH: NO</option><option>SI</option></select>
            </div>
            <div class="space-y-2 border p-4">
                <h2 class="text-red-400 font-black">III. PADRE</h2>
                <input id="p_nombre" class="input-elite" placeholder="NOMBRE Y APELLIDO">
                <input id="p_dni" class="input-elite" placeholder="DNI">
                <input id="p_tel" class="input-elite" placeholder="TELÉFONO">
                <select id="p_estudios" class="input-elite">
                    <option value="SIN">SIN ESTUDIOS</option><option value="PRIMARIA">PRIMARIA COMP/INC</option>
                    <option value="SECUNDARIA">SECUNDARIA COMP/INC</option><option value="TERCIARIA">TERCIARIA COMP/INC</option>
                    <option value="UNIVERSITARIA">UNIVERSITARIA COMP/INC</option>
                </select>
            </div>
        </div>
        <button onclick="guardar()" class="mt-4 bg-nuke text-black w-full p-4 font-black">CONSOLIDAR LEGAJO 360</button>
    </section>

    <section id="v2" class="tab-content">
        <h2 class="text-xl font-black mb-4">FOTO INSTITUCIONAL - MAPA DE SALAS</h2>
        <div id="grid_salas" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>

    <section id="v5" class="tab-content">
        <h2 class="text-xl font-black mb-4">SUPERVISIÓN POBLACIONAL</h2>
        <div id="stats_panel" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
    </section>

    <script>
        let DATA = JSON.parse(localStorage.getItem('T360_DB')) || { mat: [] };

        function show(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-tab');
        }

        function guardar() {
            const alu = {};
            document.querySelectorAll('input, select, textarea').forEach(i => alu[i.id] = i.value);
            DATA.mat.push(alu);
            localStorage.setItem('T360_DB', JSON.stringify(DATA));
            alert("LEGAJO GUARDADO");
            renderSalas();
        }

        function renderSalas() {
            const grid = document.getElementById('grid_salas');
            grid.innerHTML = '';
            const salas = ['ROSA','ROJA','NARANJA','CELESTE','VIOLETA','AZUL','AMARILLA','VERDE'];
            salas.forEach(s => {
                const total = DATA.mat.filter(a => a.alu_sala === s).length;
                grid.innerHTML += `<div class="border p-4 neon-border text-center">
                    <p class="font-black">${s}</p>
                    <h2 class="text-3xl text-nuke">${total}</h2>
                </div>`;
            });
        }

        function init() { renderSalas(); }
        init();
    </script>
</body>
</html>
