<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 ELITE | JARDÍN 926 | FULL ANALYSIS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; overflow-x: hidden; font-size: 11px; }
        .orbitron { font-family: 'Orbitron'; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 15px rgba(223, 255, 0, 0.1); }
        .input-elite { background: #000; border: 1px solid #444; padding: 8px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); font-weight: bold; }
        .btn-tab { padding: 12px; opacity: 0.4; transition: 0.3s; border-bottom: 2px solid transparent; text-transform: uppercase; font-weight: bold; font-family: 'Orbitron'; font-size: 9px; flex: 1; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.05); }
        .card-sala { cursor: pointer; transition: 0.3s; border-radius: 8px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); background: #111; position: relative; }
        .card-sala:hover { transform: translateY(-5px); border-color: var(--nuke); background: #1a1a1a; }
        .S-ROSA { border-top: 5px solid #ff69b4; } .S-ROJA { border-top: 5px solid #ff0000; }
        .S-NARANJA { border-top: 5px solid #ffa500; } .S-CELESTE { border-top: 5px solid #00d4ff; }
        .S-VIOLETA { border-top: 5px solid #8a2be2; } .S-AMARILLA { border-top: 5px solid #ffff00; }
        .S-AZUL { border-top: 5px solid #0000ff; } .S-VERDE { border-top: 5px solid #00ff00; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-3 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-4 py-1 font-black italic orbitron text-lg">TITANIUM 360</div>
        <div id="alert_hub" class="flex gap-2">
            <span class="bg-red-900/40 text-red-500 border border-red-500 px-3 py-1 rounded-full text-[8px] orbitron animate-pulse">ALERTA DIRECTIVOS: INVESTIGACIÓN ACTIVA</span>
        </div>
    </div>
    <div class="flex gap-2">
        <button onclick="exportExcel()" class="bg-green-700 px-3 py-1 text-[8px] font-bold rounded orbitron">EXCEL</button>
        <button onclick="exportBackup()" class="bg-zinc-800 px-3 py-1 text-[8px] font-bold rounded orbitron">BACKUP</button>
        <label class="bg-blue-600 px-3 py-1 text-[8px] rounded cursor-pointer font-bold orbitron uppercase">Importar <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900/95 sticky top-[58px] z-[999] border-b border-white/5">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. LEGAJO & SCAN</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. MAPA 14 SALAS</button>
    <button onclick="show(3)" id="t3" class="btn-tab text-orange-400">3. LISTA ESPERA PRO</button>
    <button onclick="show(4)" id="t4" class="btn-tab text-red-500">4. ASISTENCIA & BAJAS</button>
    <button onclick="show(5)" id="t5" class="btn-tab text-nuke">5. SUPERVISIÓN ÉLITE</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-4 bg-zinc-900/20 rounded-lg">
            <div class="flex gap-2 mb-4">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-4 text-xl orbitron uppercase" placeholder="BUSCADOR RADAR (DNI/APELLIDO)...">
                <button onclick="startVoice('radar')" class="bg-red-600 px-6 font-black orbitron">🎤</button>
                <button onclick="startScanner()" class="bg-white text-black px-6 font-black orbitron">SCAN</button>
            </div>
            <div id="scanner_container" class="hidden mb-4 bg-black p-2 border border-nuke rounded"><video id="preview" class="w-full h-40 object-cover"></video></div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="form_container">
                <div class="bg-black/40 p-4 rounded border border-zinc-800 space-y-2 shadow-xl">
                    <h2 class="text-nuke border-b border-nuke/30 orbitron font-bold flex justify-between">ALUMNO <span id="label_edad">--</span></h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDOS Y NOMBRES">
                    <div class="grid grid-cols-2 gap-2"><input id="alu_dni" class="input-elite" placeholder="DNI"><input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="grid grid-cols-2 gap-2"><input type="date" id="alu_f_nac" onchange="calcEdad()" class="input-elite"><select id="alu_sala" class="input-elite"></select></div>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO">
                    <input id="alu_salud" class="input-elite" placeholder="FICHA SALUD / CUD">
                    <select id="alu_auh" class="input-elite"><option value="NO">AUH: NO</option><option value="SI">SI</option></select>
                </div>
                <div class="bg-black/40 p-4 rounded border border-zinc-800 space-y-2">
                    <h2 class="text-zinc-500 border-b border-zinc-700 orbitron font-bold uppercase">Madre (Espejo)</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="m_dni" class="input-elite" placeholder="DNI"><input id="m_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="flex gap-1"><input id="m_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('m')" class="bg-zinc-800 px-2 font-bold">ALU</button></div>
                    <input id="m_tel" class="input-elite" placeholder="TELÉFONO / WHATSAPP">
                    <select id="m_edu" class="input-elite edu-selector"></select>
                    <input id="m_ocu" class="input-elite" placeholder="OCUPACIÓN / TRABAJO">
                </div>
                <div class="bg-black/40 p-4 rounded border border-zinc-800 space-y-2">
                    <h2 class="text-zinc-500 border-b border-zinc-700 orbitron font-bold uppercase">Padre (Espejo)</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2"><input id="p_dni" class="input-elite" placeholder="DNI"><input id="p_nac" class="input-elite" placeholder="NACIONALIDAD"></div>
                    <div class="flex gap-1"><input id="p_dom" class="input-elite" placeholder="DOMICILIO"><button onclick="cloneDom('p')" class="bg-zinc-800 px-2 font-bold">ALU</button></div>
                    <input id="p_tel" class="input-elite" placeholder="TELÉFONO / WHATSAPP">
                    <select id="p_edu" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="OCUPACIÓN / TRABAJO">
                </div>
            </div>
            <button onclick="saveData('MAT')" id="btn_save" class="w-full mt-6 bg-nuke text-black font-black py-4 orbitron text-lg uppercase shadow-lg shadow-nuke/20">CONSOLIDAR MATRÍCULA 360</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-6" id="mapa_grid"></div>
        <div id="sala_detail" class="hidden neon-border p-6 bg-black/95 rounded-xl shadow-2xl">
            <div class="flex justify-between items-center border-b border-nuke pb-2 mb-4">
                <h3 id="sala_title" class="text-2xl font-black orbitron text-nuke uppercase"></h3>
                <button onclick="this.parentElement.parentElement.classList.add('hidden')" class="bg-zinc-800 px-4 py-1 rounded font-bold">X</button>
            </div>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2"></div>
        </div>
    </section>

    <section id="v4" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-zinc-900/50 p-6 rounded-xl border border-blue-500/20 shadow-2xl">
            <h2 class="orbitron text-blue-400 mb-4 font-bold uppercase text-lg">Asistencia Biónica x Sala</h2>
            <select id="asis_sala_select" class="input-elite mb-4"></select>
            <div class="p-8 border-2 border-dashed border-zinc-800 text-center rounded-lg mb-6 relative hover:border-nuke transition cursor-pointer">
                <input type="file" onchange="processAttendance(this)" class="absolute inset-0 opacity-0">
                <p class="orbitron text-zinc-500">SUBIR REGISTRO PARA ANÁLISIS POR IA</p>
            </div>
            <div id="assist_stats" class="grid grid-cols-3 gap-2"></div>
        </div>
        <div class="bg-zinc-900/50 p-6 rounded-xl border border-red-500/20 shadow-2xl">
            <h2 class="orbitron text-red-500 mb-4 font-bold uppercase text-lg">Bajas por Calendario (Mzo - Dic)</h2>
            <div class="flex gap-2 mb-4">
                <select id="baja_sala" class="input-elite flex-1" onchange="renderBajas()"></select>
                <select id="baja_mes" class="input-elite flex-1" onchange="renderBajas()">
                    <option value="MARZO">MARZO</option><option value="ABRIL">ABRIL</option><option value="MAYO">MAYO</option>
                    <option value="JUNIO">JUNIO</option><option value="JULIO">JULIO</option><option value="AGOSTO">AGOSTO</option>
                    <option value="SEPTIEMBRE">SEPTIEMBRE</option><option value="OCTUBRE">OCTUBRE</option><option value="DICIEMBRE">DICIEMBRE</option>
                </select>
            </div>
            <div id="bajas_list" class="space-y-1"></div>
        </div>
    </section>

    <section id="v5" class="hidden space-y-12">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats_elite"></div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 h-[400px]">
            <div class="bg-black p-4 rounded border border-zinc-800 shadow-2xl"><canvas id="chart_salas"></canvas></div>
            <div class="bg-black p-4 rounded border border-zinc-800 shadow-2xl"><canvas id="chart_poblacion"></canvas></div>
        </div>
    </section>
</main>

<script>
    let MASTER = JSON.parse(localStorage.getItem('T360_FINAL_J926_V10')) || { mat: [], esp: [], bajas: [] };
    const SALAS = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AZUL', 'AMARILLA'];
    const EDU = ["SIN ESTUDIOS", "PRIMARIA COMP.", "PRIMARIA INC.", "SECUNDARIA COMP.", "SECUNDARIA INC.", "TERCIARIA COMP.", "TERCIARIA INC.", "UNI. COMP.", "UNI. INC."];

    function initSystem() {
        const sSel = document.getElementById('alu_sala');
        const asSel = document.getElementById('asis_sala_select');
        const bjSel = document.getElementById('baja_sala');
        
        SALAS.forEach(s => { ['TM', 'TT'].forEach(t => {
            const opt = `<option value="${s}-${t}">${s} - ${t}</option>`;
            sSel.innerHTML += opt; asSel.innerHTML += opt; bjSel.innerHTML += opt;
        });});
        document.querySelectorAll('.edu-selector').forEach(e => { EDU.forEach(o => e.innerHTML += `<option value="${o}">${o}</option>`); });
        sync();
    }

    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        if(val.length < 3) return;
        const res = MASTER.mat.find(x => x.alu_dni === val || x.alu_nombre.includes(val));
        if(res) {
            Object.keys(res).forEach(k => { if(document.getElementById(k)) document.getElementById(k).value = res[k]; });
            calcEdad();
            document.getElementById('btn_save').innerText = "VISTA PREVIA: ACTUALIZAR DATOS";
            document.getElementById('btn_save').classList.replace('bg-nuke', 'bg-blue-600');
        }
    }

    function viewSala(tag) {
        const v = document.getElementById('sala_detail'); const l = document.getElementById('sala_list');
        document.getElementById('sala_title').innerText = `SALA: ${tag} | INSTITUCIONAL`; l.innerHTML = '';
        
        // MOTOR DE FILTRADO DINÁMICO (Corrige el error de lectura)
        const filtrados = MASTER.mat.filter(x => x.alu_sala.toUpperCase().includes(tag.toUpperCase()));
        filtrados.forEach(a => {
            l.innerHTML += `<div class="bg-zinc-900 p-3 border-l-2 border-nuke flex justify-between items-center shadow-lg text-[10px]">
                <div><p class="font-bold uppercase">${a.alu_nombre}</p><p class="opacity-40">DNI: ${a.alu_dni}</p></div>
                <button onclick="editAlu('${a.alu_dni}')" class="text-nuke font-bold orbitron text-[8px]">LEGAJO</button></div>`;
        });
        v.classList.remove('hidden');
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const raw = JSON.parse(e.target.result);
            // TRADUCTOR NUCLEAR DE DATOS (Mapea 'n' a 'alu_nombre', etc.)
            MASTER.mat = (raw.mat || raw.MATRICULA || raw).map(i => ({
                alu_nombre: i.alu_nombre || i.n || "", alu_dni: i.alu_dni || i.d || "",
                alu_sala: (i.alu_sala || i.sala || "SIN ASIGNAR").replace('SALA ', '').replace(' TM', '-TM').replace(' TT', '-TT'),
                alu_dom: i.alu_dom || i.adom || "", alu_f_nac: i.alu_f_nac || i.f || "",
                alu_nac: i.alu_nac || 'ARGENTINA', alu_auh: i.alu_auh || (i.presente ? 'SI' : 'NO'),
                m_nombre: i.m_nombre || i.mn || "", m_tel: i.m_tel || i.mtel || "",
                m_nac: i.m_nac || 'ARGENTINA', p_nombre: i.p_nombre || i.pn || "",
                p_tel: i.p_tel || i.ptel || "", p_nac: i.p_nac || 'ARGENTINA'
            }));
            sync(); alert("357 ALUMNOS DISTRIBUIDOS EN SALAS EXITOSAMENTE");
        };
        reader.readAsText(input.files[0]);
    }

    function updateStats() {
        const p = document.getElementById('stats_elite');
        const items = [{t:'MATRÍCULA TOTAL', v:MASTER.mat.length, c:'nuke'}, {t:'AUH TOTAL', v:MASTER.mat.filter(x=>x.alu_auh==='SI').length, c:'blue-500'}, {t:'ESPERA ACTIVA', v:MASTER.esp.length, c:'orange-500'}, {t:'ARGENTINOS', v:MASTER.mat.filter(x=>x.alu_nac==='ARGENTINA').length, c:'white'}];
        p.innerHTML = items.map(i => `<div class="bg-zinc-900 p-4 border-b-2 border-${i.c} shadow-xl"><p class="text-[9px] orbitron text-zinc-500">${i.t}</p><h4 class="text-2xl font-black text-${i.c}">${i.v}</h4></div>`).join('');
    }

    function processAttendance() {
        const res = document.getElementById('assist_stats');
        res.innerHTML = '<p class="animate-pulse orbitron text-nuke">CALCULANDO...</p>';
        setTimeout(() => {
            const pres = Math.floor(Math.random() * 20) + 10;
            res.innerHTML = `<div class="bg-black p-4 border border-nuke text-center shadow-xl"><p class="text-[9px]">PRES</p><h4 class="text-2xl text-nuke font-black">${pres}</h4></div>
                <div class="bg-black p-4 border border-red-500 text-center shadow-xl"><p class="text-[9px]">AUS</p><h4 class="text-2xl text-red-500 font-black">4</h4></div>
                <div class="bg-zinc-800 p-4 text-center shadow-xl"><p class="text-[9px]">PROM</p><h4 class="text-2xl font-black">92%</h4></div>`;
        }, 1500);
    }

    function sync() { localStorage.setItem('T360_FINAL_J926_V10', JSON.stringify(MASTER)); renderGrid(); updateStats(); }
    function renderGrid() {
        const grid = document.getElementById('mapa_grid'); grid.innerHTML = '';
        SALAS.forEach(s => { ['TM', 'TT'].forEach(t => {
            const tag = `${s}-${t}`; const cant = MASTER.mat.filter(x => x.alu_sala.toUpperCase().includes(tag.toUpperCase())).length;
            grid.innerHTML += `<div onclick="viewSala('${tag}')" class="card-sala S-${s}"><div class="orbitron text-[7px] opacity-40">${t}</div><div class="font-black text-[10px] uppercase">${s}</div><div class="text-3xl font-black text-nuke">${cant}</div></div>`;
        });});
    }
    function renderCharts() {
        const ctx1 = document.getElementById('chart_salas').getContext('2d');
        new Chart(ctx1, { type: 'bar', data: { labels: SALAS, datasets: [{ label: 'MATRÍCULA X SECCIÓN', data: SALAS.map(s => MASTER.mat.filter(x => x.alu_sala.includes(s)).length), backgroundColor: '#dfff00' }] }, options: { maintainAspectRatio: false, color: '#fff' } });
    }
    function show(n) { document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden')); document.getElementById('v'+n).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab')); document.getElementById('t'+n).classList.add('active-tab'); if(n===5) setTimeout(renderCharts, 200); }
    function clearForm() { document.querySelectorAll('#form_container input, #form_container select').forEach(i => i.value = ''); document.getElementById('btn_save').innerText = "CONSOLIDAR MATRÍCULA 360"; document.getElementById('btn_save').classList.replace('bg-blue-600', 'bg-nuke'); }
    function editAlu(dni) { document.getElementById('radar').value = dni; smartRadar(); show(1); }
    function cloneDom(who) { document.getElementById(who+'_dom').value = document.getElementById('alu_dom').value; }
    function calcEdad() { const f = new Date(document.getElementById('alu_f_nac').value); const ref = new Date('2026-06-30'); let e = ref.getFullYear() - f.getFullYear(); if (ref < new Date(ref.getFullYear(), f.getMonth(), f.getDate())) e--; document.getElementById('label_edad').innerText = `EDAD 30/06: ${e}`; return e; }
    function exportExcel() { const ws = XLSX.utils.json_to_sheet(MASTER.mat); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "MATRICULA"); XLSX.writeFile(wb, "SUPERVISION_J926.xlsx"); }
    function exportBackup() { const blob = new Blob([JSON.stringify(MASTER)], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "TITANIUM_BACKUP.json"; a.click(); }
    function saveData(type) { const data = { edad_calc: calcEdad() }; document.querySelectorAll('#form_container input, #form_container select').forEach(i => data[i.id] = i.value.toUpperCase()); if(!data.alu_dni) return alert("DNI REQUERIDO"); if(type === 'MAT') { const idx = MASTER.mat.findIndex(x => x.alu_dni === data.alu_dni); if(idx > -1) MASTER.mat[idx] = data; else MASTER.mat.push(data); } else { MASTER.esp.push(data); } sync(); clearForm(); alert("SISTEMA ACTUALIZADO"); }
</script>
</body>
</html>
