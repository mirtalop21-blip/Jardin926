<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 PRO | JARDÍN 926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #ccc; font-family: sans-serif; font-size: 12px; }
        .input-elite { background: #000; border: 1px solid #333; padding: 5px; color: var(--nuke); width: 100%; }
        .btn-nuke { background: var(--nuke); color: #000; font-weight: bold; padding: 10px; cursor: pointer; }
        .tab-content { display: none; } .active-tab { display: block; }
        table { width: 100%; border-collapse: collapse; }
        td, th { border: 1px solid #333; padding: 8px; text-align: center; }
    </style>
</head>
<body class="p-4">

    <header class="mb-6 border-b border-zinc-800 pb-4">
        <h1 class="text-xl font-black text-nuke">TITANIUM 360 | JARDÍN 926</h1>
        <div class="flex gap-2 mt-2">
            <button onclick="show('v_legajo')" class="p-2 bg-zinc-800">LEGAJOS</button>
            <button onclick="show('v_asis')" class="p-2 bg-zinc-800">ASISTENCIA 2.0</button>
            <button onclick="show('v_super')" class="p-2 bg-zinc-800">SUPERVISIÓN</button>
        </div>
    </header>

    <!-- SECCIÓN 5: ASISTENCIA 2.0 -->
    <section id="v_asis" class="tab-content">
        <h2 class="text-nuke font-bold mb-4">REGISTRO MENSUAL DE ASISTENCIA</h2>
        <div id="asis_area">
            <select id="sala_asis" class="input-elite mb-4" onchange="renderPlanillaAsistencia()">
                <option value="">SELECCIONE SALA...</option>
                <!-- Opciones cargadas dinámicamente -->
            </select>
            <div id="grid_asis" class="overflow-x-auto"></div>
            <button onclick="calcularPromedioAsistencia()" class="btn-nuke mt-4">CALCULAR PROMEDIOS MENSUALES</button>
        </div>
    </section>

    <!-- SECCIÓN 6: SUPERVISIÓN ÉLITE -->
    <section id="v_super" class="tab-content">
        <h2 class="text-nuke font-bold mb-4">TABLERO DE SUPERVISIÓN</h2>
        <div id="stats_panel" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <!-- Estadísticas dinámicas -->
        </div>
    </section>

    <script>
        let DB = { mat: [] }; 

        function show(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-tab');
            if(id === 'v_super') actualizarSupervision();
        }

        function actualizarSupervision() {
            const total = DB.mat.length;
            const varones = DB.mat.filter(a => a.sexo === 'M').length;
            const mujeres = DB.mat.filter(a => a.sexo === 'F').length;
            const arg = DB.mat.filter(a => a.alu_nac === 'ARG').length;
            
            const panel = document.getElementById('stats_panel');
            panel.innerHTML = `
                <div class="bg-zinc-900 p-4 border border-zinc-700">
                    <p>TOTAL ALUMNOS</p>
                    <h3 class="text-2xl text-nuke">${total}</h3>
                </div>
                <div class="bg-zinc-900 p-4 border border-zinc-700">
                    <p>VARONES / MUJERES</p>
                    <h3 class="text-2xl">${varones} / ${mujeres}</h3>
                </div>
                <div class="bg-zinc-900 p-4 border border-zinc-700">
                    <p>ARGENTINOS</p>
                    <h3 class="text-2xl text-nuke">${arg} (${((arg/total)*100).toFixed(0)}%)</h3>
                </div>
            `;
        }

        function renderPlanillaAsistencia() {
            const grid = document.getElementById('grid_asis');
            const sala = document.getElementById('sala_asis').value;
            const alumnos = DB.mat.filter(a => a.alu_sala === sala);
            
            let html = `<table><tr><th>ALUMNO</th><th>ASISTENCIA MENSUAL</th></tr>`;
            alumnos.forEach(a => {
                html += `<tr><td>${a.alu_nombre}</td><td><input type="number" class="w-16 bg-black text-nuke" placeholder="Días"></td></tr>`;
            });
            html += `</table>`;
            grid.innerHTML = html;
        }

        // --- INICIALIZACIÓN ---
        // (Aquí iría la lógica de carga de tu archivo JSON que ya tienes funcional)
    </script>
</body>
</html>
