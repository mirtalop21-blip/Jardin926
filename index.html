<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 ELITE | OPERATIVO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: monospace; }
        .card { border: 1px solid #333; padding: 10px; margin-bottom: 5px; cursor: pointer; }
        .tab { display: none; }
        .active { display: block; }
    </style>
</head>
<body class="p-4">
    <header class="border-b-2 border-nuke mb-4">
        <h1 class="text-nuke font-black text-xl italic">TITANIUM 360 ELITE - OPERATIVO</h1>
        <input type="file" onchange="cargarJSON(event)" class="text-[9px] bg-zinc-900 p-2">
    </header>

    <nav class="flex gap-4 mb-4 text-[10px] font-black uppercase">
        <button onclick="show('v1')">Legajos</button>
        <button onclick="show('v2')">Salas</button>
        <button onclick="show('v4')">Asistencia</button>
        <button onclick="show('v5')">Supervisión</button>
    </nav>

    <section id="v1" class="tab active">
        <input id="search" onkeyup="buscar()" class="w-full bg-black border border-nuke p-2 mb-2" placeholder="RADAR: DNI O NOMBRE...">
        <div id="lista" class="h-96 overflow-y-auto"></div>
    </section>

    <section id="v2" class="tab">
        <div id="salas_grid" class="grid grid-cols-2 gap-4"></div>
    </section>

    <section id="v4" class="tab">
        <div id="asistencia_nomina"></div>
    </section>

    <section id="v5" class="tab text-[11px]">
        <div id="estadisticas" class="grid grid-cols-2 gap-4"></div>
    </section>

    <script>
        let DATA = [];

        function show(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function cargarJSON(e) {
            const r = new FileReader();
            r.onload = (ev) => {
                const j = JSON.parse(ev.target.result);
                DATA = j.mat;
                renderizar();
            };
            r.readAsText(e.target.files[0]);
        }

        function renderizar() {
            // Renderizar Salas
            const salas = [...new Set(DATA.map(a => a.alu_sala))];
            document.getElementById('salas_grid').innerHTML = salas.map(s => `
                <div class="card bg-zinc-900">
                    <p class="text-nuke font-bold">${s}</p>
                    <p class="text-2xl">${DATA.filter(a => a.alu_sala === s).length}</p>
                </div>
            `).join('');
            
            // Renderizar Supervisión
            const total = DATA.length;
            const auh = DATA.filter(a => a.alu_auh === 'SI').length;
            document.getElementById('estadisticas').innerHTML = `
                <div class="p-4 border">MATRÍCULA: ${total}</div>
                <div class="p-4 border">AUH TOTAL: ${((auh/total)*100).toFixed(1)}%</div>
            `;
        }

        function buscar() {
            const q = document.getElementById('search').value.toUpperCase();
            const res = DATA.filter(a => a.alu_dni.includes(q) || a.alu_nombre.includes(q));
            document.getElementById('lista').innerHTML = res.map(a => `
                <div class="card" onclick="alert('${a.alu_nombre} | Madre: ${a.m_nombre} | Tel: ${a.m_tel}')">
                    ${a.alu_nombre} - ${a.alu_dni}
                </div>
            `).join('');
        }
    </script>
</body>
</html>
