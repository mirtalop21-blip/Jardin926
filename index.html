<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 | PERSISTENCIA TOTAL J926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #0a0a0c; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto'; font-size: 11px; }
        .orbitron { font-family: 'Orbitron'; }
        .input-elite { background: #000; border: 1px solid #333; padding: 10px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); font-weight: bold; }
        .btn-tab { padding: 12px; opacity: 0.5; transition: 0.3s; border-bottom: 2px solid transparent; font-family: 'Orbitron'; font-size: 9px; flex: 1; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.05); }
        .card-sala { cursor: pointer; transition: 0.3s; background: #111; border-top: 4px solid var(--nuke); text-align: center; padding: 10px; border-radius: 4px; }
        .card-sala:hover { background: #1a1a1a; transform: translateY(-3px); }
    </style>
</head>
<body onload="init()">

<header class="p-3 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-4 py-1 font-black orbitron italic">TITANIUM 360</div>
        <span class="text-[9px] orbitron animate-pulse text-nuke">SISTEMA DE GESTIÓN INTEGRAL J926</span>
    </div>
    <div class="flex gap-2">
        <button onclick="exportData()" class="bg-green-700 px-3 py-1 text-[8px] font-bold rounded orbitron">EXPORTAR EXCEL</button>
        <label class="bg-blue-600 px-3 py-1 text-[8px] rounded cursor-pointer font-bold orbitron">IMPORTAR <input type="file" class="hidden" onchange="importData(this)"></label>
    </div>
</header>

<nav class="flex bg-zinc-900 sticky top-[52px] z-[999]">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab">1. CARGA Y EDICIÓN</button>
    <button onclick="show(2)" id="t2" class="btn-tab">2. MAPA DE SALAS</button>
    <button onclick="show(3)" id="t3" class="btn-tab">3. SUPERVISIÓN</button>
</nav>

<main class="p-4">
    <section id="v1" class="max-w-6xl mx-auto">
        <div class="bg-zinc-900/40 p-6 border border-white/10 rounded-lg">
            <div class="flex gap-2 mb-6">
                <input type="text" id="radar" onkeyup="searchRadar()" class="flex-1 bg-black border border-nuke p-3 orbitron uppercase text-nuke" placeholder="BUSCAR POR DNI PARA EDITAR...">
                <button onclick="clearForm()" class="bg-zinc-800 px-4 text-[9px] orbitron">LIMPIAR</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="space-y-3">
                    <h2 class="text-nuke orbitron text-[10px] border-b border-nuke/20 pb-1">DATOS DEL ALUMNO</h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                    <input id="alu_dni" class="input-elite" placeholder="DNI">
                    <input type="date" id="alu_f_nac" class="input-elite">
                    <select id="alu_sala" class="input-elite"></select>
                    <input id="alu_dom" class="input-elite" placeholder="DOMICILIO">
                    <input id="alu_nac" class="input-elite" placeholder="NACIONALIDAD" value="ARGENTINA">
                </div>
                <div class="space-y-3">
                    <h2 class="text-zinc-500 orbitron text-[10px] border-b border-white/10 pb-1">DATOS DE LA MADRE</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <input id="m_dni" class="input-elite" placeholder="DNI">
                    <input id="m_tel" class="input-elite" placeholder="TELÉFONO">
                    <input id="m_dom" class="input-elite" placeholder="DOMICILIO (SI DIFIERE)">
                    <select id="m_edu" class="input-elite edu-list"></select>
                    <input id="m_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
                <div class="space-y-3">
                    <h2 class="text-zinc-500 orbitron text-[10px] border-b border-white/10 pb-1">DATOS DEL PADRE</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <input id="p_dni" class="input-elite" placeholder="DNI">
                    <input id="p_tel" class="input-elite" placeholder="TELÉFONO">
                    <input id="p_dom" class="input-elite" placeholder="DOMICILIO (SI DIFIERE)">
                    <select id="p_edu" class="input-elite edu-list"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
            </div>
            <button id="btn_main" onclick="saveRecord()" class="w-full mt-8 bg-nuke text-black font-black py-4 orbitron hover:scale-[1.01] transition uppercase">Guardar / Actualizar Legajo</button>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div id="grid_salas" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4"></div>
        <div id="detail_sala" class="hidden mt-8 p-6 bg-zinc-900 border-t-2 border-nuke">
            <div class="flex justify-between mb-4">
                <h3 id="selected_sala_title" class="orbitron text-nuke text-xl"></h3>
                <button onclick="closeSala()" class="text-[9px] orbitron bg-white text-black px-2">CERRAR X</button>
            </div>
            <div id="list_alumnos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2"></div>
        </div>
    </section>

    <section id="v3" class="hidden space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="stats_panel"></div>
        <div class="bg-black p-6 border border-white/10 h-[400px]">
            <canvas id="mainChart"></canvas>
        </div>
    </section>
</main>

<script>
    let DATA = JSON.parse(localStorage.getItem('T360_J926_DB')) || [];
    const SALAS = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AZUL', 'AMARILLA'];
    const TURNOS = ['TM', 'TT'];
    const EDU = ['S/D', 'PRIMARIA INC', 'PRIMARIA COMP', 'SECUNDARIA INC', 'SECUNDARIA COMP', 'TERCIARIO', 'UNIVERSITARIO'];

    function init() {
        const s = document.getElementById('alu_sala');
        SALAS.forEach(sala => TURNOS.forEach(turno => {
            let opt = document.createElement('option');
            opt.value = `${sala}-${turno}`; opt.innerText = `${sala} - ${turno}`;
            s.appendChild(opt);
        }));
        document.querySelectorAll('.edu-list').forEach(select => {
            EDU.forEach(e => { let o = document.createElement('option'); o.value = e; o.innerText = e; select.appendChild(o); });
        });
        renderSalas();
    }

    function show(n) {
        document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
        document.getElementById('v'+n).classList.remove('hidden');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
        document.getElementById('t'+n).classList.add('active-tab');
        if(n === 2) renderSalas();
        if(n === 3) renderStats();
    }

    function saveRecord() {
        const alu = {};
        document.querySelectorAll('.input-elite').forEach(i => alu[i.id] = i.value.toUpperCase());
        if(!alu.alu_dni) return alert("DNI REQUERIDO");

        const index = DATA.findIndex(x => x.alu_dni === alu.alu_dni);
        if(index > -1) DATA[index] = alu; else DATA.push(alu);

        localStorage.setItem('T360_J926_DB', JSON.stringify(DATA));
        alert("LEGAJO GUARDADO Y SINCRONIZADO");
        clearForm();
        renderSalas();
    }

    function editLegajo(dni) {
        const alu = DATA.find(x => x.alu_dni === dni);
        if(!alu) return;
        
        // Esta es la parte que corregimos: Inyectar TODOS los campos
        Object.keys(alu).forEach(key => {
            const field = document.getElementById(key);
            if(field) field.value = alu[key];
        });
        
        show(1); // Cambiar a pestaña de carga
        document.getElementById('radar').value = alu.alu_dni;
        document.getElementById('btn_main').innerText = "ACTUALIZAR LEGAJO EXISTENTE";
    }

    function renderSalas() {
        const grid = document.getElementById('grid_salas'); grid.innerHTML = '';
        SALAS.forEach(s => TURNOS.forEach(t => {
            const tag = `${s}-${t}`;
            const count = DATA.filter(x => x.alu_sala === tag).length;
            grid.innerHTML += `<div onclick="openSala('${tag}')" class="card-sala">
                <p class="orbitron text-[8px] opacity-50">${t}</p>
                <p class="font-bold text-[10px]">${s}</p>
                <p class="text-2xl font-black text-nuke">${count}</p>
            </div>`;
        }));
    }

    function openSala(tag) {
        const det = document.getElementById('detail_sala');
        const list = document.getElementById('list_alumnos');
        document.getElementById('selected_sala_title').innerText = "SALA " + tag;
        list.innerHTML = '';
        const filtered = DATA.filter(x => x.alu_sala === tag);
        filtered.forEach(a => {
            list.innerHTML += `<div class="bg-black p-3 border-l-2 border-nuke flex justify-between items-center">
                <div><p class="font-bold text-[10px]">${a.alu_nombre}</p><p class="text-[8px] opacity-40">DNI: ${a.alu_dni}</p></div>
                <button onclick="editLegajo('${a.alu_dni}')" class="bg-nuke text-black px-3 py-1 text-[8px] font-bold orbitron">LEGAJO</button>
            </div>`;
        });
        det.classList.remove('hidden');
    }

    function searchRadar() {
        const val = document.getElementById('radar').value;
        if(val.length > 5) editLegajo(val);
    }

    function clearForm() {
        document.querySelectorAll('.input-elite').forEach(i => i.value = '');
        document.getElementById('btn_main').innerText = "GUARDAR / ACTUALIZAR LEGAJO";
        document.getElementById('alu_nac').value = "ARGENTINA";
    }

    function renderStats() {
        const panel = document.getElementById('stats_panel');
        panel.innerHTML = `
            <div class="bg-zinc-900 p-4 border-b-2 border-nuke text-center">
                <p class="text-[9px] orbitron">MATRÍCULA TOTAL</p>
                <p class="text-3xl font-black">${DATA.length}</p>
            </div>
            <div class="bg-zinc-900 p-4 border-b-2 border-blue-500 text-center">
                <p class="text-[9px] orbitron">TURNO MAÑANA</p>
                <p class="text-3xl font-black">${DATA.filter(x=>x.alu_sala.includes('TM')).length}</p>
            </div>
            <div class="bg-zinc-900 p-4 border-b-2 border-orange-500 text-center">
                <p class="text-[9px] orbitron">TURNO TARDE</p>
                <p class="text-3xl font-black">${DATA.filter(x=>x.alu_sala.includes('TT')).length}</p>
            </div>
        `;
        // Aquí podrías inicializar el Chart.js con los datos de DATA
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const json = JSON.parse(e.target.result);
            DATA = json; localStorage.setItem('T360_J926_DB', JSON.stringify(DATA));
            alert("BASE DE DATOS IMPORTADA CON ÉXITO");
            renderSalas();
        };
        reader.readAsText(input.files[0]);
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(DATA, null, 2)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = "BASE_DATOS_J926_FULL.json"; a.click();
    }
</script>
</body>
</html>
