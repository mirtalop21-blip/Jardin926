<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITANIUM 360 | GESTIÓN INSTITUCIONAL J926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; }
        body { background: var(--bg); color: #e1e1e1; font-family: 'Roboto', sans-serif; font-size: 12px; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .neon-border { border: 1px solid rgba(223, 255, 0, 0.3); box-shadow: 0 0 15px rgba(223, 255, 0, 0.05); }
        .input-elite { background: #000; border: 1px solid #333; padding: 10px; color: var(--nuke); width: 100%; border-radius: 4px; border-left: 3px solid var(--nuke); }
        .input-elite:focus { border-color: var(--nuke); outline: none; box-shadow: 0 0 10px rgba(223, 255, 0, 0.2); }
        .btn-tab { padding: 15px; opacity: 0.5; transition: 0.3s; border-bottom: 2px solid transparent; text-transform: uppercase; font-weight: bold; font-family: 'Orbitron'; font-size: 10px; }
        .active-tab { opacity: 1; border-bottom: 3px solid var(--nuke); color: var(--nuke); background: rgba(223, 255, 0, 0.05); }
        /* Salas Colors */
        .S-ROSA { border-left-color: #ff69b4; } .S-ROJA { border-left-color: #ff0000; }
        .S-NARANJA { border-left-color: #ffa500; } .S-CELESTE { border-left-color: #00d4ff; }
        .S-VIOLETA { border-left-color: #8a2be2; } .S-AMARILLA { border-left-color: #ffff00; }
        .S-VERDE { border-left-color: #32cd32; } .S-AZUL { border-left-color: #0000ff; }
    </style>
</head>
<body onload="initSystem()">

<header class="p-4 flex justify-between items-center bg-black border-b-2 border-nuke sticky top-0 z-[1000]">
    <div class="flex items-center gap-4">
        <div class="bg-nuke text-black px-4 py-2 font-black italic orbitron">TITANIUM 360°</div>
        <div id="status-alert" class="text-[10px] text-zinc-500 animate-pulse">SISTEMA ACTIVO - JARDÍN 926</div>
    </div>
    <div class="flex gap-2">
        <button onclick="exportBackup()" class="bg-indigo-700 px-3 py-2 text-[10px] font-bold rounded">JSON BACKUP</button>
        <label class="bg-blue-700 px-3 py-2 text-[10px] rounded cursor-pointer font-bold uppercase">
            IMPORTAR CARGA <input type="file" class="hidden" onchange="importData(this)">
        </label>
    </div>
</header>

<nav class="flex overflow-x-auto bg-zinc-900/90 sticky top-[62px] z-[999] backdrop-blur-md">
    <button onclick="show(1)" id="t1" class="btn-tab active-tab flex-1">1. LEGAJO 360</button>
    <button onclick="show(2)" id="t2" class="btn-tab flex-1">2. FOTO INTERACTIVA (14 SALAS)</button>
    <button onclick="show(3)" id="t3" class="btn-tab flex-1 text-orange-400">3. ESPERA & ESCANEO</button>
    <button onclick="show(4)" id="t4" class="btn-tab flex-1 text-red-500">4. BAJAS MENSUALES</button>
    <button onclick="show(5)" id="t5" class="btn-tab flex-1 text-nuke">5. SUPERVISIÓN ÉLITE</button>
</nav>

<main class="p-4">
    <section id="v1" class="space-y-4">
        <div class="neon-border p-6 bg-zinc-900/20">
            <div class="flex gap-4 mb-6">
                <input type="text" id="radar" onkeyup="smartRadar()" class="flex-1 bg-black border-2 border-nuke p-4 text-xl font-bold orbitron placeholder-zinc-800 uppercase" placeholder="RADAR: DNI O APELLIDO...">
                <button onclick="scanDNI()" class="bg-nuke text-black px-6 font-black orbitron text-[10px]">ESCANEAR DNI</button>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="form_container">
                <div class="space-y-3 bg-zinc-900/40 p-4 rounded">
                    <h2 class="text-nuke border-b border-nuke/20 pb-1 orbitron font-bold italic uppercase">I. Alumno / Datos Base</h2>
                    <input id="alu_nombre" class="input-elite" placeholder="APELLIDOS Y NOMBRES">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="alu_dni" class="input-elite" placeholder="DNI">
                        <input id="alu_nacionalidad" class="input-elite" placeholder="NACIONALIDAD">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="date" id="alu_f_nac" class="input-elite">
                        <select id="alu_sala" class="input-elite font-bold"></select>
                    </div>
                    <input id="alu_domicilio" class="input-elite" placeholder="DOMICILIO REAL">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="alu_hermanos" class="input-elite" placeholder="CANT. HERMANOS" type="number">
                        <select id="alu_hermanos_jardin" class="input-elite">
                            <option value="NO">¿HERMANOS EN J926? NO</option>
                            <option value="SI">SI, TIENE EN J926</option>
                        </select>
                    </div>
                    <select id="alu_auh" class="input-elite">
                        <option value="NO">COBRA AUH: NO</option>
                        <option value="SI">COBRA AUH: SI</option>
                    </select>
                </div>

                <div class="space-y-3 bg-zinc-900/40 p-4 rounded">
                    <h2 class="text-zinc-500 border-b border-zinc-700 pb-1 orbitron font-bold italic uppercase">II. Madre / Tutor A</h2>
                    <input id="m_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="m_dni" class="input-elite" placeholder="DNI">
                        <input id="m_nacionalidad" class="input-elite" placeholder="NACIONALIDAD">
                    </div>
                    <input id="m_domicilio" class="input-elite" placeholder="DOMICILIO MADRE">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="m_tel1" class="input-elite" placeholder="TELÉFONO 1">
                        <input id="m_tel2" class="input-elite" placeholder="TELÉFONO 2">
                    </div>
                    <select id="m_estudios" class="input-elite edu-selector"></select>
                    <input id="m_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>

                <div class="space-y-3 bg-zinc-900/40 p-4 rounded">
                    <h2 class="text-zinc-500 border-b border-zinc-700 pb-1 orbitron font-bold italic uppercase">III. Padre / Tutor B</h2>
                    <input id="p_nombre" class="input-elite" placeholder="NOMBRE COMPLETO">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="p_dni" class="input-elite" placeholder="DNI">
                        <input id="p_nacionalidad" class="input-elite" placeholder="NACIONALIDAD">
                    </div>
                    <input id="p_domicilio" class="input-elite" placeholder="DOMICILIO PADRE">
                    <div class="grid grid-cols-2 gap-2">
                        <input id="p_tel1" class="input-elite" placeholder="TELÉFONO 1">
                        <input id="p_tel2" class="input-elite" placeholder="TELÉFONO 2">
                    </div>
                    <select id="p_estudios" class="input-elite edu-selector"></select>
                    <input id="p_ocu" class="input-elite" placeholder="TRABAJO / OCUPACIÓN">
                </div>
            </div>

            <div class="flex gap-4 mt-8">
                <button onclick="saveRecord('DB')" class="flex-1 bg-nuke text-black font-black py-4 orbitron text-lg hover:brightness-110 transition">CONSOLIDAR CARGA BIÓNICA</button>
                <button onclick="clearForm()" class="bg-zinc-800 px-10 text-[10px] font-bold orbitron">LIMPIAR</button>
            </div>
        </div>
    </section>

    <section id="v2" class="hidden">
        <div id="t14_grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4"></div>
        <div id="sala_detail" class="hidden mt-8 neon-border p-6 bg-black">
            <h2 id="view_sala_name" class="text-3xl font-black text-nuke orbitron mb-6 italic"></h2>
            <div id="sala_list" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>
    </section>

    <section id="v3" class="hidden bg-orange-950/10 p-6 neon-border">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-orange-500 orbitron font-black text-2xl uppercase">Lista de Espera Activa</h2>
            <button onclick="saveRecord('ESPERA')" class="bg-orange-600 px-6 py-2 text-[10px] font-black">CARGAR A ESPERA</button>
        </div>
        <div id="espera_grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
    </section>

    <section id="v5" class="hidden space-y-8">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-zinc-900 p-6 border-b-4 border-nuke">
                <p class="text-[10px] text-zinc-500 orbitron">MATRÍCULA TOTAL</p>
                <h3 id="stat_total" class="text-4xl font-black text-nuke">0</h3>
            </div>
            <div id="stat_auh" class="bg-zinc-900 p-6 border-b-4 border-blue-500">
                <p class="text-[10px] text-zinc-500 orbitron">POBLACIÓN AUH</p>
                <h3 id="stat_auh_val" class="text-4xl font-black text-blue-500">0</h3>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-zinc-900 p-6 rounded h-[400px]"><canvas id="chartSalas"></canvas></div>
            <div class="bg-zinc-900 p-6 rounded h-[400px]"><canvas id="chartNac"></canvas></div>
        </div>
    </section>
</main>

<script>
    let DB = JSON.parse(localStorage.getItem('J926_MASTER_DB')) || [];
    let ESPERA = JSON.parse(localStorage.getItem('J926_ESPERA_DB')) || [];
    let BAJAS = JSON.parse(localStorage.getItem('J926_BAJAS_DB')) || [];

    const SALAS = ['ROSA', 'ROJA', 'NARANJA', 'CELESTE', 'VIOLETA', 'AMARILLA', 'VERDE', 'AZUL'];
    const ESTUDIOS = ['PRIMARIA COMP.', 'PRIMARIA INCOMP.', 'SECUNDARIA COMP.', 'SECUNDARIA INCOMP.', 'TERCIARIA COMP.', 'TERCIARIA INCOMP.', 'UNIVERSITARIA COMP.', 'UNIVERSITARIA INCOMP.'];

    function initSystem() {
        const selSala = document.getElementById('alu_sala');
        selSala.innerHTML = '<option value="">SELECCIONAR SALA</option>';
        SALAS.forEach(s => {
            ['TM', 'TT'].forEach(t => selSala.innerHTML += `<option value="${s}-${t}">${s} - ${t}</option>`);
        });

        document.querySelectorAll('.edu-selector').forEach(s => {
            s.innerHTML = '<option value="">ESTUDIOS...</option>';
            ESTUDIOS.forEach(e => s.innerHTML += `<option value="${e}">${e}</option>`);
        });

        refresh();
    }

    function refresh() {
        localStorage.setItem('J926_MASTER_DB', JSON.stringify(DB));
        localStorage.setItem('J926_ESPERA_DB', JSON.stringify(ESPERA));
        renderT14();
        updateStats();
    }

    function saveRecord(type) {
        const data = {};
        document.querySelectorAll('#form_container input, #form_container select, #form_container textarea').forEach(el => {
            data[el.id] = el.value.toUpperCase();
        });

        if(!data.alu_dni) return alert("DNI REQUERIDO");

        if(type === 'DB') {
            const idx = DB.findIndex(x => x.alu_dni === data.alu_dni);
            if(idx > -1) DB[idx] = data; else DB.push(data);
            alert("CARGA BIÓNICA COMPLETADA EN MATRÍCULA");
        } else {
            ESPERA.push(data);
            alert("REGISTRADO EN LISTA DE ESPERA");
        }
        
        clearForm();
        refresh();
    }

    function smartRadar() {
        const val = document.getElementById('radar').value.toUpperCase();
        if(val.length < 3) return;
        const res = DB.find(x => x.alu_dni.includes(val) || x.alu_nombre.includes(val)) || ESPERA.find(x => x.alu_dni.includes(val));
        if(res) {
            Object.keys(res).forEach(k => {
                const el = document.getElementById(k);
                if(el) el.value = res[k];
            });
        }
    }

    function renderT14() {
        const grid = document.getElementById('t14_grid');
        grid.innerHTML = '';
        SALAS.forEach(s => {
            ['TM', 'TT'].forEach(t => {
                const tag = `${s}-${t}`;
                const cant = DB.filter(x => x.alu_sala === tag).length;
                grid.innerHTML += `
                    <div onclick="viewSala('${tag}')" class="bg-zinc-900 p-4 border-t-4 S-${s} cursor-pointer hover:bg-zinc-800 transition">
                        <p class="text-[8px] orbitron text-zinc-500">${t}</p>
                        <h3 class="font-black orbitron text-[10px]">${s}</h3>
                        <p class="text-3xl font-black text-nuke">${cant}</p>
                    </div>`;
            });
        });
    }

    function viewSala(tag) {
        const panel = document.getElementById('sala_detail');
        const list = document.getElementById('sala_list');
        document.getElementById('view_sala_name').innerText = `SALA: ${tag}`;
        list.innerHTML = '';
        DB.filter(x => x.alu_sala === tag).forEach(a => {
            list.innerHTML += `
                <div class="bg-zinc-800 p-3 flex justify-between items-center border-l-2 border-nuke">
                    <div class="text-[10px]">
                        <p class="font-black">${a.alu_nombre}</p>
                        <p class="text-zinc-500">DNI: ${a.alu_dni}</p>
                    </div>
                    <button onclick="loadAlu('${a.alu_dni}')" class="bg-nuke text-black px-2 py-1 font-bold text-[9px]">VER</button>
                </div>`;
        });
        panel.classList.remove('hidden');
    }

    function loadAlu(dni) {
        document.getElementById('radar').value = dni;
        smartRadar();
        show(1);
        window.scrollTo(0,0);
    }

    function updateStats() {
        document.getElementById('stat_total').innerText = DB.length;
        document.getElementById('stat_auh_val').innerText = DB.filter(x => x.alu_auh === 'SI').length;
    }

    function exportBackup() {
        const blob = new Blob([JSON.stringify({DB, ESPERA, BAJAS})], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `TITANIUM_360_BACKUP_J926.json`;
        a.click();
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = JSON.parse(e.target.result);
            // Mapeo inteligente para reconocer campos de versiones anteriores o archivos espejo
            const clean = (data.DB || data).map(i => ({
                alu_nombre: i.alu_nombre || i.n || "",
                alu_dni: i.alu_dni || i.d || "",
                alu_nacionalidad: i.alu_nacionalidad || i.nac || "ARGENTINA",
                alu_f_nac: i.alu_f_nac || i.f || "",
                alu_sala: i.alu_sala || i.sala || "",
                alu_domicilio: i.alu_domicilio || i.adom || "",
                alu_hermanos: i.alu_hermanos || 0,
                alu_hermanos_jardin: i.alu_hermanos_jardin || "NO",
                alu_auh: i.alu_auh || "NO",
                m_nombre: i.m_nombre || i.mn || "",
                m_dni: i.m_dni || "",
                m_domicilio: i.m_domicilio || i.adom || "",
                m_tel1: i.m_tel1 || i.mtel || "",
                m_tel2: i.m_tel2 || "",
                m_estudios: i.m_estudios || "",
                m_ocu: i.m_ocu || "",
                p_nombre: i.p_nombre || i.pn || "",
                p_dni: i.p_dni || "",
                p_domicilio: i.p_domicilio || i.adom || "",
                p_tel1: i.p_tel1 || i.ptel || "",
                p_tel2: i.p_tel2 || "",
                p_estudios: i.p_estudios || "",
                p_ocu: i.p_ocu || ""
            }));
            DB = clean;
            refresh();
            alert("IMPORTACIÓN ÉLITE COMPLETADA: " + DB.length + " REGISTROS.");
        };
        reader.readAsText(input.files[0]);
    }

    function show(n) {
        document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-tab'));
        document.getElementById('v'+n).classList.remove('hidden');
        document.getElementById('t'+n).classList.add('active-tab');
        if(n === 5) runCharts();
    }

    function clearForm() { document.querySelectorAll('#form_container input, #form_container select').forEach(i => i.value = ''); }

    function runCharts() {
        const ctx1 = document.getElementById('chartSalas').getContext('2d');
        if(window.c1) window.c1.destroy();
        window.c1 = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: SALAS,
                datasets: [{ label: 'MATRÍCULA POR SALA', data: SALAS.map(s => DB.filter(x => x.alu_sala.includes(s)).length), backgroundColor: '#dfff00' }]
            },
            options: { maintainAspectRatio: false, color: '#fff' }
        });
    }
</script>
</body>
</html>
