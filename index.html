<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 PRO | GESTIÓN ÉLITE J926</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --nuke: #dfff00; --bg: #05070a; --panel: #111; --border: #333; }
        body { background: var(--bg); color: #e1e1e1; font-family: sans-serif; font-size: 11px; }
        .input-elite { background: #000; border: 1px solid var(--border); padding: 8px; color: var(--nuke); width: 100%; text-transform: uppercase; border-radius: 4px; }
        .tab-content { display: none; } .active-tab { display: block; }
        .btn-nuke { background: var(--nuke); color: #000; font-weight: bold; padding: 10px; cursor: pointer; border-radius: 4px; }
        .btn-dark { background: #222; border: 1px solid #555; color: #fff; padding: 8px; cursor: pointer; border-radius: 4px; }
        .toggle-btn { padding: 5px 10px; border-radius: 4px; cursor: pointer; border: 1px solid #555; }
        .presente { background: #15803d; color: white; }
        .ausente { background: #b91c1c; color: white; }
    </style>
</head>
<body class="p-4" onload="initSystem()">

    <header class="mb-4 p-4 bg-zinc-900 border border-zinc-800 rounded flex justify-between items-center">
        <h1 class="text-xl font-black text-nuke italic">TITANIUM 360 | JARDÍN 926</h1>
        <div id="status_db" class="text-gray-400 font-bold">CARGANDO...</div>
    </header>

    <nav class="flex gap-2 mb-6 border-b border-zinc-800 pb-4">
        <button onclick="show('v_legajo')" class="btn-dark">1. LEGAJOS</button>
        <button onclick="show('v_salas')" class="btn-dark">2. SALAS</button>
        <button onclick="show('v_asistencia')" class="btn-dark">3. ASISTENCIA</button>
        <button onclick="show('v_supervision')" class="btn-dark">4. SUPERVISIÓN</button>
    </nav>

    <section id="v_legajo" class="tab-content active-tab">
        <div class="grid md:grid-cols-3 gap-4" id="form_master">
            <div class="p-4 bg-black border border-zinc-800 rounded">
                <h2 class="text-nuke font-bold mb-2">DATOS ALUMNO</h2>
                <input id="alu_nombre" class="input-elite" placeholder="APELLIDO Y NOMBRE">
                <select id="alu_sala" class="input-elite mt-2"></select>
                <button onclick="guardarLegajo()" class="btn-nuke mt-4 w-full">GUARDAR LEGAJO</button>
            </div>
        </div>
    </section>

    <section id="v_salas" class="tab-content">
        <div id="grid_salas" class="grid grid-cols-4 gap-4"></div>
    </section>

    <section id="v_asistencia" class="tab-content">
        <select id="asis_sala" class="input-elite w-full mb-4" onchange="renderPlanillaAsistencia()"></select>
        <table id="grid_asis" class="w-full border border-zinc-800"></table>
        <button onclick="calcularAsistenciaDiaria()" class="btn-nuke mt-4">CALCULAR DÍA</button>
        <div id="asis_resultados" class="mt-4"></div>
    </section>

    <section id="v_supervision" class="tab-content">
        <select id="super_sala_select" class="input-elite w-full mb-4" onchange="actualizarSupervisionSala(this.value)"></select>
        <div id="panel_sala_detalle" class="grid grid-cols-3 gap-4">
            <div id="sala_nac" class="p-4 border border-zinc-800"></div>
            <div id="sala_est" class="p-4 border border-zinc-800"></div>
            <div id="sala_soc" class="p-4 border border-zinc-800"></div>
        </div>
    </section>

    <script>
        let DB = { mat: [], esp: [], bajas: [] };
        const SALAS = ["1ºA", "1ºB", "2ºA", "2ºB", "3ºA", "3ºB", "MEA", "MEB"];

        async function initSystem() {
            const local = JSON.parse(localStorage.getItem('T360_J926_PRO'));
            if(local) DB = local;
            llenarSelects();
            actualizarEstado();
        }

        function show(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-tab');
        }

        function llenarSelects() {
            const selects = ['alu_sala', 'asis_sala', 'super_sala_select'];
            selects.forEach(id => {
                const el = document.getElementById(id);
                el.innerHTML = '<option value="">SELECCIONE SALA...</option>';
                SALAS.forEach(s => el.innerHTML += `<option value="${s}">${s}</option>`);
            });
        }

        function renderPlanillaAsistencia() {
            const sala = document.getElementById('asis_sala').value;
            const tabla = document.getElementById('grid_asis');
            const alumnos = DB.mat.filter(a => a.alu_sala === sala);
            tabla.innerHTML = alumnos.map(a => `
                <tr class="border-b border-zinc-800">
                    <td class="p-2">${a.alu_nombre}</td>
                    <td class="p-2"><button class="toggle-btn presente" onclick="toggleAsis(this)">PRESENTE</button></td>
                </tr>`).join('');
        }

        function toggleAsis(btn) {
            btn.classList.toggle('presente'); btn.classList.toggle('ausente');
            btn.innerText = btn.classList.contains('presente') ? 'PRESENTE' : 'AUSENTE';
        }

        function calcularAsistenciaDiaria() {
            const pres = document.querySelectorAll('.presente').length;
            const total = document.querySelectorAll('.toggle-btn').length;
            document.getElementById('asis_resultados').innerHTML = `Efectividad: ${((pres/total)*100).toFixed(1)}%`;
        }

        function actualizarSupervisionSala(sala) {
            const alus = DB.mat.filter(a => a.alu_sala === sala);
            document.getElementById('sala_nac').innerHTML = "NACIONALIDADES: " + alus.length;
            document.getElementById('sala_est').innerHTML = "DATOS PADRES: " + alus.length;
            document.getElementById('sala_soc').innerHTML = "CASOS AUH/CUD: " + alus.length;
        }

        function guardarLegajo() {
            DB.mat.push({
                alu_nombre: document.getElementById('alu_nombre').value.toUpperCase(),
                alu_sala: document.getElementById('alu_sala').value
            });
            actualizarEstado();
            alert("Legajo guardado");
        }

        function actualizarEstado() {
            localStorage.setItem('T360_J926_PRO', JSON.stringify(DB));
            document.getElementById('status_db').innerText = `TOTAL ALUMNOS: ${DB.mat.length}`;
        }
    </script>
</body>
</html>
