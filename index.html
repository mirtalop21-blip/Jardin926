<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 ELITE - GESTIÓN TOTAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { background: #05070a; color: #e1e1e1; font-family: monospace; }
        .tab { display: none; } .active { display: block; }
        .input-data { background: #000; border: 1px solid #333; padding: 4px; color: #dfff00; }
    </style>
</head>
<body class="p-4">
    <header class="border-b border-lime-400 mb-4 pb-2">
        <h1 class="text-lime-400 font-black">TITANIUM 360 ELITE | AUDITORÍA ACTIVA</h1>
        <input type="file" onchange="cargarMatricula(event)" class="text-[10px] bg-zinc-900 mt-2">
    </header>

    <nav class="flex gap-2 text-[9px] font-black uppercase mb-4">
        <button onclick="show('v1')" class="border p-1">Legajos</button>
        <button onclick="show('v5')" class="border p-1">Supervisión</button>
        <button onclick="show('v6')" class="border p-1">OCR Asistencia</button>
    </nav>

    <div id="v1" class="tab active">
        <input id="search" onkeyup="buscar()" class="input-data w-full" placeholder="BUSCAR DNI O NOMBRE...">
        <div id="visor" class="mt-2 text-[10px]"></div>
    </div>

    <div id="v5" class="tab">
        <div id="metricas" class="grid grid-cols-2 gap-2 text-[10px]"></div>
    </div>

    <div id="v6" class="tab">
        <input type="file" onchange="escanear(event)">
        <div id="ocr_res" class="mt-2 p-2 bg-zinc-900 text-[10px]"></div>
    </div>

    <script>
        let DATA = [];

        function show(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function cargarMatricula(e) {
            const r = new FileReader();
            r.onload = (ev) => {
                DATA = JSON.parse(ev.target.result).mat;
                alert("CARGADOS: " + DATA.length + " ALUMNOS.");
                renderMetricas();
            };
            r.readAsText(e.target.files[0]);
        }

        function renderMetricas() {
            const total = DATA.length;
            const arg = DATA.filter(a => a.alu_nac === "ARG").length;
            const auh = DATA.filter(a => a.alu_auh === "SI").length;
            document.getElementById('metricas').innerHTML = `
                <div class="border p-2">Total Matrícula: ${total}</div>
                <div class="border p-2">Arg: ${arg} (${((arg/total)*100).toFixed(1)}%)</div>
                <div class="border p-2">AUH: ${auh} (${((auh/total)*100).toFixed(1)}%)</div>
            `;
        }

        function buscar() {
            const q = document.getElementById('search').value.toUpperCase();
            const res = DATA.filter(a => a.alu_dni.includes(q) || a.alu_nombre.includes(q));
            document.getElementById('visor').innerHTML = res.map(a => `
                <div class="border-b p-1">
                    ${a.alu_nombre} | Sala: ${a.alu_sala} | Madre: ${a.m_nombre}
                </div>
            `).join('');
        }

        async function escanear(e) {
            const { data: { text } } = await Tesseract.recognize(e.target.files[0], 'spa');
            document.getElementById('ocr_res').innerText = text;
        }
    </script>
</body>
</html>
