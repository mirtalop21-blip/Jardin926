<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TITANIUM 360 | GESTIÓN INSTITUCIONAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-lime-400 font-mono p-4">
    <header class="border-b border-lime-400 pb-2 mb-4">
        <h1 class="text-lime-400 font-black text-lg">TITANIUM 360 | SISTEMA INSTITUCIONAL</h1>
        <input type="file" id="fileInput" onchange="cargarDatos(event)" class="text-[10px] w-full mt-2 border border-lime-400 p-1">
    </header>

    <nav class="flex gap-2 text-[10px] font-bold mb-4">
        <button onclick="cambiarVista('v1')" class="border p-2 hover:bg-lime-900">LEGAJOS</button>
        <button onclick="cambiarVista('v2')" class="border p-2 hover:bg-lime-900">SALAS</button>
        <button onclick="cambiarVista('v3')" class="border p-2 hover:bg-lime-900">ESTADÍSTICAS</button>
    </nav>

    <div id="v1" class="vista hidden">
        <input type="text" id="buscador" onkeyup="buscar()" class="w-full bg-black border p-2 mb-4" placeholder="🔍 BUSCAR DNI O NOMBRE...">
        <div id="contenedorLegajos" class="grid gap-2"></div>
    </div>

    <div id="v2" class="vista hidden">
        <div id="contenedorSalas" class="grid grid-cols-2 gap-4"></div>
    </div>

    <div id="v3" class="vista hidden">
        <div id="contenedorStats" class="p-4 border"></div>
        <button onclick="descargarExcel()" class="mt-4 bg-lime-400 text-black font-black p-4 w-full">DESCARGAR EXCEL OFICIAL</button>
    </div>

    <script>
        let baseDatos = [];

        function cambiarVista(id) {
            document.querySelectorAll('.vista').forEach(v => v.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function cargarDatos(event) {
            const archivo = event.target.files[0];
            const lector = new FileReader();
            lector.onload = function(e) {
                try {
                    const datos = JSON.parse(e.target.result);
                    // Accedemos a la matriz principal. Si el JSON tiene una clave, úsala aquí.
                    baseDatos = datos.mat || datos; 
                    alert("✅ DATOS CARGADOS: " + baseDatos.length + " REGISTROS.");
                    renderizar();
                } catch (error) {
                    alert("❌ ERROR AL LEER JSON: " + error.message);
                }
            };
            lector.readAsText(archivo);
        }

        function renderizar() {
            // Render de Legajos Inicial
            const cont = document.getElementById('contenedorLegajos');
            cont.innerHTML = baseDatos.map(a => `
                <div class="border p-2" onclick="verDetalle('${a.alu_dni}')">
                    ${a.alu_nombre} - ${a.alu_sala}
                </div>
            `).join('');

            // Render de Salas
            const salas = [...new Set(baseDatos.map(a => a.alu_sala))];
            document.getElementById('contenedorSalas').innerHTML = salas.map(s => `
                <div class="border p-4 text-center">SALA ${s} <br> ${baseDatos.filter(a=>a.alu_sala==s).length}</div>
            `).join('');
        }

        function verDetalle(dni) {
            const alu = baseDatos.find(a => a.alu_dni == dni);
            alert("NOMBRE: " + alu.alu_nombre + "\nMADRE: " + alu.m_nombre + "\nSALA: " + alu.alu_sala + "\nTEL: " + alu.m_tel);
        }

        function buscar() {
            const q = document.getElementById('buscador').value.toUpperCase();
            const filtrados = baseDatos.filter(a => a.alu_dni.includes(q) || a.alu_nombre.toUpperCase().includes(q));
            document.getElementById('contenedorLegajos').innerHTML = filtrados.map(a => `
                <div class="border p-2">${a.alu_nombre}</div>
            `).join('');
        }

        function descargarExcel() {
            let csv = "NOMBRE,DNI,SALA,MADRE\n";
            baseDatos.forEach(a => { csv += `${a.alu_nombre},${a.alu_dni},${a.alu_sala},${a.m_nombre}\n`; });
            const blob = new Blob([csv], {type: 'text/csv'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'gestion_institucional.csv'; a.click();
        }
    </script>
</body>
</html>
